# TEMPORARY — dummy package for the uv-migration self-test (PR #60).
# Gives `_selftest-uv.yml` an installable target so it can drive the REAL
# reusable workflows (build / install / coverage / audit / type-check) under
# uv, instead of only raw uv commands. Delete this file together with the
# `selftest_pkg/` directory and `_selftest-uv.yml` before merging to dev.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uv-selftest-dummy"
version = "0.0.0"
description = "Throwaway package exercising gh-automations workflows under uv"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["selftest_pkg*"]
