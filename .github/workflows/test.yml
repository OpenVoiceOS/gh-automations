name: Test

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/**'
  # No paths filter, and ready_for_review in the types. A draft that is
  # marked ready must carry checks, and the answer must not depend on which
  # copy of this file GitHub resolves for the event. A pull request branch
  # cut before this change still carries its own older copy of these
  # triggers, so the two can disagree on the same event; without a paths
  # filter here they cannot.
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: "allow"  # OVOS ships pre-1.0 alphas; resolve prerelease floor-pins like pip did

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install test dependencies
        run: uv pip install pytest pyyaml ovos-plugin-manager
      - name: Run tests
        run: pytest test/ -v
