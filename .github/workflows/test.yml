name: Test Scripts

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'test/**'
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'test/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest ovos-plugin-manager
      - name: Run script tests
        run: pytest test/test_scripts.py -v
