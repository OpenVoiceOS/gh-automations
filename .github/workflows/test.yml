name: Test Scripts

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'test/**'
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/**'
      - 'test/**'
  workflow_dispatch:

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: "allow"  # OVOS ships pre-1.0 alphas; resolve prerelease floor-pins like pip did

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install test dependencies
        run: uv pip install pytest ovos-plugin-manager
      - name: Run script tests
        run: pytest test/test_scripts.py -v
