name: Spec Lint
# Runs ovos-spec-lint against a skill's locale folder to validate it against
# OVOS-INTENT-1 (template syntax) and OVOS-INTENT-2 (file naming and layout).
#
# Follows the same 3-phase pattern as skill-check.yml:
#   continue-on-error → format section → post comment → re-raise
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      python_version:
        type: string
        default: "3.14"
        description: "Python version"
      locale_path:
        type: string
        default: "locale"
        description: "Path to the locale folder (or a single <lang>/ directory)"
      spec_version:
        type: string
        default: ""
        description: >
          OVOS spec version to target. Empty = ovos-spec-lint default.
          Set to '0', '1', '2', or '3' to flag features newer than that version.
      strict:
        type: boolean
        default: false
        description: "Treat warnings as errors (passes --strict to ovos-spec-lint)"
      skip_if_no_locale:
        type: boolean
        default: true
        description: "Silently pass if locale_path does not exist"
      ovos_spec_tools_spec:
        type: string
        default: "ovos-spec-tools"
        description: >
          Pip requirement spec for the linter. Override to pin a version or
          install from a git URL during alpha.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🧪 Spec Lint' section in the shared 'OVOS PR Checks' comment.
          Only runs when the workflow is triggered by a pull_request event.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  spec_lint:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Resolve locale path
        id: resolve
        # `locale_path` defaults to the literal "locale", and no skill caller
        # overrides it. Twelve skills keep their locale tree under the package
        # directory instead (<pkg>/locale), so the path was absent, the skip
        # below fired, and the job passed green without linting anything:
        # three of the twelve carried errors nobody saw. A default that names
        # a path nothing checks measures nothing (T-4696).
        #
        # So an absent path is searched for before it is given up on. A
        # directory named "locale" at depth two is the package layout. The
        # search reports what it found and how, because a green must say what
        # it read. Two matches are ambiguous and fail rather than guess: the
        # caller sets locale_path. No match is still a skip, which is the
        # case `skip_if_no_locale` exists for.
        env:
          LOCALE_PATH: ${{ inputs.locale_path }}
        run: |
          if [ -d "$LOCALE_PATH" ]; then
            printf 'locale path %q given by the caller\n' "$LOCALE_PATH"
            {
              echo "exists=true"
              echo "path=$LOCALE_PATH"
              echo "source=input"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'locale path %q is absent; searching for */locale\n' "$LOCALE_PATH"

          # Depth two only: <pkg>/locale. Dot directories and the usual
          # non-package trees are excluded, so test fixtures and a vendored
          # copy are never mistaken for the skill's own resources.
          mapfile -t found < <(
            find . -mindepth 2 -maxdepth 2 -type d -name locale \
              -not -path './.*' \
              -not -path './test/*' -not -path './tests/*' \
              -not -path './docs/*' -not -path './scripts/*' \
              -printf '%P\n' | sort
          )

          if [ "${#found[@]}" -eq 0 ]; then
            echo "no */locale directory either"
            {
              echo "exists=false"
              echo "path=$LOCALE_PATH"
              echo "source=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#found[@]}" -gt 1 ]; then
            echo "::error::more than one locale directory found; set locale_path to the one to lint"
            printf '  %s\n' "${found[@]}"
            exit 1
          fi

          printf '::notice::locale path %q was absent; linting the discovered %q instead\n' \
            "$LOCALE_PATH" "${found[0]}"
          {
            echo "exists=true"
            echo "path=${found[0]}"
            echo "source=discovered"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if locale folder is missing
        if: ${{ inputs.skip_if_no_locale && steps.resolve.outputs.exists == 'false' }}
        env:
          LOCALE_PATH: ${{ steps.resolve.outputs.path }}
        run: |
          printf 'ℹ️ no locale folder: %q is absent and no */locale was found — spec-lint skipped.\n' \
            "$LOCALE_PATH" > /tmp/spec-lint-section.md
          echo "SKIPPED=true" >> "$GITHUB_ENV"

      - name: Install ovos-spec-tools
        if: ${{ env.SKIPPED != 'true' }}
        env:
          OVOS_SPEC_TOOLS_SPEC: ${{ inputs.ovos_spec_tools_spec }}
        run: |
          uv pip install "$OVOS_SPEC_TOOLS_SPEC"

      - name: Run ovos-spec-lint
        id: lint
        if: ${{ env.SKIPPED != 'true' }}
        # continue-on-error so the PR comment step always runs.
        # The job still fails at the end via the outcome check below.
        continue-on-error: true
        env:
          LOCALE_PATH: ${{ steps.resolve.outputs.path }}
          STRICT: ${{ inputs.strict }}
          SPEC_VERSION: ${{ inputs.spec_version }}
        run: |
          ARGS=("$LOCALE_PATH")
          if [ "$STRICT" = "true" ]; then
            ARGS+=(--strict)
          fi
          if [ -n "$SPEC_VERSION" ]; then
            ARGS+=(--spec-version "$SPEC_VERSION")
          fi
          ovos-spec-lint "${ARGS[@]}" | tee /tmp/spec-lint.out
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Format spec-lint section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' && env.SKIPPED != 'true' }}
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          out = Path("/tmp/spec-lint.out")
          lines = out.read_text().splitlines() if out.exists() else []

          # Last non-empty line is "N error(s), M warning(s)" or "0 errors found".
          summary = ""
          for ln in reversed(lines):
              if ln.strip():
                  summary = ln.strip()
                  break
          findings = [ln for ln in lines if ln.strip() and ln is not summary][:-1] if summary else lines

          out_md = Path("/tmp/spec-lint-section.md")
          if not findings:
              out_md.write_text(f"✅ {summary or 'No findings.'}\n")
          else:
              body = ["**" + summary + "**", "", "```"]
              body.extend(findings)
              body.append("```")
              out_md.write_text("\n".join(body) + "\n")
          PYEOF

      - name: Post spec-lint section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "spec-lint" \
            --title "🧪 Spec Lint" \
            --content-file /tmp/spec-lint-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job after posting the PR comment so the check status is correct.
      - name: Fail job if spec-lint reported errors
        if: ${{ env.SKIPPED != 'true' && steps.lint.outcome == 'failure' }}
        run: |
          echo "ovos-spec-lint reported errors — see report above."
          exit 1
