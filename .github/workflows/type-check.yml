name: Type Check
# Reusable workflow — runs mypy on the repo and posts a 🔎 Type Check section
# to the shared OVOS PR Checks comment.
#
# Informational only — never blocks merges unless fail_on_errors: true.
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      mypy_args:
        type: string
        default: "."
        description: >
          Arguments passed to mypy (e.g. 'my_package' or '. --ignore-missing-imports').
          Default checks the entire repository.
      test_extras:
        type: string
        default: "dev"
        description: >
          Name of the pyproject.toml extras key that declares the package's
          test/typing dependencies. Tried first via 'pip install -e .[<key>]'.
      test_extras_fallback:
        type: string
        default: "test"
        description: "Extras key tried if `test_extras` is not declared. Empty to skip."
      install_extras:
        type: string
        default: ""
        description: >
          Extra dependencies to install after the package install. Accepts a
          bare extras name ('dev'), a bracketed list ('[dev,rl]'), a full
          target ('.[dev]'), or raw pip arguments ('-r requirements/typing.txt').
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before type-checking (space-separated)"
      fail_on_errors:
        type: boolean
        default: false
        description: >
          When true, the job fails if mypy reports any errors.
          Default is false — type check is informational.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a 🔎 Type Check section in the shared OVOS PR Checks comment.
          Only runs when the workflow is triggered by a pull_request event.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  type_check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install System Dependencies
        if: ${{ inputs.system_deps != '' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ${{ inputs.system_deps }}

      - name: Install Dependencies
        run: |
          uv pip install mypy
          PRIMARY="${{ inputs.test_extras }}"
          FALLBACK="${{ inputs.test_extras_fallback }}"
          # uv exits 0 when the package does not declare the extra it was
          # asked for; it only prints a warning. A plain "try PRIMARY, else
          # FALLBACK" chain therefore always stops at PRIMARY, and the test
          # dependencies declared under FALLBACK are never installed. Read the
          # warning to tell a real install from a silent miss.
          try_extra() {
            EXTRA_OUT=$(uv pip install -e ".[$1]" 2>&1) || { echo "$EXTRA_OUT"; return 1; }
            echo "$EXTRA_OUT"
            case "$EXTRA_OUT" in
              *"does not have an extra named"*) return 1 ;;
            esac
            return 0
          }
          if [ -n "$PRIMARY" ] && try_extra "$PRIMARY"; then
            echo "Installed package with [$PRIMARY] extras"
          elif [ -n "$FALLBACK" ] && try_extra "$FALLBACK"; then
            echo "Installed package with [$FALLBACK] extras"
          elif uv pip install -e . 2>/dev/null; then
            echo "Installed package (no test extras found)"
          else
            echo "No installable package found — type-checking source tree directly"
          fi
          # install_extras accepts several caller spellings ("dev", "[dev]",
          # ".[dev]", or raw pip args like "-r reqs.txt"). Callers cannot tell
          # which single form a given reusable workflow expects, and a wrong
          # guess used to abort the job (pip install of a bare extras name
          # fails) before any test ever ran. Normalize all spellings here.
          RAW="${{ inputs.install_extras }}"
          if [ -z "$RAW" ]; then
            NORMALIZED=""
          elif [[ "$RAW" == -* || "$RAW" == */* || "$RAW" == .* ]]; then
            NORMALIZED="$RAW"
          elif [[ "$RAW" == \[* ]]; then
            NORMALIZED=".$RAW"
          else
            NORMALIZED=".[$RAW]"
          fi
          if [ -n "$NORMALIZED" ]; then
            uv pip install $NORMALIZED
          fi

      - name: Run mypy
        id: mypy
        # continue-on-error so the PR comment step always runs.
        # The job still fails at the end via the outcome check below (if fail_on_errors).
        continue-on-error: true
        run: |
          mypy ${{ inputs.mypy_args }} \
            --show-column-numbers \
            --no-error-summary \
            --output=json 2>/dev/null \
            | tee /tmp/mypy-results.json || true
          # The human-readable run keeps mypy's summary line. That line holds
          # the number of source files mypy read, and it is the only proof in
          # the log that this job checked anything at all.
          mypy ${{ inputs.mypy_args }} \
            --show-column-numbers 2>&1 \
            | tee /tmp/mypy-human.txt || true
          # Exit code from human-readable run (not tee)
          mypy ${{ inputs.mypy_args }} --show-column-numbers 2>&1

      # mypy writes one of:
      #   Success: no issues found in 12 source files
      #   Found 3 errors in 2 files (checked 12 source files)
      # Both name the count. No count means mypy read no file, or did not run.
      - name: Count the source files mypy read
        id: mypy_files
        run: |
          python3 - <<'PYEOF'
          import os, re

          try:
              raw = open("/tmp/mypy-human.txt").read()
          except FileNotFoundError:
              raw = ""

          m = re.search(r"(?:no issues found in|checked)\s+(\d+)\s+source files?", raw)
          count = m.group(1) if m else ""

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={count}\n")

          if count:
              print(f"mypy read {count} source files")
          else:
              print("mypy named no source file count")
          PYEOF

      - name: Format type check section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          outcome = os.environ.get("MYPY_OUTCOME", "unknown")
          checked = os.environ.get("MYPY_FILES", "")
          human_path = "/tmp/mypy-human.txt"

          lines = []

          try:
              raw = open(human_path).read().strip()
          except FileNotFoundError:
              raw = ""

          # Count errors and notes from the human output
          error_lines = [l for l in raw.splitlines() if ": error:" in l]
          note_lines = [l for l in raw.splitlines() if ": note:" in l]
          # Summary line (last non-empty line)
          summary_lines = [l for l in raw.splitlines() if l.strip()]
          summary = summary_lines[-1] if summary_lines else ""

          # An empty output is not a clean check. mypy that read no file, or
          # did not run, writes no error line either, so the count decides.
          if not checked:
              lines.append("⚠️ **mypy**: no source file was checked — the job log "
                           "has no file count, so this is not a clean type check")
          elif outcome == "success" or not error_lines:
              lines.append(f"✅ **mypy**: no type errors found in {checked} source files")
              if note_lines:
                  lines.append(f"ℹ️ {len(note_lines)} note(s) — check the job log")
          else:
              lines.append(f"❌ **mypy**: {len(error_lines)} error(s) found "
                           f"in {checked} source files")
              if summary:
                  lines.append(f"> {summary}")

              # Show first 10 errors
              if error_lines:
                  shown = error_lines[:10]
                  lines.append("")
                  lines.append("<details><summary>Errors (showing first {}/{})".format(
                      len(shown), len(error_lines)) + "</summary>")
                  lines.append("")
                  lines.append("```")
                  for l in shown:
                      lines.append(l)
                  lines.append("```")
                  lines.append("")
                  lines.append("</details>")

          if not lines:
              lines.append("⚠️ Type check did not produce output — check the job log.")

          with open("/tmp/type-check-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          MYPY_FILES: ${{ steps.mypy_files.outputs.count }}

      - name: Post type check section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "type_check" \
            --title "🔎 Type Check" \
            --content-file /tmp/type-check-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A job that read no file must not report green. This is a
      # misconfiguration, not a type error, so fail_on_errors does not gate it:
      # a caller that wants type checks off removes the job.
      - name: Fail job if mypy checked no files
        if: ${{ steps.mypy_files.outputs.count == '' || steps.mypy_files.outputs.count == '0' }}
        run: |
          echo "mypy named no source file count, so this job checked nothing."
          echo "Check the mypy_args input against the package layout."
          exit 1

      # Fail the job after posting the PR comment so the check status is correct.
      # Skipped when fail_on_errors is false — type check is informational only.
      - name: Fail job if mypy found errors
        if: ${{ steps.mypy.outcome == 'failure' && inputs.fail_on_errors }}
        run: |
          echo "mypy found type errors — see report above."
          exit 1
