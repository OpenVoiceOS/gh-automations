name: Build Tests
# Reusable workflow for verifying that a Python package builds, installs, and runs tests.
#
# Runs across a configurable matrix of Python versions, verifies the sdist/wheel can be
# built with `uv build`, installs the resulting package, and optionally runs the
# test suite. Posts a summary to the OVOS PR Checks comment.
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      python_versions:
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
        description: "JSON array of Python versions to test against"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before building (space-separated)"
      install_extras:
        type: string
        default: ""
        description: >
          Extra dependencies applied when installing the built wheel. Accepts
          a bare extras name ('test'), a bracketed list ('[dev,test]'), a
          full target ('.[test]'), or raw pip arguments
          ('-r requirements/test.txt').
      pre_install_pip:
        type: string
        default: ""
        description: >
          Optional space-separated pip requirement specs to install BEFORE the
          package build/install step. Use this to override transitive deps with
          git URLs (e.g. for testing against an unreleased version of a sibling
          package). Each whitespace-separated item is passed as a single
          argument to `pip install`, so quoted git URLs are supported.
      test_path:
        type: string
        default: ""
        description: >
          If set, run pytest against this path after installing the package.
          Leave empty to skip test execution (build/install verification only).
      pytest_args:
        type: string
        default: ""
        description: >
          Extra arguments appended to the pytest invocation, e.g.
          '--capture=tee-sys' to keep a crashing test's output visible when
          pytest's default fd-level capture would otherwise swallow it (native
          crashes, SIGABRT). Same name and meaning as on channel-compat.yml.
          Empty by default: no change to the command line.
      test_env:
        type: string
        default: ""
        description: >
          Extra environment variables for the test step, as newline-separated
          KEY=value pairs, e.g. 'PYTHONFAULTHANDLER=1\nRUST_BACKTRACE=full' to
          get a traceback/panic message out of a native crash instead of just
          "Fatal Python error: Aborted". Appended to $GITHUB_ENV before the
          Run Tests step. Empty by default: no vars are added.
      pre_test_command:
        type: string
        default: ""
        description: >
          Command run after the package is installed and before pytest, in the
          repository root. For test dependencies that are not pip packages:
          a model download, a generated fixture, a service the tests talk to.
      espeak_ng_version:
        type: string
        default: ""
        description: >
          Build espeak-ng from source at this tag (for example 1.52.0) before
          the tests and put it on PATH with ESPEAK_DATA_PATH set. The build is
          cached per version and runner. Empty skips it.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🔨 Build Tests' section in the OVOS PR Checks comment.
          Only runs on pull_request events.
# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  # The OVOS ecosystem ships pre-1.0 alphas and relies on prerelease floor-pins
  # (pkg>=X.Ya1). pip honoured those transitively; uv's default mode does not when
  # a package also has stable releases (e.g. ovos-PHAL's ovos-phal-plugin-ipgeo
  # >=0.1.9a1, which has a coexisting stable 0.1.7). Allow prereleases so the
  # floor-pins resolve as they did under pip — version caps still bound them.
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  build_tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Checkout gh-automations scripts
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev libssl-dev ${{ inputs.system_deps }}

      - name: Install Build Tools
        run: uv pip install build wheel

      - name: Pre-install pip requirements
        if: ${{ inputs.pre_install_pip != '' }}
        run: |
          # shellcheck disable=SC2086
          uv pip install ${{ inputs.pre_install_pip }}

      - name: Build Distribution Packages
        id: build
        run: |
          uv build

      - name: Install Built Package
        id: install
        run: |
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          # install_extras accepts several caller spellings ("dev", "[dev]",
          # ".[dev]", or raw pip args like "-r reqs.txt"). Callers cannot
          # tell which single form a given reusable workflow expects, and a
          # wrong guess used to abort the job before any test ever ran.
          RAW="${{ inputs.install_extras }}"
          SUFFIX=""
          RAWARGS=""
          if [ -z "$RAW" ]; then
            :
          elif [[ "$RAW" == -* || "$RAW" == */* ]]; then
            RAWARGS="$RAW"
          elif [[ "$RAW" == .\[*\] ]]; then
            SUFFIX="${RAW#.}"
          elif [[ "$RAW" == \[*\] ]]; then
            SUFFIX="$RAW"
          else
            SUFFIX="[$RAW]"
          fi
          if [ -n "$WHEEL" ]; then
            if [ -n "$SUFFIX" ]; then
              uv pip install "${WHEEL}${SUFFIX}"
            else
              uv pip install "$WHEEL"
            fi
            if [ -n "$RAWARGS" ]; then
              uv pip install $RAWARGS
            fi
          else
            uv pip install dist/*.tar.gz 2>/dev/null || { echo "No dist files found"; exit 1; }
          fi

      - name: Configure test environment
        if: ${{ inputs.test_path != '' && inputs.test_env != '' }}
        run: |
          echo "${{ inputs.test_env }}" >> "$GITHUB_ENV"

      - name: Restore espeak-ng ${{ inputs.espeak_ng_version }}
        if: ${{ inputs.espeak_ng_version != '' }}
        id: espeak_cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/espeak-ng-${{ inputs.espeak_ng_version }}
          key: espeak-ng-${{ inputs.espeak_ng_version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build espeak-ng ${{ inputs.espeak_ng_version }}
        if: ${{ inputs.espeak_ng_version != '' && steps.espeak_cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get install -yq autoconf automake libtool pkg-config
          bash _gh_automations/scripts/build_espeak_ng.sh "${{ inputs.espeak_ng_version }}" "${{ runner.temp }}/espeak-ng-${{ inputs.espeak_ng_version }}"

      - name: Put espeak-ng on PATH
        if: ${{ inputs.espeak_ng_version != '' }}
        run: |
          PREFIX="${{ runner.temp }}/espeak-ng-${{ inputs.espeak_ng_version }}"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          echo "ESPEAK_DATA_PATH=$PREFIX/share/espeak-ng-data" >> "$GITHUB_ENV"
          "$PREFIX/bin/espeak-ng" --version

      - name: Run Tests
        id: tests
        if: ${{ inputs.test_path != '' }}
        run: |
          # pre_test_command runs in this step, not a step of its own: a
          # separate step is a separate shell process, so an export or a
          # venv activation in it is lost before pytest starts.
          ${{ inputs.pre_test_command }}
          uv pip install pytest
          # shellcheck disable=SC2086
          python -m pytest ${{ inputs.test_path }} -v ${{ inputs.pytest_args }} | tee pytest.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Save result
        if: always()
        run: |
          mkdir -p build-results
          # the pytest summary line, so a green run with half the suite
          # skipped is visible in the artifact and the PR report
          SUMMARY="$(grep -Eo '[0-9]+ (passed|failed|skipped|error|errors|xfailed|xpassed)( |,|$)[^=]*' pytest.log 2>/dev/null | tail -1 | tr -d '\n' || true)"
          echo "${SUMMARY:-no pytest summary}" > build-results/${{ matrix.python-version }}.summary
          STATUS="success"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            STATUS="build_failed"
          elif [ "${{ steps.install.outcome }}" != "success" ]; then
            STATUS="install_failed"
          elif [ "${{ inputs.test_path }}" != "" ] && [ "${{ steps.tests.outcome }}" != "success" ]; then
            STATUS="tests_failed"
          fi
          echo "$STATUS" > build-results/${{ matrix.python-version }}.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-result-${{ matrix.python-version }}
          path: |
            build-results/${{ matrix.python-version }}.txt
            build-results/${{ matrix.python-version }}.summary
          if-no-files-found: ignore
          retention-days: 1

  post_build_report:
    needs: build_tests
    if: ${{ always() && inputs.pr_comment && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout gh-automations
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: results_download
          pattern: build-result-*
          merge-multiple: true

      - name: Format build report
        env:
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          python3 - <<'PYEOF'
          import json, glob, os, re

          versions = json.loads(os.environ["PYTHON_VERSIONS"])
          has_tests = bool(os.environ.get("TEST_PATH", ""))

          def read_one(version, suffix, missing):
              for pattern in [
                  f"results_download/{version}{suffix}",
                  f"results_download/build-result-{version}/{version}{suffix}",
              ]:
                  for path in glob.glob(pattern):
                      with open(path) as f:
                          return f.read().strip()
              return missing

          def read_result(version):
              return read_one(version, ".txt", "unknown")

          def read_summary(version):
              # the pytest counts the matrix job wrote beside the status word.
              # A green run with the whole suite skipped reads "N skipped" here
              # and is the reason this column exists.
              s = read_one(version, ".summary", "")
              if s == "no pytest summary":
                  return ""
              # a stray pipe would split the markdown row
              return s.replace("|", "\\|")

          def ran_tests(summary):
              # True if the pytest counts show a test with a result, False if
              # they show none (a fully skipped suite), None if the job wrote
              # no counts. "N skipped" alone is not a test run, so the headline
              # must not call it a pass.
              if not summary:
                  return None
              counts = {word: int(n) for n, word in re.findall(r"(\d+) ([a-z]+)", summary)}
              ran = ("passed", "failed", "error", "errors", "xpassed", "xfailed")
              return sum(counts.get(k, 0) for k in ran) > 0

          results = {v: read_result(v) for v in versions}
          summaries = {v: read_summary(v) for v in versions}

          # per version: True ran, False all skipped, None no counts
          ran = {v: ran_tests(summaries[v]) for v in versions} if has_tests else {}

          lines = []
          all_ok = all(s == "success" for s in results.values())
          if all_ok:
              if not has_tests:
                  lines.append("✅ All versions build and install. The caller set no test path, thus no test ran.")
              else:
                  none_ran = [v for v in versions if ran[v] is False]
                  unknown = [v for v in versions if ran[v] is None]
                  if len(none_ran) == len(versions):
                      lines.append("⚠\ufe0f All versions build and install, but no test ran. The full suite was skipped.")
                  elif none_ran or unknown:
                      lines.append("⚠\ufe0f All versions build and install.")
                      if none_ran:
                          lines.append("No test ran on: " + ", ".join(none_ran) + ". The suite was skipped there.")
                      if unknown:
                          lines.append("No pytest counts for: " + ", ".join(unknown) + ".")
                  else:
                      lines.append("✅ All versions pass")
              lines.append("")

          headers = ["Python", "Build", "Install"]
          if has_tests:
              headers.append("Tests")
              if any(summaries.values()):
                  headers.append("pytest")

          lines.append("| " + " | ".join(headers) + " |")
          lines.append("|" + "|".join(["---"] * len(headers)) + "|")

          for v in versions:
              s = results[v]
              build_icon = "✅" if s != "build_failed" else "❌"
              install_icon = "✅" if s not in ("build_failed", "install_failed") else ("❌" if s == "install_failed" else "⊘")
              row = [v, build_icon, install_icon]
              if has_tests:
                  if s == "success":
                      # a suite that only skipped is not a green test result
                      row.append("✅" if ran.get(v) else "⊘")
                  else:
                      row.append("⚠️" if s == "tests_failed" else "⊘")
                  if any(summaries.values()):
                      row.append(summaries[v] or "—")
              lines.append("| " + " | ".join(row) + " |")

          if not all_ok:
              lines.append("")
              lines.append("---")
              detail_map = {
                  "build_failed": "`python -m build` failed",
                  "install_failed": "Build OK, install failed",
                  "tests_failed": "Install OK, tests failed",
              }
              for v in versions:
                  s = results[v]
                  if s != "success":
                      lines.append(f"❌ {v}: {detail_map.get(s, s)}")
              lines.append("Check job logs for details.")

          with open("/tmp/build-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Post build section to PR comment
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "build" \
            --title "🔨 Build Tests" \
            --content-file /tmp/build-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
