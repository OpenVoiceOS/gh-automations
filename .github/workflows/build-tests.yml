name: Build Tests
# Reusable workflow for verifying that a Python package builds, installs, and runs tests.
#
# Runs across a configurable matrix of Python versions, verifies the sdist/wheel can be
# built with `python -m build`, installs the resulting package, and optionally runs the
# test suite. Posts a summary to the OVOS PR Checks comment.
#
# gh_token secret: only pass this from a workflow triggered directly by the
# repo's own trusted events (push, pull_request from a same-repo branch,
# workflow_dispatch). NEVER pass it from a pull_request_target-triggered
# caller that checks out fork code -- that hands a live token to
# attacker-controlled build code (a "pwn request"). This workflow refuses
# to run with gh_token set on pull_request_target as a backstop.
on:
  workflow_call:
    inputs:
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      python_versions:
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
        description: "JSON array of Python versions to test against"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before building (space-separated)"
      install_extras:
        type: string
        default: ""
        description: >
          pip extras appended to the install command, e.g. 'test' or 'dev,test'.
          Applied when installing the built wheel.
      pre_install_pip:
        type: string
        default: ""
        description: >
          Optional space-separated pip requirement specs to install BEFORE the
          package build/install step. Use this to override transitive deps with
          git URLs (e.g. for testing against an unreleased version of a sibling
          package). Each whitespace-separated item is passed as a single
          argument to `pip install`, so quoted git URLs are supported.
      test_path:
        type: string
        default: ""
        description: >
          If set, run pytest against this path after installing the package.
          Leave empty to skip test execution (build/install verification only).
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🔨 Build Tests' section in the OVOS PR Checks comment.
          Only runs on pull_request events.
    secrets:
      gh_token:
        required: false
        description: >
          Optional token (PAT/App installation token) used to authenticate git
          clones of PRIVATE org dependencies during pre_install_pip (e.g. an
          unpublished sibling package on a branch). No-op when unset, so existing
          callers are unaffected. SECURITY: the rewrite it installs is scoped to
          the calling repository's own org, but any org member/private dependency
          fetched during pre_install_pip still runs its own build backend with
          that token reachable via git config for the rest of the job. Callers
          MUST NOT pass this secret from a pull_request_target-triggered workflow
          (or any workflow that checks out and builds fork-controlled code) --
          doing so hands the token to attacker-controlled build code. This
          workflow fails fast if it detects that combination.
# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  # The OVOS ecosystem ships pre-1.0 alphas and relies on prerelease floor-pins
  # (pkg>=X.Ya1). pip honoured those transitively; uv's default mode does not when
  # a package also has stable releases (e.g. ovos-PHAL's ovos-phal-plugin-ipgeo
  # >=0.1.9a1, which has a coexisting stable 0.1.7). Allow prereleases so the
  # floor-pins resolve as they did under pip — version caps still bound them.
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  build_tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Checkout gh-automations scripts
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev libssl-dev ${{ inputs.system_deps }}

      - name: Install Build Tools
        run: uv pip install build wheel

      - name: Refuse gh_token on pull_request_target
        if: ${{ github.event_name == 'pull_request_target' && secrets.gh_token != '' }}
        run: |
          echo "::error::gh_token must not be supplied on a pull_request_target run" \
            "-- it would expose the token to fork-controlled build code (pwn request)."
          exit 1

      - name: Authenticate git for private dependencies
        if: ${{ inputs.pre_install_pip != '' }}
        env:
          GH_DEP_TOKEN: ${{ secrets.gh_token }}
          GH_ORG: ${{ github.repository_owner }}
        run: |
          if [ -n "${GH_DEP_TOKEN}" ]; then
            git config --global \
              url."https://x-access-token:${GH_DEP_TOKEN}@github.com/${GH_ORG}/".insteadOf \
              "https://github.com/${GH_ORG}/"
            echo "Configured git auth for private dependencies under ${GH_ORG}."
          fi

      - name: Pre-install pip requirements
        if: ${{ inputs.pre_install_pip != '' }}
        run: |
          # shellcheck disable=SC2086
          uv pip install ${{ inputs.pre_install_pip }}

      # The rewrite embeds the token in ~/.gitconfig, where every later step in
      # the job can read it. Drop it as soon as dependency resolution is done.
      - name: Clear git auth for private dependencies
        if: ${{ always() && inputs.pre_install_pip != '' }}
        env:
          GH_DEP_TOKEN: ${{ secrets.gh_token }}
          GH_ORG: ${{ github.repository_owner }}
        run: |
          if [ -n "${GH_DEP_TOKEN}" ]; then
            git config --global --unset-all \
              url."https://x-access-token:${GH_DEP_TOKEN}@github.com/${GH_ORG}/".insteadOf || true
          fi

      - name: Build Distribution Packages
        id: build
        run: |
          uv build

      - name: Install Built Package
        id: install
        run: |
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          EXTRAS="${{ inputs.install_extras }}"
          if [ -n "$WHEEL" ]; then
            if [ -n "$EXTRAS" ]; then
              uv pip install "${WHEEL}[${EXTRAS}]"
            else
              uv pip install "$WHEEL"
            fi
          else
            uv pip install dist/*.tar.gz 2>/dev/null || { echo "No dist files found"; exit 1; }
          fi

      - name: Run Tests
        id: tests
        if: ${{ inputs.test_path != '' }}
        run: |
          uv pip install pytest
          python -m pytest ${{ inputs.test_path }} -v

      - name: Save result
        if: always()
        run: |
          mkdir -p build-results
          STATUS="success"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            STATUS="build_failed"
          elif [ "${{ steps.install.outcome }}" != "success" ]; then
            STATUS="install_failed"
          elif [ "${{ inputs.test_path }}" != "" ] && [ "${{ steps.tests.outcome }}" != "success" ]; then
            STATUS="tests_failed"
          fi
          echo "$STATUS" > build-results/${{ matrix.python-version }}.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-result-${{ matrix.python-version }}
          path: build-results/${{ matrix.python-version }}.txt
          if-no-files-found: ignore
          retention-days: 1

  post_build_report:
    needs: build_tests
    if: ${{ always() && inputs.pr_comment && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout gh-automations
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: results_download
          pattern: build-result-*
          merge-multiple: true

      - name: Format build report
        run: |
          python3 - <<'PYEOF'
          import json, glob

          versions = json.loads('${{ inputs.python_versions }}')
          has_tests = bool("${{ inputs.test_path }}")

          def read_result(version):
              for pattern in [
                  f"results_download/{version}.txt",
                  f"results_download/build-result-{version}/{version}.txt",
              ]:
                  for path in glob.glob(pattern):
                      with open(path) as f:
                          return f.read().strip()
              return "unknown"

          results = {v: read_result(v) for v in versions}

          lines = []
          all_ok = all(s == "success" for s in results.values())
          if all_ok:
              lines.append("✅ All versions pass")
              lines.append("")

          headers = ["Python", "Build", "Install"]
          if has_tests:
              headers.append("Tests")

          lines.append("| " + " | ".join(headers) + " |")
          lines.append("|" + "|".join(["---"] * len(headers)) + "|")

          for v in versions:
              s = results[v]
              build_icon = "✅" if s != "build_failed" else "❌"
              install_icon = "✅" if s not in ("build_failed", "install_failed") else ("❌" if s == "install_failed" else "⊘")
              row = [v, build_icon, install_icon]
              if has_tests:
                  row.append("✅" if s == "success" else ("⚠️" if s == "tests_failed" else "⊘"))
              lines.append("| " + " | ".join(row) + " |")

          if not all_ok:
              lines.append("")
              lines.append("---")
              detail_map = {
                  "build_failed": "`python -m build` failed",
                  "install_failed": "Build OK, install failed",
                  "tests_failed": "Install OK, tests failed",
              }
              for v in versions:
                  s = results[v]
                  if s != "success":
                      lines.append(f"❌ {v}: {detail_map.get(s, s)}")
              lines.append("Check job logs for details.")

          with open("/tmp/build-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Post build section to PR comment
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "build" \
            --title "🔨 Build Tests" \
            --content-file /tmp/build-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
