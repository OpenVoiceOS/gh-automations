name: Publish Alpha Build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      version_file:
        type: string
        default: "version.py"
      setup_py:
        type: string
        default: "setup.py"
        description: "Deprecated. Version is now read from version_file directly."
      branch:
        type: string
        default: "dev"
      publish_prerelease:
        type: boolean
        default: false
      propose_release:
        type: boolean
        default: true
      update_changelog:
        type: boolean
        default: false
      changelog_file:
        type: string
        default: "CHANGELOG.md"
      changelog_max_issues:
        type: number
        default: 50
      publish_pypi:
        type: boolean
        default: false
        description: "Publish to PyPI after version bump"
      notify_matrix:
        type: boolean
        default: false
        description: "Send Matrix notification when a PR is merged"
    outputs:
      version:
        description: Updated version
        value: ${{jobs.bump_version.outputs.version}}
      changelog:
        description: Changelog Contents
        value: ${{jobs.update_changelog.outputs.changelog}}
jobs:
  bump_version:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ${{inputs.runner}}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
      - name: Checkout Scripts Repo
        uses: actions/checkout@v4
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Determine version bump
        id: version_bump
        run: |
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            LABELS=""
          else
            LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r 'map(.name) | join(" ")')
          fi

          if [ -z "$LABELS" ]; then
            LABELS=""
          fi

          echo "Labels: $LABELS"

          MAJOR=0
          MINOR=0
          BUILD=0

          for label in $LABELS; do
            echo "Processing label: $label"
            if [ "$label" == "breaking" ]; then
              MAJOR=1
            elif [ "$label" == "feature" ]; then
              MINOR=1
            elif [ "$label" == "fix" ]; then
              BUILD=1
            fi
          done

          if [ $MAJOR -eq 1 ]; then
            echo "part=major" >> $GITHUB_OUTPUT
          elif [ $MINOR -eq 1 ]; then
            echo "part=minor" >> $GITHUB_OUTPUT
          elif [ $BUILD -eq 1 ]; then
            echo "part=build" >> $GITHUB_OUTPUT
          else
            echo "part=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Increment Version
        id: version
        working-directory: action/github/scripts
        run: |
          python update_version.py ${{ steps.version_bump.outputs.part }} --version-file ../../package/${{ inputs.version_file }}
          echo "version=$(python get_version.py --version-file ../../package/${{ inputs.version_file }})" >> $GITHUB_OUTPUT

      - name: Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Increment Version to ${{ steps.version.outputs.version }}
          branch: ${{ inputs.branch }}
          repository: action/package/

  update_changelog:
    needs: bump_version
    runs-on: ${{inputs.runner}}
    if: ${{ inputs.update_changelog && needs.bump_version.result == 'success' }}
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
      - name: Check Latest Release
        id: latest_release
        uses: pozetroninc/github-action-get-latest-release@v0.7.0
        with:
          repository: ${{ github.repository }}
          excludes: draft,prerelease
        continue-on-error: true
      - name: Generate Changelog
        id: changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: action/package/${{ inputs.changelog_file }}
          futureRelease: ${{needs.bump_version.outputs.version}}
          maxIssues: ${{ inputs.changelog_max_issues }}
          sinceTag: ${{ steps.latest_release.outputs.release }}
      - name: Push Changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Changelog
          repository: action/package/
          branch: ${{ inputs.branch }}

  tag_prerelease:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_prerelease }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
      - name: Create Pre-release
        uses: ncipollo/release-action@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          tag: ${{needs.bump_version.outputs.version}}
          commit: ${{ inputs.branch }}
          prerelease: true
          generateReleaseNotes: true

  propose_release:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.propose_release }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Create and push release branch
        run: |
          VERSION="${{needs.bump_version.outputs.version}}"
          # -B force-creates the branch so retries don't fail if the branch already exists
          git checkout -B release-${VERSION}
          git push origin release-${VERSION} --force
      - name: Open Pull Request from release branch to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{needs.bump_version.outputs.version}}"
          # Check if PR already exists to make this step idempotent on retries
          EXISTING=$(gh pr list --repo "${{ github.repository }}" \
            --head "release-${VERSION}" --base master \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #${EXISTING} — skipping creation"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --title "Release ${VERSION}" \
              --body "Human review requested!" \
              --head "release-${VERSION}" \
              --base master
          fi

  publish_pypi:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_pypi }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Build Tools
        run: python -m pip install build
      - name: Build Distribution Packages
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  notify:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.notify_matrix && github.event.pull_request.merged == true }}
    runs-on: ${{inputs.runner}}
    steps:
      - uses: actions/checkout@v4
      - name: Send message to Matrix
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: 'matrix.org'
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: '!WjxEKjjINpyBRPFgxl:krbel.duckdns.org'
          message: "new ${{ github.event.repository.name }} PR merged! https://github.com/${{ github.repository }}/pull/${{ github.event.number }}"
