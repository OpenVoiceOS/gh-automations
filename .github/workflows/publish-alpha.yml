name: Publish Alpha Build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      version_file:
        type: string
        default: ""
        description: "Path to version.py (relative to repo root). If empty, auto-detects root or pkg/version.py."
      setup_py:
        type: string
        default: "setup.py"
        description: "Deprecated. Version is now read from version_file directly."
      branch:
        type: string
        default: "dev"
        description: "Development branch where changes are made"
      base_branch:
        type: string
        default: "master"
        description: "Target branch for the release PR (e.g. master/main)."
      publish_prerelease:
        type: boolean
        default: false
      propose_release:
        type: boolean
        default: true
      update_changelog:
        type: boolean
        default: false
      changelog_file:
        type: string
        default: "CHANGELOG.md"
      changelog_max_issues:
        type: number
        default: 50
      publish_pypi:
        type: boolean
        default: false
        description: "Publish to PyPI after version bump"
      notify_matrix:
        type: boolean
        default: false
        description: "Send Matrix notification when a PR is merged"
      matrix_channel:
        type: string
        default: "!WjxEKjjINpyBRPFgxl:krbel.duckdns.org"
        description: "Matrix room ID to notify (default: OVOS main channel)"
      matrix_homeserver:
        type: string
        default: "matrix.org"
        description: "Matrix homeserver URL"
      matrix_message:
        type: string
        default: ""
        description: "Custom Matrix message. Leave empty to use the default 'PR merged' message."
      matrix_message_pool:
        type: string
        default: ""
        description: >
          Newline-separated pool of fun messages to randomly prefix the notification.
          One is chosen at random and prepended to the standard message.
          Leave empty to skip. Example: "🎉 Another one!\n🚀 Shipped!"
      skip_bot_prs:
        type: boolean
        default: true
        description: |
          Skip version bumps for PRs opened by known maintenance bots that do not
          change runtime code (allcontributors[bot], pre-commit-ci[bot]).
          Dependency-update bots (renovate[bot], dependabot[bot]) are NOT skipped
          since dep updates should produce a new alpha.
    secrets:
      PYPI_TOKEN:
        required: false
        description: "PyPI API token for publishing. Required when publish_pypi: true."
      MATRIX_TOKEN:
        required: false
        description: "Matrix access token for notifications. Required when notify_matrix: true."
    outputs:
      version:
        description: Updated version
        value: ${{jobs.bump_version.outputs.version}}
      changelog:
        description: Changelog Contents
        value: ${{jobs.update_changelog.outputs.changelog}}
jobs:
  bump_version:
    # Run when a PR is merged OR on manual dispatch.
    # Skip PRs opened by maintenance bots that don't change runtime code (when skip_bot_prs: true).
    # Dependency-update bots (renovate, dependabot) are intentionally NOT skipped — dep updates
    # should produce a new alpha release.
    if: |
      (
        github.event.pull_request.merged == true &&
        (
          !inputs.skip_bot_prs ||
          (
            github.event.pull_request.user.login != 'allcontributors[bot]' &&
            github.event.pull_request.user.login != 'pre-commit-ci[bot]'
          )
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The commit that carries the bump. Every later job checks this out,
      # never the branch head: two runs on one repository race, and the
      # branch head is whatever the other run pushed last (T-2782).
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
          # the retry loop below fetches and pushes
          persist-credentials: true
      - name: Checkout Scripts Repo
        uses: actions/checkout@v7
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Determine version bump
        id: version_bump
        run: |
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            LABELS=""
          else
            LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r 'map(.name) | join(" ")')
          fi

          if [ -z "$LABELS" ]; then
            LABELS=""
          fi

          echo "Labels: $LABELS"

          MAJOR=0
          MINOR=0
          BUILD=0

          for label in $LABELS; do
            echo "Processing label: $label"
            if [ "$label" == "breaking" ]; then
              MAJOR=1
            elif [ "$label" == "feature" ] || [ "$label" == "enhancement" ]; then
              MINOR=1
            elif [ "$label" == "fix" ] || [ "$label" == "bug" ]; then
              BUILD=1
            fi
          done

          if [ $MAJOR -eq 1 ]; then
            echo "part=major" >> $GITHUB_OUTPUT
          elif [ $MINOR -eq 1 ]; then
            echo "part=minor" >> $GITHUB_OUTPUT
          elif [ $BUILD -eq 1 ]; then
            echo "part=build" >> $GITHUB_OUTPUT
          else
            echo "part=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Increment Version and push
        id: version
        working-directory: action/package
        env:
          PART: ${{ steps.version_bump.outputs.part }}
          BRANCH: ${{ inputs.branch }}
          VERSION_FILE: ${{ inputs.version_file }}
          SCRIPTS: ${{ github.workspace }}/action/github/scripts
        run: |
          # Several pull requests merge within a minute and each starts a run.
          # Two runs that read the same version file compute the same next
          # alpha; the second push is rejected ("fetch first") and the run
          # dies, or it lands and a later job builds the other run's version.
          # So the bump is computed from the branch head at push time and
          # pushed at once; a rejected push means another run bumped first,
          # and the loop reads the new head and bumps again (T-2782).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            python "$SCRIPTS/update_version.py" "$PART" --version-file "$VERSION_FILE"
            VERSION="$(python "$SCRIPTS/get_version.py" --version-file "$VERSION_FILE")"
            # -u stages what update_version.py wrote, whatever its path: the
            # input default "" lets the script find the file itself.
            git add -u
            # Two runs that read one head and commit in the same second would
            # write the same tree, parent, author, message and timestamp, so
            # the same sha; the second push would be "up to date" and both
            # runs would carry one version. The run id makes the commit its own.
            git commit -q -m "Increment Version to $VERSION" -m "run ${GITHUB_RUN_ID:-local}"
            if git push origin "HEAD:$BRANCH"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "bumped to $VERSION at $(git rev-parse HEAD) on attempt $attempt"
              exit 0
            fi
            echo "push of $VERSION rejected on attempt $attempt: another run moved $BRANCH, reading it again"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the version bump to $BRANCH after 6 attempts"
          exit 1

  update_changelog:
    needs: bump_version
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    if: ${{ inputs.update_changelog && needs.bump_version.result == 'success' }}
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      # the changelog commit, or the bump commit when there was nothing to commit
      sha: ${{ steps.push_changelog.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.sha }}
          path: action/package/
          persist-credentials: true
      - name: Check Latest Release
        id: latest_release
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          repository: ${{ github.repository }}
          excludes: draft,prerelease
        continue-on-error: true
      - name: Generate Changelog
        id: changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: action/package/${{ inputs.changelog_file }}
          futureRelease: ${{needs.bump_version.outputs.version}}
          maxIssues: ${{ inputs.changelog_max_issues }}
          sinceTag: ${{ steps.latest_release.outputs.release }}
      - name: Push Changelog
        id: push_changelog
        working-directory: action/package
        env:
          BRANCH: ${{ inputs.branch }}
          CHANGELOG: ${{ inputs.changelog_file }}
          BUMP_SHA: ${{ needs.bump_version.outputs.sha }}
        run: |
          # The generated file is kept and committed on top of whatever the
          # branch head is at push time; a rejected push means another run
          # pushed in between, so the head is read again (T-2782).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -- "$CHANGELOG" "$RUNNER_TEMP/changelog.generated"
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            cp -- "$RUNNER_TEMP/changelog.generated" "$CHANGELOG"
            if git diff --quiet -- "$CHANGELOG"; then
              echo "changelog unchanged on $BRANCH"
              echo "sha=$BUMP_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -- "$CHANGELOG"
            git commit -q -m "Update Changelog"
            if git push origin "HEAD:$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "changelog pushed at $(git rev-parse HEAD) on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt: another run moved $BRANCH, reading it again"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the changelog to $BRANCH after 6 attempts"
          exit 1

  tag_prerelease:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_prerelease }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.sha }}
          path: action/package/
      - name: Create Pre-release
        uses: ncipollo/release-action@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          tag: ${{needs.bump_version.outputs.version}}
          # the bump commit, not the branch head another run may have moved
          commit: ${{ needs.bump_version.outputs.sha }}
          prerelease: true
          generateReleaseNotes: true

  propose_release:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.propose_release }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # The changelog commit when there is one, else this run's bump. The
          # changelog lands on whatever head was current at its push time, so
          # under a race it can sit on another run's later bump; the release
          # branch then carries that later version too. That is the shape dev
          # had (the branch head), narrowed to the changelog commit.
          ref: ${{ needs.update_changelog.outputs.sha || needs.bump_version.outputs.sha }}
      - name: Create and push release branch
        run: |
          VERSION="${{needs.bump_version.outputs.version}}"
          # -B force-creates the branch so retries don't fail if the branch already exists
          git checkout -B release-${VERSION}
          git push origin release-${VERSION} --force
      - name: Open Pull Request from release branch to default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{needs.bump_version.outputs.version}}"
          BASE="${{ inputs.base_branch }}"
          echo "Target branch for release PR: ${BASE}"

          # Nothing to propose if the release branch is identical to base (e.g. a
          # bugfix-only alpha, or a retry after base already merged the previous
          # proposal). gh pr create fails with "No commits between X and Y" in
          # that case and would otherwise fail the whole workflow run.
          git fetch origin "${BASE}" --depth=1
          AHEAD=$(git rev-list --count "origin/${BASE}..HEAD")
          if [ "$AHEAD" -eq 0 ]; then
            echo "${BASE} is already up to date with release-${VERSION} — skipping release proposal"
            exit 0
          fi

          # Check if PR already exists to make this step idempotent on retries
          EXISTING=$(gh pr list --repo "${{ github.repository }}" \
            --head "release-${VERSION}" --base "${BASE}" \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #${EXISTING} — skipping creation"
          else
            # Close any earlier release-* proposals still open against this base —
            # each alpha cycle would otherwise leave the previous cycle's PR open
            # forever, since only an exact head-branch match was deduplicated above.
            # This is hygiene, not release-blocking: a close failure is logged and
            # skipped rather than failing the job.
            STALE_PRS=$(gh pr list --repo "${{ github.repository }}" \
              --base "${BASE}" --state open \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-")) | select(.headRefName != "release-'"${VERSION}"'") | .number')
            for PR in $STALE_PRS; do
              echo "Closing superseded release proposal #${PR}"
              gh pr close "${PR}" --delete-branch --repo "${{ github.repository }}" || echo "Failed to close #${PR} — continuing"
            done

            gh pr create \
              --repo "${{ github.repository }}" \
              --title "Release ${VERSION}" \
              --body "Human review requested! This supersedes any earlier open release proposal for this repository." \
              --head "release-${VERSION}" \
              --base "${BASE}"
          fi

  publish_pypi:
    needs:
      - update_changelog
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_pypi }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # the bump commit: a branch head checkout built whatever version a
          # later run had pushed, and the upload failed with "file already
          # exists" while this run's own version never reached PyPI
          ref: ${{ needs.bump_version.outputs.sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Build Distribution Packages
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  notify:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.notify_matrix && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick message
        id: msg
        run: |
          POOL="${{ inputs.matrix_message_pool }}"
          CUSTOM="${{ inputs.matrix_message }}"
          DEFAULT="new ${{ github.event.repository.name }} PR merged! https://github.com/${{ github.repository }}/pull/${{ github.event.number }}"

          if [ -n "$CUSTOM" ]; then
            MSG="$CUSTOM"
          elif [ -n "$POOL" ]; then
            # Pick a random line from the pool and prepend to default
            PREFIX=$(echo -e "$POOL" | shuf -n 1)
            MSG="${PREFIX} — ${DEFAULT}"
          else
            MSG="$DEFAULT"
          fi
          echo "message<<MSGEOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "MSGEOF" >> $GITHUB_OUTPUT

      - name: Send to Matrix
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: |
          MSG="${{ steps.msg.outputs.message }}"
          ROOM_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' '${{ inputs.matrix_channel }}')
          curl -sf -X PUT \
            "https://${{ inputs.matrix_homeserver }}/_matrix/client/v3/rooms/${ROOM_ENC}/send/m.room.message/$(date +%s%N)" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg body "$MSG" '{"msgtype":"m.text","body":$body}')"
