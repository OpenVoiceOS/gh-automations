name: Locale Lint
# Two jobs, two names, so a reader sees which failures are the spec's and
# which are ours. "spec" runs ovos-spec-lint (OVOS-INTENT-2 base names,
# duplicate basenames, malformed templates) over the locale directories and
# fails on findings in files the pull request touches. "policy" runs
# scripts/locale_gate.py, the project's own rules (basename parity with
# en-US, slot survival, dialog completeness), differentially against the
# base branch, once per skill path that holds a locale/ directory, and fails
# on introduced findings. The policy job needs a base to diff against, so it
# runs on pull_request events only; on any other event it prints why and
# passes. locale_gate.py reads <skill>/locale only: a res/ tree gets the spec
# job's checks but no policy run.
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take scripts/locale_gate.py
          from. A caller testing a gh-automations branch passes that branch here.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.12"
      locale_paths:
        type: string
        default: ""
        description: >
          Space-separated locale directories to lint. Empty auto-detects every
          directory named locale/ or res/ that holds .intent, .dialog, .voc,
          .entity or .rx files. The policy job reads locale/ directories only;
          a res/ directory is linted by the spec job and not by the policy job.
      spec_scope:
        type: string
        default: "changed"
        description: >
          "changed" fails the spec job only on findings in files this pull
          request adds or modifies; "all" fails on any finding in scope.

env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: "allow"

jobs:
  spec:
    name: spec (ovos-spec-lint)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv and ovos-spec-tools (1.12.0a1 or newer)
        run: |
          pip install uv
          uv pip install --prerelease=allow "ovos-spec-tools>=1.12.0a1"
      - name: Lint locale directories
        env:
          LOCALE_PATHS: ${{ inputs.locale_paths }}
          SPEC_SCOPE: ${{ inputs.spec_scope }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # "changed" needs a base to diff against. Without one (a push or a
          # dispatch) every finding would count, so the job skips, as policy does.
          if [ "$SPEC_SCOPE" = "changed" ] && [ -z "$BASE_REF" ]; then
            echo "spec lint skipped: spec_scope is changed and there is no base branch (event ${GITHUB_EVENT_NAME:-unknown}); set spec_scope: all to lint every file"
            exit 0
          fi
          if [ -n "$LOCALE_PATHS" ]; then
            targets="$LOCALE_PATHS"
          else
            targets="$(find . -type d \( -name locale -o -name res \) -not -path '*/.*' \
              | while read -r d; do find "$d" -type f \( -name '*.intent' -o -name '*.dialog' -o -name '*.voc' -o -name '*.entity' -o -name '*.rx' \) -print -quit | grep -q . && echo "$d"; done | sort -u | tr '\n' ' ')"
          fi
          echo "targets: ${targets:-none}"
          [ -n "$targets" ] || { echo "0 files in, 0 findings (no locale directories)"; exit 0; }
          n_files=$(for t in $targets; do find "$t" -type f; done | wc -l)
          lint_rc=0
          ovos-spec-lint $targets > lint.out 2>&1 || lint_rc=$?
          grep -E ': (error|warning): ' lint.out > findings.txt || true
          # A nonzero exit with no finding line is a crash, not a clean run.
          if [ "$lint_rc" -ne 0 ] && [ ! -s findings.txt ]; then
            cat lint.out
            echo "ovos-spec-lint exited $lint_rc and wrote no finding line: the linter did not run"
            exit "$lint_rc"
          fi
          if [ "$SPEC_SCOPE" = "changed" ] && [ -n "$BASE_REF" ]; then
            git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD > changed.txt
            grep -F -f changed.txt findings.txt > blocking.txt || true
          else
            cp findings.txt blocking.txt
          fi
          echo "$n_files files in, $(wc -l < findings.txt) findings, $(wc -l < blocking.txt) in files this pull request touches"
          cat findings.txt
          test ! -s blocking.txt

  policy:
    name: locale policy (locale_gate.py)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout gh-automations scripts
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv and ovos-spec-tools (1.12.0a1 or newer)
        run: |
          pip install uv
          uv pip install --prerelease=allow "ovos-spec-tools>=1.12.0a1"
      - name: Run the locale policy gate against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          LOCALE_PATHS: ${{ inputs.locale_paths }}
        run: |
          # locale_gate.py reads <skill_path>/locale only. A skill keeps its
          # locale in its package (<package>/locale), so the gate runs once on
          # the parent of each locale directory, found the way the spec job
          # finds its targets, never on '.', which would read nothing.
          if [ -z "$BASE_REF" ]; then
            echo "policy gate skipped: no base branch (event ${GITHUB_EVENT_NAME:-unknown}); it runs on pull_request events only, where findings are compared with the base"
            exit 0
          fi
          base="origin/$BASE_REF"
          skills="$(python3 _gh_automations/scripts/locale_gate.py --find-skills . \
            --locale-paths "$LOCALE_PATHS" --exclude _gh_automations)"
          if [ -z "$skills" ]; then
            echo "0 locale directories: nothing for the policy gate to read"
            exit 0
          fi
          echo "skill paths: $(echo "$skills" | tr '\n' ' ')"
          rc=0
          while IFS= read -r skill; do
            echo "== locale_gate.py $skill"
            python3 _gh_automations/scripts/locale_gate.py "$skill" --base "$base" || rc=1
          done <<< "$skills"
          exit "$rc"
