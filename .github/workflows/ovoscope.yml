name: Ovoscope End-to-End Tests
# Reusable workflow for running ovoscope end-to-end skill tests.
#
# Installs the skill with its test extras (which must include ovoscope),
# runs pytest against the end2end test directory, parses the JSON report,
# and posts a '🔌 Skill Tests (ovoscope)' section to the OVOS PR Checks comment.
#
# Pipeline plugin auto-installation (CI fallback):
# Skills SHOULD declare pipeline dependencies in pyproject.toml [test] extras.
# The auto-install steps below are a safety net for CI when dependencies are missing.
# - PADACIOSO_PIPELINE: Always available via ovos-workshop (no extra deps needed).
# - ADAPT_PIPELINE: Auto-installs ovos-adapt-parser if require_adapt=true (CI fallback).
# - PADATIOUS_PIPELINE: Auto-installs ovos-padatious if require_padatious=true (CI fallback).
# - M2V_PIPELINE: Auto-installs ovos-m2v-pipeline if require_m2v=true (CI fallback).
# - NEBULENTO_PIPELINE: Auto-installs nebulento if require_nebulento=true (CI fallback).
# - PALAVREADO_PIPELINE: Auto-installs palavreado if require_palavreado=true (CI fallback).
#
# Test extras install: the "Install Package with Test Extras" step installs
# plain ovos-core, which already pulls in Padacioso via ovos-workshop. It
# only reaches for the ovos-core[plugins] extra — which additionally pins
# ovos_padatious — when require_padatious is true, so callers that never
# asked for Padatious never get it installed as a side effect.
#
# Tests that use a missing pipeline will be SKIPPED (via is_pipeline_available()).
# Set require_adapt/require_padatious/require_m2v to fail CI if those pipelines
# are absent instead of silently skipping.
#
# Pre-release validation:
# Set `pre_release: true` to install ovoscope and every required pipeline
# plugin at its latest PyPI prerelease (the alpha channel every OVOS repo
# auto-publishes on merge). Use this to validate against unreleased changes
# in the framework or any engine.
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      test_timeout:
        type: number
        default: 600
        description: >
          Seconds a single test may take before pytest-timeout fails it and
          dumps its stack. The first test that boots a MiniCroft pays the
          Padatious compile: a measured two-skill boot with 37 intents took
          486 s on a cold cache and 21 s warm. The old default of 180 s cut
          that boot and reported a hang that was not one, so the default is
          600 s, above the measured cold cost. The step ceiling is
          timeout_minutes minus five, so this default only fits when
          timeout_minutes is 16 or more; below that the step is cut before
          any per-test timeout can fire, and the job reports a cut rather
          than naming a test. A caller that lowers timeout_minutes lowers
          test_timeout with it. With the intent cache restored the
          same test returns in seconds; a real hang still names the test
          instead of taking the job with it.
      timeout_minutes:
        type: number
        default: 30
        description: >
          Ceiling for the whole job. Most healthy runs take one to three
          minutes and the slowest measured across the fleet takes ten, so
          thirty leaves that one three times its room while a hung run still
          reports within the hour rather than at the runner's own limit. The test step runs under its own timeout five
          minutes below this, so the log says the run was cut.
      pytest_workers:
        type: string
        default: "2"
        description: >
          pytest-xdist worker count for the e2e suite. Each worker boots its own
          in-process MiniCroft and trains its own intent engines. The default is 2:
          with "auto" (4 workers on ubuntu-latest) the parallel trainers starved
          each other, and utterances returned ovos.intent.unmatched or a worker
          crashed. A repository can set a higher value or "auto". "0" runs
          serially (disable xdist).
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      python_version:
        type: string
        default: "3.11"
        description: "Python version to use"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before testing (space-separated)"
      install_extras:
        type: string
        default: "test"
        description: >
          Extra dependencies used when installing the package; the extras
          must pull in ovoscope (e.g. ovoscope>=0.7.0 in [test]). Accepts a
          bare extras name ('test'), a bracketed list ('[dev,test]'), a full
          target ('.[test]'), or raw pip arguments
          ('-r requirements/test.txt').
      pre_install_pip:
        type: string
        default: ""
        description: >
          Optional space-separated pip requirement specs to install BEFORE the
          package install step. Use to override transitive deps with git URLs
          (e.g. to test against an unreleased sibling package). Mirrors the
          build-tests workflow input.
      post_install_pip:
        type: string
        default: ""
        description: >
          Optional space-separated pip requirement specs installed AFTER the
          package + test-extras install, with --force-reinstall --no-deps so the
          dependency resolver cannot revert them. Use to pin an unreleased
          prerelease (e.g. a sibling at the same version as a published wheel)
          that the test-extras resolution would otherwise downgrade.
      test_path:
        type: string
        default: "test/end2end/"
        description: "Path passed to pytest — should point at the end2end directory"
      require_adapt:
        type: boolean
        default: false
        description: >
          Auto-install ovos-adapt-pipeline-plugin and fail CI if installation fails.
          When false, Adapt pipeline tests are skipped if the plugin is absent.
      require_padatious:
        type: boolean
        default: false
        description: >
          Auto-install ovos-padatious (PyPI name) and fail CI if installation fails.
          When false, Padatious pipeline tests are skipped if the plugin is absent.
      require_m2v:
        type: boolean
        default: false
        description: >
          Auto-install ovos-m2v-pipeline and fail CI if installation fails.
          When false, M2V pipeline tests are skipped if the plugin is absent.
      require_nebulento:
        type: boolean
        default: false
        description: >
          Auto-install nebulento and fail CI if installation fails.
          When false, nebulento pipeline tests are skipped if the plugin is absent.
      require_palavreado:
        type: boolean
        default: false
        description: >
          Auto-install palavreado and fail CI if installation fails.
          When false, palavreado pipeline tests are skipped if the plugin is absent.
      pre_release:
        type: boolean
        default: false
        description: >
          Install ovoscope and every required pipeline plugin at its latest
          PyPI prerelease instead of a floor-pinned version. Use to validate
          against unreleased changes in the framework or any engine. Affects
          ovoscope itself (always upgraded to the latest PyPI prerelease when
          this flag is set) and the engines gated by require_adapt /
          require_padatious / require_m2v / require_nebulento /
          require_palavreado.
      bus_coverage:
        type: boolean
        default: true
        description: "Enable bus-level message coverage tracking"
      bus_coverage_include:
        type: string
        default: ""
        description: "Regex pattern of skill_ids to include in bus coverage report"
      bus_coverage_exclude:
        type: string
        default: "^Thread-|^intents$|^skills$|^__core__$"
        description: "Regex pattern of skill_ids to exclude from bus coverage report"
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🔌 Skill Tests (ovoscope)' section in the OVOS PR Checks comment.
          Only runs on pull_request events.

      intent_cache:
        type: boolean
        default: true
        description: >
          Restore and save the Padatious intent cache between runs. Padatious
          compiles every intent with FANN on a cold cache: a measured
          two-skill MiniCroft with 37 intents took 486 s cold and 21 s warm
          from the cache the first run wrote (388 files, 2.3 MB). The cache
          holds a .hash and a .net per intent, so an entry whose intent text
          changed is retrained and the rest is reused.
      intent_cache_lang:
        type: string
        default: "en-US"
        description: >
          The locale the cache key names. Padatious keeps one directory per
          language, so a repository that tests another locale names it here
          and does not share a key with the en-US runs.

      # NOTE: intent-case accuracy gating + lang sharding live in the
      # sibling `intent-case-tests.yml` reusable workflow. Use both
      # workflows in tandem (or only one) depending on what the skill ships.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}
  # Padatious writes its intent cache under $XDG_DATA_HOME. The runner
  # default is $HOME/.local/share; naming the directory here puts it in the
  # workspace, where the cache step can address it and the log can show it.
  XDG_DATA_HOME: ${{ github.workspace }}/.ovos-xdg-data

jobs:
  ovoscope:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install System Dependencies
        if: ${{ inputs.system_deps != '' }}
        run: |
          sudo apt-get update -q
          DEPS="${{ inputs.system_deps }}"
          if [ -n "$DEPS" ]; then
            sudo apt-get install -yq $DEPS
          fi

      - name: Install Pipeline Plugin Dependencies
        run: |
          # Auto-install pipeline plugins as CI fallback.
          # NOTE: Skills should declare these in pyproject.toml [test] extras.
          # This step ensures CI passes if the maintainer forgot to add them.
          #
          # When `pre_release: true`, install each plugin's latest PyPI
          # prerelease instead of a floor-pinned version. Every OVOS repo
          # auto-publishes an alpha to PyPI on merge to dev, so the alpha
          # channel IS the pre-release channel — a git+https ref would bypass
          # the published artifact and can diverge from what users resolve.
          # --force-reinstall replaces an already-installed PyPI version.
          PRE_RELEASE="${{ inputs.pre_release }}"
          if [ "${{ inputs.require_adapt }}" == "true" ]; then
            if [ "$PRE_RELEASE" == "true" ]; then
              echo "Installing ovos-adapt-parser (latest PyPI prerelease)..."
              SRC="ovos-adapt-parser"
              EXTRA="--force-reinstall --upgrade"
            else
              echo "Installing ovos-adapt-parser (CI fallback, prerelease floor)..."
              # Prerelease-floor pin: stable ovos-adapt-parser still caps
              # ovos-workshop<8, unresolvable against published workshop 9.x.
              # The workshop-free line ships as prereleases; the >=…a1 floor
              # makes pip resolve them with no --pre.
              SRC="ovos-adapt-parser>=1.3.3a1"
              EXTRA=""
            fi
            uv pip install $EXTRA "$SRC" || {
              echo "::error::Failed to install ovos-adapt-parser from $SRC"
              echo "::error::Note: Entry point is 'ovos-adapt-pipeline-plugin'"
              echo "::error::Add 'ovos-adapt-parser' to your [test] extras in pyproject.toml"
              exit 1
            }
          fi
          if [ "${{ inputs.require_padatious }}" == "true" ]; then
            if [ "$PRE_RELEASE" == "true" ]; then
              echo "Installing ovos-padatious (latest PyPI prerelease)..."
              SRC="ovos-padatious"
              EXTRA="--force-reinstall --upgrade"
            else
              echo "Installing ovos-padatious (CI fallback, prerelease floor)..."
              # Prerelease-floor pin: stable ovos-padatious still caps
              # ovos-workshop<8 (unresolvable vs published workshop 9.x). The
              # workshop-free line ships as prereleases; the >=…a1 floor makes
              # pip resolve them with no --pre.
              SRC="ovos-padatious>=1.6.2a1"
              EXTRA=""
            fi
            uv pip install $EXTRA "$SRC" || {
              echo "::error::Failed to install ovos-padatious from $SRC"
              echo "::error::Note: Entry point is 'ovos-padatious-pipeline-plugin'"
              echo "::error::Add 'ovos-padatious' to your [test] extras in pyproject.toml"
              exit 1
            }
          fi
          if [ "${{ inputs.require_m2v }}" == "true" ]; then
            if [ "$PRE_RELEASE" == "true" ]; then
              echo "Installing ovos-m2v-pipeline (latest PyPI prerelease)..."
              SRC="ovos-m2v-pipeline"
              EXTRA="--force-reinstall --upgrade"
            else
              echo "Installing ovos-m2v-pipeline (CI fallback)..."
              SRC="ovos-m2v-pipeline"
              EXTRA=""
            fi
            uv pip install $EXTRA "$SRC" || {
              echo "::error::Failed to install ovos-m2v-pipeline from $SRC"
              echo "::error::Add 'ovos-m2v-pipeline' to your [test] extras in pyproject.toml"
              exit 1
            }
          fi
          if [ "${{ inputs.require_nebulento }}" == "true" ]; then
            if [ "$PRE_RELEASE" == "true" ]; then
              echo "Installing nebulento (latest PyPI prerelease)..."
              SRC="nebulento"
              EXTRA="--force-reinstall --upgrade"
            else
              echo "Installing nebulento (CI fallback)..."
              SRC="nebulento"
              EXTRA=""
            fi
            uv pip install $EXTRA "$SRC" || {
              echo "::error::Failed to install nebulento from $SRC"
              echo "::error::Note: Entry point is 'ovos-nebulento-pipeline-plugin'"
              echo "::error::Add 'nebulento' to your [test] extras in pyproject.toml"
              exit 1
            }
          fi
          if [ "${{ inputs.require_palavreado }}" == "true" ]; then
            if [ "$PRE_RELEASE" == "true" ]; then
              echo "Installing palavreado (latest PyPI prerelease)..."
              SRC="palavreado"
              EXTRA="--force-reinstall --upgrade"
            else
              echo "Installing palavreado (CI fallback)..."
              SRC="palavreado"
              EXTRA=""
            fi
            uv pip install $EXTRA "$SRC" || {
              echo "::error::Failed to install palavreado from $SRC"
              echo "::error::Note: Entry point is 'palavreado'"
              echo "::error::Add 'palavreado' to your [test] extras in pyproject.toml"
              exit 1
            }
          fi
          # Show installed pipeline entry points
          python3 -c "import importlib.metadata; eps = importlib.metadata.entry_points(group='opm.pipeline'); print('Installed pipelines:', [ep.name for ep in eps])"

      - name: Pre-install pip requirements
        if: ${{ inputs.pre_install_pip != '' }}
        run: |
          # shellcheck disable=SC2086
          uv pip install ${{ inputs.pre_install_pip }}

      - name: Install Package with Test Extras
        run: |
          uv pip install pytest pytest-json-report pytest-xdist pytest-timeout
          # Bare ovos-core already pulls in ovos-workshop, which hard-pins
          # padacioso, so Padacioso is always available. The [plugins] extra
          # additionally pins ovos_padatious, which every caller that still
          # boots Padatious needs — but installing it unconditionally would
          # reinstall Padatious even when require_padatious is false, so it
          # is only pulled in for that legacy path. Adapt and M2V are handled
          # by the per-engine auto-install steps above.
          if [ "${{ inputs.require_padatious }}" == "true" ]; then
            uv pip install "ovos-core[plugins]"
          else
            uv pip install ovos-core
          fi
          if [ "${{ inputs.pre_release }}" == "true" ]; then
            echo "Installing ovoscope (latest PyPI prerelease)..."
            # ovoscope auto-publishes an alpha to PyPI on every merge to dev,
            # so the alpha channel IS the pre-release channel — a git+https
            # ref would bypass the published artifact and can diverge from
            # what users resolve (and the repo has since moved from
            # TigreGotico/ovoscope to OpenVoiceOS/ovoscope).
            uv pip install --force-reinstall --upgrade ovoscope
          else
            uv pip install ovoscope
          fi
          # install_extras accepts several caller spellings ("dev", "[dev]",
          # ".[dev]", or raw pip args like "-r reqs.txt"). Callers cannot
          # tell which single form a given reusable workflow expects, and a
          # wrong guess used to abort the job before any test ever ran.
          RAW="${{ inputs.install_extras }}"
          if [ -z "$RAW" ]; then
            NORMALIZED="."
          elif [[ "$RAW" == -* || "$RAW" == */* || "$RAW" == .* ]]; then
            NORMALIZED="$RAW"
          elif [[ "$RAW" == \[* ]]; then
            NORMALIZED=".$RAW"
          else
            NORMALIZED=".[$RAW]"
          fi
          uv pip install $NORMALIZED
          # The checked-out source MUST be what gets tested. When the local
          # version equals a published release (e.g. dev is at the same alpha
          # already on PyPI), the prior installs can leave pip resolving the
          # package back to the PyPI wheel, silently discarding the PR's source.
          # Force the local checkout to win, without disturbing resolved deps.
          uv pip install --force-reinstall --no-deps .
          python -c "import ovoscope; print('ovoscope path:', ovoscope.__file__)"

      - name: Post-install pip pins
        if: ${{ inputs.post_install_pip != '' }}
        run: |
          # Re-pin prerelease siblings the test-extras resolution would revert.
          # --no-deps keeps these exact builds without re-resolving (which would
          # pull a same-version published wheel that carries a stricter cap).
          # shellcheck disable=SC2086
          uv pip install --force-reinstall --no-deps ${{ inputs.post_install_pip }}

      - name: Check required pipeline availability
        run: |
          python3 - <<'PYEOF'
          import sys
          import importlib.metadata

          def get_installed_pipeline_bases():
              try:
                  eps = importlib.metadata.entry_points(group="opm.pipeline")
                  return {ep.name for ep in eps}
              except Exception:
                  return set()

          installed = get_installed_pipeline_bases()
          failures = []

          # These checks verify that auto-installation succeeded
          # If require_* is true, the pipeline should already be installed
          # This check provides a clear error message if installation failed

          if "${{ inputs.require_adapt }}" == "true":
              if "ovos-adapt-pipeline-plugin" not in installed:
                  failures.append(
                      "ADAPT_PIPELINE (ovos-adapt-pipeline-plugin) is required but not installed.\n"
                      "Auto-installation failed. Check the 'Install Pipeline Plugin Dependencies' step."
                  )

          if "${{ inputs.require_padatious }}" == "true":
              if "ovos-padatious-pipeline-plugin" not in installed:
                  failures.append(
                      "PADATIOUS_PIPELINE (ovos-padatious-pipeline-plugin) is required but not installed.\n"
                      "Auto-installation failed. Check the 'Install Pipeline Plugin Dependencies' step.\n"
                      "Note: PyPI package name is 'ovos-padatious', entry point is 'ovos-padatious-pipeline-plugin'."
                  )

          if "${{ inputs.require_m2v }}" == "true":
              if "ovos-m2v-pipeline" not in installed:
                  failures.append(
                      "M2V_PIPELINE (ovos-m2v-pipeline) is required but not installed.\n"
                      "Auto-installation failed. Check the 'Install Pipeline Plugin Dependencies' step."
                  )

          if "${{ inputs.require_nebulento }}" == "true":
              if "ovos-nebulento-pipeline-plugin" not in installed:
                  failures.append(
                      "NEBULENTO_PIPELINE (ovos-nebulento-pipeline-plugin) is required but not installed.\n"
                      "Auto-installation failed. Check the 'Install Pipeline Plugin Dependencies' step.\n"
                      "Note: PyPI package name is 'nebulento', entry point is 'ovos-nebulento-pipeline-plugin'."
                  )

          if "${{ inputs.require_palavreado }}" == "true":
              if "palavreado" not in installed:
                  failures.append(
                      "PALAVREADO_PIPELINE (palavreado) is required but not installed.\n"
                      "Auto-installation failed. Check the 'Install Pipeline Plugin Dependencies' step.\n"
                      "Note: PyPI package name is 'palavreado', entry point is 'palavreado'."
                  )

          if failures:
              for msg in failures:
                  print(f"::error::{msg}")
              sys.exit(1)

          print(f"Pipeline check passed. Installed: {sorted(installed)}")
          PYEOF

      - name: Resolve the intent cache key
        id: intent_cache
        if: ${{ inputs.intent_cache }}
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import os
          import sysconfig
          from pathlib import Path

          # The key must change when the intents change and not before. Read
          # the .intent and .entity files Padatious compiles: the ones this
          # checkout ships and the ones the installed skills ship.
          roots = [Path(os.environ["GITHUB_WORKSPACE"])]
          purelib = sysconfig.get_paths().get("purelib")
          if purelib:
              roots.append(Path(purelib))

          seen = {}
          for root in roots:
              if not root.is_dir():
                  continue
              for suffix in ("*.intent", "*.entity"):
                  for f in root.rglob(suffix):
                      try:
                          # Key by root as well: a checked-out skill and its
                          # installed copy share a relative path, and one
                          # would silently shadow the other.
                          seen[(str(root), str(f.relative_to(root)))] = \
                              f.read_bytes()
                      except OSError:
                          continue

          h = hashlib.sha256()
          for key in sorted(seen):
              h.update("\0".join(key).encode())
              h.update(b"\0")
              h.update(hashlib.sha256(seen[key]).digest())
          digest = h.hexdigest()[:16]

          try:
              from importlib.metadata import version
              padatious = version("ovos-padatious")
          except Exception:
              padatious = "absent"

          print(f"intent files hashed: {len(seen)}")
          print(f"ovos-padatious: {padatious}")
          print(f"digest: {digest}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={len(seen)}\n")
              out.write(f"padatious={padatious}\n")
              out.write(f"digest={digest}\n")

          if padatious == "absent" or not seen:
              # Nothing compiles a .intent here: no cache is worth a key.
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("wanted=false\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("wanted=true\n")
          PYEOF

      - name: Padatious intent cache
        if: ${{ inputs.intent_cache && steps.intent_cache.outputs.wanted == 'true' }}
        uses: actions/cache@v4
        with:
          # Padatious appends _domain, _stemmer or _normalized to the
          # directory name for those engine options, so match the whole set.
          path: ${{ env.XDG_DATA_HOME }}/mycroft/intent_cache*
          key: >-
            padatious-${{ inputs.runner }}-py${{ inputs.python_version }}-${{ inputs.intent_cache_lang }}-${{ steps.intent_cache.outputs.padatious }}-${{ steps.intent_cache.outputs.digest }}
          # A partial hit is still useful: Padatious keeps a .hash beside
          # every .net and retrains only the intents whose text moved. The
          # prefix stops at the engine version, and there is deliberately no
          # version-less restore-key: that one matches every ovos-padatious
          # build, so an engine upgrade would restore nets the previous engine
          # trained. Padatious cannot catch that on its own — it salts its
          # per-intent hash with ovos_padatious.__version__, which is a frozen
          # literal that disagrees with the installed version — so it would
          # load the old net instead of retraining. An engine upgrade pays one
          # full cold compile here, which is the right price.
          restore-keys: |
            padatious-${{ inputs.runner }}-py${{ inputs.python_version }}-${{ inputs.intent_cache_lang }}-${{ steps.intent_cache.outputs.padatious }}-

      - name: Run ovoscope tests
        id: run_tests
        # continue-on-error so the PR comment step always runs even on failure
        continue-on-error: true
        run: |
          COV_ARGS=""
          if [ "${{ inputs.bus_coverage }}" == "true" ]; then
            COV_ARGS="--ovoscope-bus-cov --ovoscope-bus-cov-verbose --ovoscope-bus-cov-file=/tmp/ovoscope-bus-coverage.json"
            if [ -n "${{ inputs.bus_coverage_include }}" ]; then
              COV_ARGS="$COV_ARGS --ovoscope-bus-cov-include='${{ inputs.bus_coverage_include }}'"
            fi
            if [ -n "${{ inputs.bus_coverage_exclude }}" ]; then
              COV_ARGS="$COV_ARGS --ovoscope-bus-cov-exclude='${{ inputs.bus_coverage_exclude }}'"
            fi
          fi
          XDIST_ARGS=""
          if [ -n "${{ inputs.pytest_workers }}" ] && [ "${{ inputs.pytest_workers }}" != "0" ]; then
            XDIST_ARGS="-n ${{ inputs.pytest_workers }}"
          fi
          # five minutes below the job ceiling, so this reports before the
          # runner kills the job and takes the reason with it
          step_timeout=$(( ${{ inputs.timeout_minutes }} > 5 ? ${{ inputs.timeout_minutes }} - 5 : 1 ))
          # --timeout-method=thread: a MiniCroft bus thread that never returns
          # is still interrupted, where a signal would only reach the main thread
          # shellcheck disable=SC2086
          timeout --signal=TERM --kill-after=60 "${step_timeout}m" \
            python -m pytest \
              ${{ inputs.test_path }} \
              $XDIST_ARGS \
              --timeout=${{ inputs.test_timeout }} \
              --timeout-method=thread \
              --json-report \
              --json-report-file=/tmp/ovoscope-results.json \
              $COV_ARGS \
              -v
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            {
              echo "CUT: this run was stopped at ${step_timeout} minutes. It did not fail a test;"
              echo "it never finished, so it reported nothing about the change under test."
              echo "A per-test timeout of ${{ inputs.test_timeout }}s should have named the hung test"
              echo "first; if it did not, the hang is outside a test: a MiniCroft that never shut"
              echo "down, or an orphaned process holding the runner. Read the tail of the log for"
              echo "the last test that started. Raising the ceiling does not turn a hang into a pass."
            } >&2
            exit 124
          fi
          exit "$rc"

      - name: Format ovoscope section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          outcome = os.environ["OUTCOME"]

          try:
              with open("/tmp/ovoscope-results.json") as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              data = None

          lines = []

          if data is None:
              lines.append("⚠️ Test results unavailable — check the job log.")
          else:
              summary = data.get("summary", {})
              total   = summary.get("total", 0)
              passed  = summary.get("passed", 0)
              failed  = summary.get("failed", 0)
              errored = summary.get("error", 0)
              skipped = summary.get("skipped", 0)

              all_ok = (failed == 0 and errored == 0)
              icon = "✅" if all_ok else "❌"
              parts = [f"**{passed}/{total}** passed"]
              if failed:
                  parts.append(f"**{failed}** failed")
              if errored:
                  parts.append(f"**{errored}** error{'s' if errored != 1 else ''}")
              if skipped:
                  parts.append(f"{skipped} skipped")
              lines.append(f"{icon} {', '.join(parts)}")

              # Collect test results grouped by class
              tests = data.get("tests", [])
              if tests:
                  # Group by nodeid class prefix
                  by_class: dict[str, list[dict]] = {}
                  for t in tests:
                      node = t.get("nodeid", "")
                      # "test/end2end/test_confucius.py::TestConfuciusAdaptEN::test_quote_intent"
                      parts_node = node.split("::")
                      cls = parts_node[1] if len(parts_node) >= 2 else "Other"
                      by_class.setdefault(cls, []).append(t)

                  lines.append("")
                  for cls, cls_tests in sorted(by_class.items()):
                      cls_passed = sum(1 for t in cls_tests if t.get("outcome") == "passed")
                      cls_total  = len(cls_tests)
                      cls_ok = cls_passed == cls_total
                      cls_icon = "✅" if cls_ok else "❌"
                      summary_line = f"{cls_icon} **{cls}** — {cls_passed}/{cls_total}"

                      # Only show per-test breakdown if something failed
                      failing = [t for t in cls_tests if t.get("outcome") != "passed"]
                      if not failing:
                          lines.append(summary_line)
                      else:
                          lines.append(f"<details><summary>{summary_line}</summary>")
                          lines.append("")
                          lines.append("| Test | Result |")
                          lines.append("|------|--------|")
                          for t in cls_tests:
                              name = t.get("nodeid", "?").split("::")[-1]
                              t_outcome = t.get("outcome", "?")
                              t_icon = "✅" if t_outcome == "passed" else ("⚠️" if t_outcome == "skipped" else "❌")
                              lines.append(f"| `{name}` | {t_icon} {t_outcome} |")
                          lines.append("")
                          # Show longrepr for first failure
                          for t in failing[:3]:
                              name = t.get("nodeid", "?").split("::")[-1]
                              longrepr = ""
                              call = t.get("call", {})
                              if isinstance(call, dict):
                                  longrepr = call.get("longrepr", "")
                              if longrepr:
                                  truncated = longrepr[-800:] if len(longrepr) > 800 else longrepr
                                  lines.append(f"**`{name}` failure:**")
                                  lines.append(f"```\n{truncated.strip()}\n```")
                          lines.append("</details>")

          with open("/tmp/ovoscope-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          OUTCOME: ${{ steps.run_tests.outcome }}

      - name: Format bus coverage section for PR comment
        if: ${{ inputs.pr_comment && inputs.bus_coverage && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          def get_status_bar(pct):
              filled = int(pct / 10)
              bar = "█" * filled + "░" * (10 - filled)
              return f"`{bar}` {pct}%"

          try:
              with open("/tmp/ovoscope-bus-coverage.json") as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              data = None

          lines = []

          if data is None:
              lines.append("⚠️ Bus coverage report unavailable — check the job log.")
          else:
              totals = data.get("totals", {})
              skills = data.get("skills", [])
              
              l_pct = totals.get("listener_coverage_pct", 0)
              l_cov = totals.get("listener_covered", 0)
              l_tot = totals.get("listener_total", 0)
              
              e_tot = totals.get("emitter_total", 0)
              e_obs = totals.get("observed_count", 0)
              e_ass = totals.get("asserted_count", 0)

              # --- Summary Badges ---
              status_icon = "🟢" if l_pct >= 80 else ("🟡" if l_pct >= 50 else "🔴")
              lines.append(f"### {status_icon} Coverage Summary")
              lines.append(f"| Metric | Status | Coverage |")
              lines.append(f"|--------|--------|----------|")
              lines.append(f"| **Listeners** | {get_status_bar(l_pct)} | {l_cov}/{l_tot} handlers |")
              
              e_pct = int(100 * e_obs / e_tot) if e_tot else 0
              lines.append(f"| **Emitters** | {get_status_bar(e_pct)} | {e_obs}/{e_tot} observed |")
              
              a_pct = int(100 * e_ass / e_tot) if e_tot else 0
              lines.append(f"| **Assertions** | {get_status_bar(a_pct)} | {e_ass}/{e_tot} asserted |")
              lines.append("")
              
              if skills:
                  lines.append("#### 📊 Per-Skill Breakdown")
                  lines.append("| Skill | Listeners | Observed | Asserted |")
                  lines.append("|-------|-----------|----------|----------|")
                  for s in skills:
                      sid = s.get("skill_id", "?")
                      lp = s.get("listener_coverage_pct", 0)
                      ls = s.get("listeners", [])
                      l_c = sum(1 for h in ls if h.get("covered"))
                      l_t = len(ls)
                      
                      es = s.get("emitters", [])
                      e_o = sum(1 for e in es if e.get("observed"))
                      e_a = sum(1 for e in es if e.get("asserted"))
                      e_t = len(es)
                      
                      # Color the listener pct
                      lp_str = f"**{lp}%**" if lp < 50 else f"{lp}%"
                      lines.append(f"| `{sid}` | {l_c}/{l_t} ({lp_str}) | {e_o}/{e_t} | {e_a}/{e_t} |")
                  
                  # Optional details
                  lines.append("")
                  lines.append("<details><summary>🔍 Detailed Message Type Breakdown</summary>")
                  lines.append("")
                  for s in skills:
                      sid = s.get("skill_id", "?")
                      lines.append(f"#### `{sid}`")
                      
                      ls = s.get("listeners", [])
                      uncovered = [h for h in ls if not h.get("covered")]
                      covered = [h for h in ls if h.get("covered")]
                      
                      if uncovered:
                          lines.append("**⚠️ Uncovered Listeners:**")
                          # Sort to show intents first as they are most important
                          uncovered.sort(key=lambda x: (not (".intent" in x.get("msg_type") or ":" in x.get("msg_type")), x.get("msg_type")))
                          for h in uncovered:
                              msg = h.get("msg_type")
                              important = " (Intent)" if (".intent" in msg or ":" in msg) else ""
                              lines.append(f"- ❌ `{msg}`{important}")
                      
                      if covered:
                          lines.append("**✅ Covered Listeners:**")
                          covered.sort(key=lambda x: x.get("msg_type"))
                          for h in covered:
                              cnt = h.get("invocation_count", 0)
                              lines.append(f"- ✅ `{h.get('msg_type')}` ({cnt}x)")
                      
                      es = s.get("emitters", [])
                      if es:
                          lines.append("")
                          lines.append("**📤 Emitters:**")
                          es.sort(key=lambda x: (not x.get("observed"), x.get("msg_type")))
                          for e in es:
                              o_mark = "✅" if e.get("observed") else "❌"
                              a_mark = " (Asserted ✅)" if e.get("asserted") else " (**Not Asserted** ⚠️)"
                              cnt = e.get("observed_count", 0)
                              lines.append(f"- {o_mark} `{e.get('msg_type')}`{a_mark}")
                      lines.append("---")
                  lines.append("</details>")

          with open("/tmp/ovoscope-bus-coverage-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Post ovoscope sections to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          # Post the main test results
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "ovoscope" \
            --title "🔌 Skill Tests (ovoscope)" \
            --content-file /tmp/ovoscope-section.md

          # Post the bus coverage report (if enabled)
          if [ "${{ inputs.bus_coverage }}" == "true" ] && [ -f /tmp/ovoscope-bus-coverage-section.md ]; then
            python3 _gh_automations/scripts/update_pr_comment.py \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --section-id "bus-coverage" \
              --title "🚌 Bus Coverage" \
              --content-file /tmp/ovoscope-bus-coverage-section.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job after posting the PR comment so check status is correct.
      - name: Fail job if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "Ovoscope end-to-end tests failed — see report above."
          exit 1
