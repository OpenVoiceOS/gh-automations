name: Self Check
# This repository's type-check workflow, run against this repository.
#
# The job checks a real package and must pass. It also proves the file
# count reaches the log: the count gate in type-check.yml fails any job
# that names no count, so a green here is a count that was read.
#
# The opposite direction is not a job. A job that must fail leaves a
# failing run on the pull request head, where the merge gate reads it as a
# red head and no reader can tell an intended failure from a real one.
# The negative cases live in test/test_type_check_file_count.py, which
# holds the count regex to mypy's real output for an unreadable target and
# for empty output. Dispatch run 34824960581 on c30f6f2e is the live
# negative: job type_check_reads_nothing failed with "mypy named no source
# file count, so this job checked nothing."
#
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/type-check.yml'
      - '.github/workflows/coverage.yml'
      - '.github/workflows/self-check.yml'
  workflow_dispatch:

jobs:
  # Must pass: scripts/ holds real Python, so mypy names a file count.
  type_check_reads_files:
    uses: ./.github/workflows/type-check.yml
    with:
      mypy_args: "scripts --ignore-missing-imports"
      pr_comment: false
      fail_on_errors: false
