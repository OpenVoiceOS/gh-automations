name: Publish Stable Build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      version_file:
        type: string
        default: ""
        description: "Path to version.py (relative to repo root). If empty, auto-detects root or pkg/version.py."
      setup_py:
        type: string
        default: "setup.py"
        description: "Deprecated. Version is now read from version_file directly."
      branch:
        type: string
        default: "master"
        description: "Stable branch where the release happens (e.g. master/main). If 'master' is requested but missing, detects default branch."
      publish_release:
        type: boolean
        default: true
      publish_pypi:
        type: boolean
        default: false
        description: "Publish to PyPI after declaring stable"
      sync_dev:
        type: boolean
        default: false
        description: "Push master -> dev to keep branches in sync after stable release"
      codename:
        type: boolean
        default: false
        description: >
          When true, resolve the active OVOS release codename from the gh-automations
          registry (codenames/CURRENT + codenames/CODENAMES) and include it in the
          GitHub release name/notes as 'OVOS <version> "<Codename>"'.
          No effect when publish_release is false.
      notify_matrix:
        type: boolean
        default: false
        description: "Send Matrix notification when a stable release is published"
      matrix_channel:
        type: string
        default: "!WjxEKjjINpyBRPFgxl:krbel.duckdns.org"
        description: "Matrix room ID to notify (default: OVOS main channel)"
      matrix_homeserver:
        type: string
        default: "matrix.org"
        description: "Matrix homeserver URL"
      matrix_message:
        type: string
        default: ""
        description: "Custom Matrix message. Leave empty to use the default 'stable release' message."
      matrix_message_pool:
        type: string
        default: ""
        description: >
          Newline-separated pool of fun messages to randomly prefix the notification.
          One is chosen at random and prepended to the standard message.
          Leave empty to skip.
    secrets:
      PYPI_TOKEN:
        required: false
        description: "PyPI API token for publishing. Required when publish_pypi: true."
      MATRIX_TOKEN:
        required: false
        description: "Matrix access token for notifications. Required when notify_matrix: true."
    outputs:
      version:
        description: Updated version
        value: ${{jobs.bump_version.outputs.version}}
      codename:
        description: "Active codename used for this release (empty when codename input is false)"
        value: ${{jobs.bump_version.outputs.codename}}
jobs:
  bump_version:
    # Guard: skip if triggered by a bot commit (prevents infinite loop when
    # git-auto-commit-action pushes the version bump back to master)
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      actual_branch: ${{ steps.branch_detect.outputs.actual_branch }}
      codename: ${{ steps.codename.outputs.codename }}
    steps:
      - name: Checkout Scripts Repo
        uses: actions/checkout@v7
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev

      - name: Detect branch
        id: branch_detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUESTED="${{ inputs.branch }}"
          # If master is requested, verify it exists; if not, use the default branch
          # We use gh repo view which doesn't require a full checkout of the package repo yet
          DEFAULT_BRANCH=$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq .defaultBranchRef.name)
          
          if [ "$REQUESTED" == "master" ] && [ "$DEFAULT_BRANCH" != "master" ]; then
             echo "Warning: 'master' branch requested but not found as default. Using '${DEFAULT_BRANCH}'."
             REQUESTED="$DEFAULT_BRANCH"
          fi
          echo "actual_branch=${REQUESTED}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch_detect.outputs.actual_branch }}
          path: action/package/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Declare Alpha stable
        id: version
        working-directory: action/github/scripts
        run: |
          python remove_alpha.py --version-file ../../package/${{ inputs.version_file }}
          echo "version=$(python get_version.py --version-file ../../package/${{ inputs.version_file }})" >> $GITHUB_OUTPUT

      - name: Resolve codename
        id: codename
        if: ${{ inputs.codename }}
        working-directory: action/github/scripts
        run: |
          NAME=$(python resolve_codename.py --codenames-dir ../codenames)
          echo "codename=${NAME}" >> $GITHUB_OUTPUT

      - name: Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Increment Version to ${{ steps.version.outputs.version }}
          branch: ${{ steps.branch_detect.outputs.actual_branch }}
          repository: action/package/

  tag_release:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_release }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.actual_branch }}
          path: action/package/

      - name: Set release name
        id: release_name
        run: |
          VERSION="${{ needs.bump_version.outputs.version }}"
          CODENAME="${{ needs.bump_version.outputs.codename }}"
          if [ -n "$CODENAME" ]; then
            echo "name=OVOS ${VERSION} \"${CODENAME}\"" >> $GITHUB_OUTPUT
            {
              echo "body<<NOTESEOF"
              echo "## ${CODENAME} release"
              echo ""
              echo "NOTESEOF"
            } >> $GITHUB_OUTPUT
          else
            echo "name=${VERSION}" >> $GITHUB_OUTPUT
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          tag: ${{needs.bump_version.outputs.version}}
          name: ${{ steps.release_name.outputs.name }}
          commit: ${{ needs.bump_version.outputs.actual_branch }}
          prerelease: false
          generateReleaseNotes: true
          body: ${{ steps.release_name.outputs.body }}

  publish_pypi:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_pypi }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.actual_branch }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Build Distribution Packages
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  cleanup:
    needs:
      - tag_release
      - bump_version
    if: ${{ always() && needs.tag_release.result == 'success' }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Delete release branch
        continue-on-error: true   # branch may already be deleted by GitHub or manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.bump_version.outputs.version }}"
          BRANCH="release-${VERSION}"
          if gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}"
            echo "Deleted stale branch ${BRANCH}"
          else
            echo "Branch ${BRANCH} not found — nothing to clean up"
          fi

  sync_dev:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.sync_dev }}
    runs-on: ${{inputs.runner}}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.actual_branch }}
          fetch-depth: 0
      - name: Push stable -> dev
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev

  notify:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.notify_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick message
        id: msg
        run: |
          POOL="${{ inputs.matrix_message_pool }}"
          CUSTOM="${{ inputs.matrix_message }}"
          CODENAME="${{ needs.bump_version.outputs.codename }}"
          VERSION="${{ needs.bump_version.outputs.version }}"
          REPO="${{ github.event.repository.name }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases"

          if [ -n "$CODENAME" ]; then
            DEFAULT="🎉 ${REPO} stable release published: OVOS ${VERSION} \"${CODENAME}\" ${REPO_URL}"
          else
            DEFAULT="🎉 ${REPO} stable release published! ${REPO_URL}"
          fi

          if [ -n "$CUSTOM" ]; then
            MSG="$CUSTOM"
          elif [ -n "$POOL" ]; then
            PREFIX=$(echo -e "$POOL" | shuf -n 1)
            MSG="${PREFIX} — ${DEFAULT}"
          else
            MSG="$DEFAULT"
          fi
          echo "message<<MSGEOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "MSGEOF" >> $GITHUB_OUTPUT

      - name: Send to Matrix
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: |
          MSG="${{ steps.msg.outputs.message }}"
          ROOM_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' '${{ inputs.matrix_channel }}')
          curl -sf -X PUT \
            "https://${{ inputs.matrix_homeserver }}/_matrix/client/v3/rooms/${ROOM_ENC}/send/m.room.message/$(date +%s%N)" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg body "$MSG" '{"msgtype":"m.text","body":$body}')"
