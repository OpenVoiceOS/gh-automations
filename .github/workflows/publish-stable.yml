name: Publish Stable Build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      version_file:
        type: string
        default: "version.py"
      setup_py:
        type: string
        default: "setup.py"
        description: "Deprecated. Version is now read from version_file directly."
      branch:
        type: string
        default: "master"
      publish_release:
        type: boolean
        default: true
      publish_pypi:
        type: boolean
        default: false
        description: "Publish to PyPI after declaring stable"
      sync_dev:
        type: boolean
        default: false
        description: "Push master -> dev to keep branches in sync after stable release"
      notify_matrix:
        type: boolean
        default: false
        description: "Send Matrix notification when a stable release is published"
      matrix_channel:
        type: string
        default: "!WjxEKjjINpyBRPFgxl:krbel.duckdns.org"
        description: "Matrix room ID to notify (default: OVOS main channel)"
      matrix_homeserver:
        type: string
        default: "matrix.org"
        description: "Matrix homeserver URL"
      matrix_message:
        type: string
        default: ""
        description: "Custom Matrix message. Leave empty to use the default 'stable release' message."
      matrix_message_pool:
        type: string
        default: ""
        description: >
          Newline-separated pool of fun messages to randomly prefix the notification.
          One is chosen at random and prepended to the standard message.
          Leave empty to skip.
    outputs:
      version:
        description: Updated version
        value: ${{jobs.bump_version.outputs.version}}
jobs:
  bump_version:
    # Guard: skip if triggered by a bot commit (prevents infinite loop when
    # git-auto-commit-action pushes the version bump back to master)
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{inputs.runner}}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
      - name: Checkout Scripts Repo
        uses: actions/checkout@v4
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Declare Alpha stable
        id: version
        working-directory: action/github/scripts
        run: |
          python remove_alpha.py --version-file ../../package/${{ inputs.version_file }}
          echo "version=$(python get_version.py --version-file ../../package/${{ inputs.version_file }})" >> $GITHUB_OUTPUT

      - name: Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Increment Version to ${{ steps.version.outputs.version }}
          branch: ${{ inputs.branch }}
          repository: action/package/

  tag_release:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_release }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: action/package/
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          tag: ${{needs.bump_version.outputs.version}}
          commit: ${{ inputs.branch }}
          prerelease: false
          generateReleaseNotes: true

  publish_pypi:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.publish_pypi }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Build Tools
        run: python -m pip install build
      - name: Build Distribution Packages
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  sync_dev:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.sync_dev }}
    runs-on: ${{inputs.runner}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Push master -> dev
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev

  notify:
    needs:
      - bump_version
    if: ${{ always() && needs.bump_version.result == 'success' && inputs.notify_matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Pick message
        id: msg
        run: |
          POOL="${{ inputs.matrix_message_pool }}"
          CUSTOM="${{ inputs.matrix_message }}"
          DEFAULT="🎉 ${{ github.event.repository.name }} stable release published! https://github.com/${{ github.repository }}/releases"

          if [ -n "$CUSTOM" ]; then
            MSG="$CUSTOM"
          elif [ -n "$POOL" ]; then
            PREFIX=$(echo -e "$POOL" | shuf -n 1)
            MSG="${PREFIX} — ${DEFAULT}"
          else
            MSG="$DEFAULT"
          fi
          echo "message<<MSGEOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "MSGEOF" >> $GITHUB_OUTPUT

      - name: Send to Matrix
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: ${{ inputs.matrix_homeserver }}
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: ${{ inputs.matrix_channel }}
          message: ${{ steps.msg.outputs.message }}
