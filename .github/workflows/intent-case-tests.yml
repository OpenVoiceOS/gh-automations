name: Intent-Case Tests
# Reusable workflow for running ovoscope file-based intent-case tests.
#
# This is the *intent-routing accuracy* gate, not the generic ovoscope
# end-to-end suite. It's purpose-built for the pattern where each
# `<IntentName>.intent.test` / `no_match.test` file under the skill's
# `cases/<lang>/` directory is fed through every pipeline by
# ovoscope.intent_cases.register_intent_case_tests, producing one test
# per (pipeline, lang, utterance) combination.
#
# Differences from `ovoscope.yml`:
# - shards the run by language (one matrix job per lang), since suites
#   with all locales easily reach 2,000+ tests and time out single-job
# - no bus-coverage step (irrelevant for intent routing)
# - the only PR-comment section it touches is "🎯 Intent-Case Accuracy"
#
# Use both workflows in tandem: `ovoscope.yml` for hand-written E2E
# tests / divergence canaries / bus-coverage; `intent-case-tests.yml`
# for the bulk generated intent-routing matrix.
#
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before testing (space-separated)"
      install_extras:
        type: string
        default: "test"
        description: >
          pip extras used when installing the package; must pull in ovoscope.
      test_path:
        type: string
        default: "test/end2end/"
        description: >
          Path passed to pytest. Default `test/end2end/` collects the whole
          end2end suite; ovoscope's intent-case auto-discovery picks up the
          shim file (`ovoscope_intent_cases = {...}`) inside it.

      # ---- Pipeline plugin gates (identical to ovoscope.yml) -------------
      require_adapt:
        type: boolean
        default: false
      require_padatious:
        type: boolean
        default: false
      require_m2v:
        type: boolean
        default: false
      require_nebulento:
        type: boolean
        default: false
      require_palavreado:
        type: boolean
        default: false
      pre_release:
        type: boolean
        default: false
        description: >
          Install ovoscope and every required pipeline plugin from its
          GitHub `dev` branch instead of PyPI.

      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🎯 Intent-Case Accuracy' section per shard in the
          OVOS PR Checks comment (only on pull_request).

      # ---- Lang sharding -------------------------------------------------
      langs:
        type: string
        default: '["all"]'
        description: >
          JSON array of language tags. One matrix job per lang. Each
          shard passes `-k '<slug>'` to pytest (slug = lang.replace('-', '_'))
          so only tests whose nodeid contains that slug run there. Pass
          the skill's locale list verbatim, e.g.
          '["en-US", "de-DE", "pt-PT"]'. The default `["all"]` runs the
          entire suite in a single job.

      # ---- Accuracy gates ------------------------------------------------
      accuracy_baseline:
        type: string
        default: ""
        description: >
          Path (relative to the skill repo root) of a previously-saved
          intent-accuracy report JSON. When supplied, the run fails on
          regressed (was-pass → now-fail) cases.
      accuracy_tolerant:
        type: boolean
        default: false
        description: >
          Downgrade individual case failures to xfail. Only the aggregate
          gate (accuracy_min / regression list) can block the session.
      accuracy_min:
        type: string
        default: ""
        description: >
          Minimum overall pass rate (0.0-1.0). Fails the shard when the
          observed rate is below this value.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: "allow"  # OVOS ships pre-1.0 alphas; resolve prerelease floor-pins like pip did

jobs:
  intent_case_tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(inputs.langs) }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install System Dependencies
        if: ${{ inputs.system_deps != '' || inputs.require_padatious }}
        run: |
          sudo apt-get update -q
          DEPS="${{ inputs.system_deps }}"
          if [ "${{ inputs.require_padatious }}" == "true" ]; then
            DEPS="$DEPS swig libfann-dev"
          fi
          if [ -n "$DEPS" ]; then
            sudo apt-get install -yq $DEPS
          fi

      - name: Install Pipeline Plugin Dependencies
        run: |
          PRE_RELEASE="${{ inputs.pre_release }}"
          install_plugin() {
            local name="$1" pypi="$2" gh="$3"
            if [ "$PRE_RELEASE" == "true" ]; then
              uv pip install --force-reinstall "git+https://github.com/${gh}@dev" || {
                echo "::error::Failed to install $name from GitHub dev"; exit 1; }
            else
              uv pip install "$pypi" || {
                echo "::error::Failed to install $name from PyPI"; exit 1; }
            fi
          }
          if [ "${{ inputs.require_adapt }}" == "true" ]; then
            install_plugin "ovos-adapt-parser" "ovos-adapt-parser" "OpenVoiceOS/ovos-adapt-pipeline-plugin"
          fi
          if [ "${{ inputs.require_padatious }}" == "true" ]; then
            install_plugin "ovos-padatious" "ovos-padatious" "OpenVoiceOS/ovos-padatious-pipeline-plugin"
          fi
          if [ "${{ inputs.require_m2v }}" == "true" ]; then
            install_plugin "ovos-m2v-pipeline" "ovos-m2v-pipeline" "OpenVoiceOS/ovos-m2v-pipeline"
          fi
          if [ "${{ inputs.require_nebulento }}" == "true" ]; then
            install_plugin "nebulento" "nebulento" "OpenVoiceOS/nebulento"
          fi
          if [ "${{ inputs.require_palavreado }}" == "true" ]; then
            install_plugin "palavreado" "palavreado" "OpenVoiceOS/palavreado"
          fi
          python3 -c "import importlib.metadata; eps = importlib.metadata.entry_points(group='opm.pipeline'); print('Installed pipelines:', [ep.name for ep in eps])"

      - name: Install Package with Test Extras
        run: |
          uv pip install pytest pytest-json-report
          if [ "${{ inputs.pre_release }}" == "true" ]; then
            uv pip install --force-reinstall "git+https://github.com/TigreGotico/ovoscope@dev"
          else
            uv pip install ovoscope
          fi
          EXTRAS="${{ inputs.install_extras }}"
          if [ -n "$EXTRAS" ]; then
            uv pip install ".[$EXTRAS]"
          else
            uv pip install .
          fi
          python -c "import ovoscope; print('ovoscope path:', ovoscope.__file__)"

      - name: Compute lang shard filter
        id: shard
        run: |
          LANG_TAG='${{ matrix.lang }}'
          if [ "$LANG_TAG" = "all" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "title_suffix=" >> "$GITHUB_OUTPUT"
          else
            SLUG="${LANG_TAG//-/_}"
            echo "filter=$SLUG" >> "$GITHUB_OUTPUT"
            echo "suffix=-$SLUG" >> "$GITHUB_OUTPUT"
            echo "title_suffix= ($LANG_TAG)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run intent-case tests
        id: run_tests
        continue-on-error: true
        run: |
          ACCURACY_ARGS="--ovoscope-accuracy-report=/tmp/ovoscope-intent-accuracy.json --ovoscope-accuracy-md=/tmp/ovoscope-intent-accuracy.md"
          if [ -n "${{ inputs.accuracy_baseline }}" ] && [ -f "${{ inputs.accuracy_baseline }}" ]; then
            ACCURACY_ARGS="$ACCURACY_ARGS --ovoscope-accuracy-baseline=${{ inputs.accuracy_baseline }}"
          fi
          if [ "${{ inputs.accuracy_tolerant }}" == "true" ]; then
            ACCURACY_ARGS="$ACCURACY_ARGS --ovoscope-accuracy-tolerant"
          fi
          if [ -n "${{ inputs.accuracy_min }}" ]; then
            ACCURACY_ARGS="$ACCURACY_ARGS --ovoscope-accuracy-min=${{ inputs.accuracy_min }}"
          fi
          K_ARGS=""
          if [ -n "${{ steps.shard.outputs.filter }}" ]; then
            K_ARGS="-k ${{ steps.shard.outputs.filter }}"
          fi
          python -m pytest \
            ${{ inputs.test_path }} \
            --json-report \
            --json-report-file=/tmp/ovoscope-results.json \
            $ACCURACY_ARGS \
            $K_ARGS \
            -v

      - name: Relocate intent-case accuracy section
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          if [ -f /tmp/ovoscope-intent-accuracy.md ] && \
             [ -s /tmp/ovoscope-intent-accuracy.md ]; then
            cp /tmp/ovoscope-intent-accuracy.md \
               /tmp/ovoscope-intent-accuracy-section.md
          fi

      - name: Post intent-case accuracy to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          SUF='${{ steps.shard.outputs.suffix }}'
          TSUF='${{ steps.shard.outputs.title_suffix }}'
          if [ -f /tmp/ovoscope-intent-accuracy-section.md ]; then
            python3 _gh_automations/scripts/update_pr_comment.py \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --section-id "intent-accuracy${SUF}" \
              --title "🎯 Intent-Case Accuracy${TSUF}" \
              --content-file /tmp/ovoscope-intent-accuracy-section.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail shard if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "Intent-case tests failed for matrix.lang='${{ matrix.lang }}' — see report."
          exit 1
