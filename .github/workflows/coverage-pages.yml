name: Coverage Pages
# DEPRECATED — use coverage.yml with deploy_pages: true instead.
# This file is kept for backwards compatibility with existing callers.
# REMOVE AFTER: 2027-01-01 — verify no active callers in docs/repos.md before removing.
#
# Callers must grant:  contents: write
#
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before testing (space-separated)"
      install_extras:
        type: string
        default: ""
        description: >
          Extra pip install arguments run before tests. Example: '.[dev]' or
          '-r requirements/test.txt'. If empty, the package itself is installed
          via 'pip install -e .[dev]' (falling back to bare install).
      test_path:
        type: string
        default: "test/"
        description: "Path passed to pytest (file, directory, or glob)"
      coverage_source:
        type: string
        default: "."
        description: >
          Value of --cov= passed to pytest. Set to your package directory (e.g.
          'ovos_core') to measure only your own code rather than the full repo.
      gh_pages_branch:
        type: string
        default: "gh-pages"
        description: "Branch to push the HTML coverage report to."

jobs:
  coverage_pages:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install System Dependencies
        if: ${{ inputs.system_deps != '' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ${{ inputs.system_deps }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov coverage[toml] ovoscope
          if python -m pip install -e ".[dev]" 2>/dev/null; then
            echo "Installed package with [dev] extras"
          elif python -m pip install -e . 2>/dev/null; then
            echo "Installed package (no [dev] extras)"
          else
            echo "No installable package found at repo root — continuing without install"
          fi
          if [ -n "${{ inputs.install_extras }}" ]; then
            python -m pip install ${{ inputs.install_extras }}
          fi

      - name: Run Tests with Coverage
        run: |
          python -m pytest \
            ${{ inputs.test_path }} \
            --cov=${{ inputs.coverage_source }} \
            --cov-report=html:htmlcov \
            -v
        continue-on-error: true

      - name: Deploy to gh-pages branch
        if: ${{ hashFiles('htmlcov/index.html') != '' }}
        run: |
          BRANCH="${{ inputs.gh_pages_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save htmlcov outside the work tree
          cp -r htmlcov /tmp/htmlcov

          # Switch to gh-pages (create orphan if it doesn't exist)
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf .
          fi

          # Replace contents with coverage report
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/htmlcov/. .
          touch .nojekyll
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Update coverage report [skip ci]"
          git push origin "$BRANCH"
