name: Downstream Dependency Check
on:
  workflow_call:
    inputs:
      package_name:
        type: string
        required: true
        description: "PyPI package name to track dependents of"
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      constraints_url:
        type: string
        default: "https://raw.githubusercontent.com/OpenVoiceOS/ovos-releases/refs/heads/main/constraints-alpha.txt"
        description: "URL of the ovos-releases constraints file to install against"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install (space-separated) in addition to the standard OVOS build deps"
      output_file:
        type: string
        default: "downstream_report.txt"
        description: "Local filename for the generated report (also used as artifact name)"
      pr_comment:
        type: boolean
        default: true
        description: "Post the report as a section in the OVOS PR Checks comment (only on pull_request events)"
      # Deprecated: commit_branch no longer does anything. Kept for backwards
      # compatibility with existing callers so they don't break on unknown input.
      commit_branch:
        type: string
        default: "dev"
        description: "Deprecated — ignored. Report is now uploaded as an artifact instead of committed."

jobs:
  check_downstream:
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Scripts Repo
        uses: actions/checkout@v4
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq \
            python3-dev \
            swig \
            libssl-dev \
            libfann-dev \
            libfann2 \
            portaudio19-dev \
            libpulse-dev \
            sox \
            mpg123 \
            ${{ inputs.system_deps }}
      - name: Install OVOS ecosystem and pipdeptree
        run: |
          python -m pip install build wheel pipdeptree
          curl -fsSL -o constraints.txt "${{ inputs.constraints_url }}"
          # Install the full OVOS ecosystem so pipdeptree can find all reverse deps
          pip install -r constraints.txt || true
          # Re-install the target package pinned to the constraints version
          pip install -c constraints.txt "${{ inputs.package_name }}" || true
      - name: Generate downstream report
        run: |
          python action/github/scripts/check_downstream.py \
            --package "${{ inputs.package_name }}" \
            --output "${{ inputs.output_file }}"
      - name: Upload report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_file }}
          path: ${{ inputs.output_file }}
          retention-days: 30
          if-no-files-found: warn
      - name: Post downstream section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 action/github/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "downstream" \
            --title "🔗 Downstream Dependents" \
            --content-file "${{ inputs.output_file }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
