name: Downstream Dependency Check
on:
  workflow_call:
    inputs:
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      package_name:
        type: string
        required: true
        description: "PyPI package name to track dependents of"
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      constraints_url:
        type: string
        default: "https://raw.githubusercontent.com/OpenVoiceOS/ovos-releases/refs/heads/main/constraints-alpha.txt"
        description: "URL of the ovos-releases constraints file to install against"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install (space-separated) in addition to the standard OVOS build deps"
      output_file:
        type: string
        default: "downstream_report.txt"
        description: "Local filename for the generated report (also used as artifact name)"
      pr_comment:
        type: boolean
        default: true
        description: "Post the report as a section in the OVOS PR Checks comment (only on pull_request events)"
      # Deprecated: commit_branch no longer does anything. Kept for backwards
      # compatibility with existing callers so they don't break on unknown input.
      commit_branch:
        type: string
        default: "dev"
        description: "Deprecated — ignored. Report is now uploaded as an artifact instead of committed."

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  check_downstream:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Checkout Scripts Repo
        uses: actions/checkout@v7
        with:
          path: action/github/
          repository: OpenVoiceOS/gh-automations
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv
        run: pip install uv
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq \
            python3-dev \
            swig \
            libssl-dev \
            portaudio19-dev \
            libpulse-dev \
            sox \
            mpg123 \
            ${{ inputs.system_deps }}
      - name: Install OVOS ecosystem and pipdeptree
        id: install
        run: |
          curl -fsSL -o constraints.txt "${{ inputs.constraints_url }}"
          # The step's name promised pipdeptree and never installed it, so
          # check_downstream.py's `python -m pipdeptree` failed on every run
          # and the report read "No dependents found" (T-2899).
          uv pip install pipdeptree
          # The ecosystem install may leave packages out (a wheel that does not
          # build here is not a finding about the target); the report says how
          # many made it. The target install is a hard requirement: a report
          # about a package that is not installed describes nothing (T-2338).
          if uv pip install -r constraints.txt; then
            echo "ecosystem=complete" >> "$GITHUB_OUTPUT"
          else
            echo "ecosystem=partial" >> "$GITHUB_OUTPUT"
            echo "::warning title=downstream-check ecosystem install incomplete::uv pip install -r constraints.txt did not finish clean; the reverse-dependency tree below is over the packages that installed"
          fi
          uv pip install -c constraints.txt "${{ inputs.package_name }}"
          uv pip show "${{ inputs.package_name }}" > /tmp/target-package.txt
          echo "target=$(sed -n 's/^Version: //p' /tmp/target-package.txt)" >> "$GITHUB_OUTPUT"
          echo "installed=$(uv pip list 2>/dev/null | tail -n +3 | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Generate downstream report
        run: |
          python action/github/scripts/check_downstream.py \
            --package "${{ inputs.package_name }}" \
            --output "${{ inputs.output_file }}"
          {
            echo
            echo "Environment: ${{ inputs.package_name }} ${{ steps.install.outputs.target }} installed; ${{ steps.install.outputs.installed }} packages in the environment; ecosystem install ${{ steps.install.outputs.ecosystem }}."
          } >> "${{ inputs.output_file }}"
      - name: Upload report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_file }}
          path: ${{ inputs.output_file }}
          retention-days: 30
          if-no-files-found: warn
      - name: Post downstream section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 action/github/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "downstream" \
            --title "🔗 Downstream Dependents" \
            --content-file "${{ inputs.output_file }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
