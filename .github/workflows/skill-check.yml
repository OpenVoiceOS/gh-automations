name: Skill Check
# Analyses an OVOS skill repository for locale structure, language coverage,
# and skill.json validity.
#
# Follows the same 3-phase pattern as pip-audit.yml:
#   continue-on-error → format section → post comment → re-raise
#
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      python_version:
        type: string
        default: "3.14"
        description: "Python version"
      locale_dir:
        type: string
        default: ""
        description: "Locale root path. Empty = auto-detect."
      skip_if_not_skill:
        type: boolean
        default: true
        description: "Silently pass if no ovos.plugin.skill entry point found"
      fail_on_missing_en_us:
        type: boolean
        default: true
        description: "Fail if en-US locale directory is absent"
      fail_on_invalid_skill_json:
        type: boolean
        default: false
        description: "Fail if en-US skill.json is missing or invalid"
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a '🎙️ Skill' section in the shared 'OVOS PR Checks' comment on the PR.
          Only runs when the workflow is triggered by a pull_request event.
    secrets:
      LOCALIZE_APP_PRIVATE_KEY:
        required: false
        description: "Private key for the GitHub App used to post PR comments from forks"

jobs:
  skill_check:
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run skill check
        id: skill_check
        # continue-on-error so the PR comment step always runs.
        # The job still fails at the end via the outcome check below.
        continue-on-error: true
        run: |
          python3 _gh_automations/scripts/check_skill.py \
            --repo-root . \
            --locale-dir "${{ inputs.locale_dir }}" \
            --output-json /tmp/skill-report.json

      - name: Format skill section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          try:
              with open("/tmp/skill-report.json") as f:
                  r = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              with open("/tmp/skill-section.md", "w") as f:
                  f.write("❌ Skill check did not produce a report — check the job log.")
              sys.exit(0)

          if not r.get("is_skill"):
              with open("/tmp/skill-section.md", "w") as f:
                  f.write("ℹ️ Not an OVOS skill repo — check skipped.")
              sys.exit(0)

          lines = []

          # Header
          skill_id = r.get("skill_id") or "(unknown skill_id)"
          n_langs = r.get("languages", 0)
          lines.append(f"🎙️ **{skill_id}** — {n_langs} language{'s' if n_langs != 1 else ''}")
          lines.append("")

          # en-us summary
          counts = r.get("en_us_counts", {})
          sj = r.get("skill_json", {})
          if r.get("has_en_us"):
              parts = []
              for key in ("intent", "voc", "dialog"):
                  val = counts.get(key, 0)
                  if val:
                      label = {"intent": "intents", "voc": "vocab", "dialog": "dialogs"}[key]
                      parts.append(f"{val} {label}")
              sj_icon = "✅" if sj.get("valid_json") and not sj.get("missing_fields") else "⚠️"
              sj_text = f"skill.json {sj_icon}"
              parts.append(sj_text)
              lines.append("**en-US:** " + " · ".join(parts))
          else:
              lines.append("❌ **en-US locale not found**")
          lines.append("")

          # Translation coverage table with progress bars
          translations = r.get("translations", [])
          if translations:
              # Summary counts
              complete = sum(1 for t in translations if t["pct"] >= 95)
              partial = sum(1 for t in translations if 50 <= t["pct"] < 95)
              missing = sum(1 for t in translations if t["pct"] < 50)
              summary_parts = []
              if complete:
                  summary_parts.append(f"{complete} complete")
              if partial:
                  summary_parts.append(f"{partial} partial")
              if missing:
                  summary_parts.append(f"{missing} incomplete")
              summary = ", ".join(summary_parts) or "none"

              lines.append("<details><summary>Translation coverage — {} language{} ({})</summary>".format(
                  len(translations), "s" if len(translations) != 1 else "", summary))
              lines.append("")
              lines.append("| Language | Progress | Coverage |")
              lines.append("|----------|----------|----------|")
              for t in translations:
                  pct = t["pct"]
                  present = t["present"]
                  total = t["total"]
                  # Build progress bar: 10 chars wide
                  filled = round(pct / 10)
                  bar = "\u2588" * filled + "\u2591" * (10 - filled)
                  if pct >= 95:
                      icon = "\u2705"
                  elif pct >= 50:
                      icon = "\u26a0\ufe0f"
                  else:
                      icon = "\u274c"
                  lines.append(f"| {t['lang']} | `{bar}` | {icon} {pct}% ({present}/{total}) |")
              lines.append("")
              lines.append("</details>")
              lines.append("")

          with open("/tmp/skill-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF


      - name: Write section metadata for workflow_run posting
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          mkdir -p /tmp/pr-sections
          python3 <<'PYEOF'
          import json, pathlib
          content = pathlib.Path('/tmp/skill-section.md').read_text() if pathlib.Path('/tmp/skill-section.md').exists() else ''
          meta = {'section_id': 'skill', 'title': '🎓 Skill Check', 'content': content}
          pathlib.Path('/tmp/pr-sections/skill.json').write_text(json.dumps(meta))
          PYEOF

      - name: Upload sections for workflow_run comment posting
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-section
          path: /tmp/pr-sections/
          retention-days: 1
          if-no-files-found: ignore


      # --- Pass/fail logic (after comment is posted) ---

      - name: Skip if not an OVOS skill repo
        if: ${{ inputs.skip_if_not_skill }}
        run: |
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open("/tmp/skill-report.json") as f:
                  r = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              sys.exit(0)
          if not r.get("is_skill"):
              print("Not an OVOS skill repo — check skipped (skip_if_not_skill=true).")
              sys.exit(0)
          PYEOF

      - name: Fail if en-US locale is missing
        if: ${{ inputs.fail_on_missing_en_us }}
        run: |
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open("/tmp/skill-report.json") as f:
                  r = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              sys.exit(0)
          if not r.get("is_skill"):
              sys.exit(0)
          if not r.get("has_en_us"):
              print("ERROR: en-US locale directory not found (fail_on_missing_en_us=true).")
              sys.exit(1)
          PYEOF

      - name: Fail if skill.json is invalid
        if: ${{ inputs.fail_on_invalid_skill_json }}
        run: |
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open("/tmp/skill-report.json") as f:
                  r = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              sys.exit(0)
          if not r.get("is_skill"):
              sys.exit(0)
          sj = r.get("skill_json", {})
          if not sj.get("exists") or not sj.get("valid_json") or sj.get("missing_fields"):
              missing = sj.get("missing_fields", [])
              print(f"ERROR: skill.json is invalid. Missing fields: {missing}")
              sys.exit(1)
          PYEOF

      # Fail the job after posting the PR comment so the check status is correct.
      - name: Fail job if skill check failed
        if: ${{ steps.skill_check.outcome == 'failure' }}
        run: |
          echo "Skill check script exited with an error — see report above."
          exit 1
