name: Pip Audit
# Scans installed dependencies for known CVEs with pip-audit.
#
# The job warns and never fails (Miro, 2026-09-18, on gh-automations#126).
# A finding is one ::warning annotation per vulnerability, a table in the
# job summary, the same table in the shared PR comment, and a SARIF alert
# in the Security tab. A caller that wants a finding to block a merge reads
# the Security tab or the annotations; this job's check stays green.
#
# The default ignore list:
#   GHSA-r9hx-vwmv-q579 — setuptools path traversal (low severity, affects dev tooling only,
#                          not runtime code; present in virtually all Python environments)
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.14"
        description: "Python version to use for the audit"
      install_extras:
        type: string
        default: ""
        description: >
          Extra dependencies to install. Accepts a bare extras name ('dev'),
          a bracketed list ('[dev,rl]'), a full target ('.[dev]'), or raw
          pip arguments ('-r requirements/test.txt').
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages beyond python3-dev"
      ignore_vulns:
        type: string
        default: "GHSA-r9hx-vwmv-q579"
        description: |
          Newline-separated list of GHSA vulnerability IDs to ignore.
          Default ignores GHSA-r9hx-vwmv-q579 (setuptools path traversal —
          dev-only, not exploitable in OVOS runtime context).
      warn_only:
        type: boolean
        default: true
        description: >
          Kept so existing callers keep parsing. The job never fails on a
          finding, whatever this says: findings are warning annotations, a
          job summary table and a PR comment section (Miro, 2026-09-18).
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a section in the shared 'OVOS PR Checks' comment on the PR.
          Only runs when the workflow is triggered by a pull_request event.
      upload_sarif:
        type: boolean
        default: true
        description: >
          Upload a SARIF report to GitHub's Security tab (Code scanning alerts).
          Requires the repo to have GitHub Advanced Security enabled, or be public.
      sarif_category:
        type: string
        default: "pip-audit"
        description: >
          Code scanning category for the SARIF upload, and the key of the
          PR comment section. Code scanning keeps one analysis per (ref,
          category), and the last upload wins; the PR comment keeps one
          section per id. A caller that runs this workflow more than once on
          one ref, for example once per extras set, must give each call its
          own category, or the last one deletes the alerts and overwrites
          the table of the others. The default keeps the section id
          "security"; another value gives "security-<category>".

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  pip_audit:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
      security-events: write  # needed for SARIF upload
    steps:
      - uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        # The report, the PR comment and the SARIF file all come from these scripts.
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install Build Tools
        # Explicit floors on pip-audit's own transitive deps (pulled in via
        # cyclonedx-python-lib/CacheControl/requests) and on the unpinned
        # `wheel` build tool: pip-audit was flagging its own toolchain
        # (filelock PYSEC-2026-1375/1374, msgpack PYSEC-2026-3625,
        # urllib3 PYSEC-2026-1999 and friends, wheel GHSA-8rrh-rw8j-w5fx)
        # as if it were a vulnerability in the audited package.
        run: >
          uv pip install build "wheel>=0.46.2" pip-audit
          "filelock>=3.20.3" "msgpack>=1.2.1" "urllib3>=2.7.0"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev ${{ inputs.system_deps }}

      - name: Install package
        run: |
          # install_extras accepts several caller spellings ("dev", "[dev]",
          # ".[dev]", or raw pip args like "-r reqs.txt"). Callers cannot
          # tell which single form a given reusable workflow expects, and a
          # wrong guess used to abort the job before any check ever ran.
          RAW="${{ inputs.install_extras }}"
          if [ -z "$RAW" ]; then
            NORMALIZED="."
          elif [[ "$RAW" == -* || "$RAW" == */* || "$RAW" == .* ]]; then
            NORMALIZED="$RAW"
          elif [[ "$RAW" == \[* ]]; then
            NORMALIZED=".$RAW"
          else
            NORMALIZED=".[$RAW]"
          fi
          uv pip install $NORMALIZED

      - name: Run pip-audit
        id: pip_audit_check
        # The step keeps pip-audit's exit code, so its outcome says whether
        # the audit found something or did not run. continue-on-error holds
        # the job green: the job never fails on a finding. The outcome drives
        # the SARIF upload and the report step below.
        continue-on-error: true
        run: |
          IGNORE_ARGS=""
          while IFS= read -r vuln_id; do
            vuln_id="${vuln_id//[[:space:]]/}"
            if [ -n "$vuln_id" ]; then
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln_id"
            fi
          done <<< "${{ inputs.ignore_vulns }}"
          # JSON output for PR comment — exit code drives outcome (success/failure).
          # A pipe gives the exit code of `tee`, which is always 0, and the
          # step takes the exit code of its last command. Keep the code of
          # pip-audit in AUDIT_RC and exit with it at the end of the step, or
          # a vulnerability and a clean run read the same.
          pip-audit --format=json $IGNORE_ARGS | tee /tmp/pip-audit-results.json
          AUDIT_RC=${PIPESTATUS[0]}
          TOTAL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/pip-audit-results.json'))
              deps = data if isinstance(data, list) else data.get('dependencies', [])
              sys.stdout.write(str(len(deps)))
          except Exception:
              sys.stdout.write('0')
          ")
          echo "total_packages=$TOTAL" >> $GITHUB_OUTPUT
          exit $AUDIT_RC

      - name: Generate SARIF report
        # pip-audit has no `sarif` output format: `--format=sarif` exits 2 with
        # a usage error. The step that asked for one always fell back to an
        # empty report, so the Security tab never received a finding. Build the
        # SARIF from the JSON report the audit step already wrote. This also
        # drops a second full audit, and the ignore list is applied already.
        #
        # The script exits 2 and writes no file if that report is absent or
        # truncated. Code scanning keeps one analysis per (ref, category), so
        # a report that says "no vulnerability" closes every alert the last
        # good run raised. An audit that did not complete must upload nothing.
        # The job stays green, and the upload below is gated on the outcome
        # of this step, so the report is still never a false clean.
        id: sarif_report
        if: ${{ inputs.upload_sarif }}
        continue-on-error: true
        run: |
          rm -f /tmp/pip-audit.sarif
          python3 _gh_automations/scripts/pip_audit_sarif.py \
            --input /tmp/pip-audit-results.json \
            --output /tmp/pip-audit.sarif \
            --root "$GITHUB_WORKSPACE"

      - name: Upload SARIF to GitHub Security tab
        if: ${{ inputs.upload_sarif && steps.sarif_report.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Don't fail if Security tab is not available (private repos without GHAS)
        with:
          sarif_file: /tmp/pip-audit.sarif
          category: ${{ inputs.sarif_category }}

      - name: Report findings
        # One ::warning annotation per vulnerability, the table in the job
        # summary, and the same table for the PR comment. This is where a
        # finding is seen, because the job never fails on one.
        if: ${{ always() && steps.pip_audit_check.outcome != 'skipped' }}
        run: |
          python3 _gh_automations/scripts/pip_audit_report.py \
            --input /tmp/pip-audit-results.json \
            --section /tmp/security-section.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --annotations \
            --outcome "${{ steps.pip_audit_check.outcome }}" \
            --total-packages "${{ steps.pip_audit_check.outputs.total_packages || 0 }}"

      - name: Post security section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        env:
          CATEGORY: ${{ inputs.sarif_category }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A caller that runs this workflow more than once on one pull
          # request (once per extras set) gives each call its own
          # sarif_category. The comment section is keyed on it the same way,
          # or the clean call overwrites the table of the vulnerable one.
          # The default category keeps the historical section id.
          if [ "$CATEGORY" = "pip-audit" ]; then
            SECTION_ID="security"; TITLE="🔒 Security (pip-audit)"
          else
            SECTION_ID="security-$(printf '%s' "$CATEGORY" | tr -c 'A-Za-z0-9_-' '-')"
            TITLE="🔒 Security (pip-audit: $CATEGORY)"
          fi
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "$SECTION_ID" \
            --title "$TITLE" \
            --content-file /tmp/security-section.md
