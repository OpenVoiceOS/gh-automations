name: Pip Audit
# Scans installed dependencies for known CVEs using pypa/gh-action-pip-audit.
#
# The default ignore list:
#   GHSA-r9hx-vwmv-q579 — setuptools path traversal (low severity, affects dev tooling only,
#                          not runtime code; present in virtually all Python environments)
#
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.14"
        description: "Python version to use for the audit"
      install_extras:
        type: string
        default: ""
        description: "pip extras to install, e.g. '[extras]'"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages beyond python3-dev"
      ignore_vulns:
        type: string
        default: "GHSA-r9hx-vwmv-q579"
        description: |
          Newline-separated list of GHSA vulnerability IDs to ignore.
          Default ignores GHSA-r9hx-vwmv-q579 (setuptools path traversal —
          dev-only, not exploitable in OVOS runtime context).
      warn_only:
        type: boolean
        default: false
        description: >
          When true, report vulnerabilities in the PR comment but do NOT fail the job.
          Useful for repos that want visibility without blocking merges.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a section in the shared 'OVOS PR Checks' comment on the PR.
          Only runs when the workflow is triggered by a pull_request event.
      upload_sarif:
        type: boolean
        default: true
        description: >
          Upload a SARIF report to GitHub's Security tab (Code scanning alerts).
          Requires the repo to have GitHub Advanced Security enabled, or be public.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: "allow"  # OVOS ships pre-1.0 alphas; resolve prerelease floor-pins like pip did

jobs:
  pip_audit:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
      security-events: write  # needed for SARIF upload
    steps:
      - uses: actions/checkout@v6

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install Build Tools
        run: uv pip install build wheel pip-audit

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev ${{ inputs.system_deps }}

      - name: Install package
        run: uv pip install ".${{ inputs.install_extras }}"

      - name: Run pip-audit
        id: pip_audit_check
        # continue-on-error so the PR comment step always runs even when CVEs are found.
        # The job still fails at the end via the outcome check below (unless warn_only).
        continue-on-error: true
        run: |
          IGNORE_ARGS=""
          while IFS= read -r vuln_id; do
            vuln_id="${vuln_id//[[:space:]]/}"
            if [ -n "$vuln_id" ]; then
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln_id"
            fi
          done <<< "${{ inputs.ignore_vulns }}"
          # JSON output for PR comment — exit code drives outcome (success/failure)
          pip-audit --format=json $IGNORE_ARGS | tee /tmp/pip-audit-results.json
          TOTAL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/pip-audit-results.json'))
              deps = data if isinstance(data, list) else data.get('dependencies', [])
              sys.stdout.write(str(len(deps)))
          except Exception:
              sys.stdout.write('0')
          ")
          echo "total_packages=$TOTAL" >> $GITHUB_OUTPUT

      - name: Generate SARIF report
        if: ${{ inputs.upload_sarif }}
        run: |
          IGNORE_ARGS=""
          while IFS= read -r vuln_id; do
            vuln_id="${vuln_id//[[:space:]]/}"
            if [ -n "$vuln_id" ]; then
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln_id"
            fi
          done <<< "${{ inputs.ignore_vulns }}"
          pip-audit --format=sarif $IGNORE_ARGS > /tmp/pip-audit.sarif || \
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > /tmp/pip-audit.sarif

      - name: Upload SARIF to GitHub Security tab
        if: ${{ inputs.upload_sarif }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Don't fail if Security tab is not available (private repos without GHAS)
        with:
          sarif_file: /tmp/pip-audit.sarif
          category: pip-audit

      - name: Format security section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          outcome = os.environ["OUTCOME"]
          total_packages = int(os.environ.get("TOTAL_PACKAGES", "0"))
          results_path = "/tmp/pip-audit-results.json"

          try:
              with open(results_path) as f:
                  data = json.load(f)
              # pip-audit JSON: list of {"name": ..., "version": ..., "vulns": [...]}
              # or {"dependencies": [...]} depending on version — handle both shapes
              if isinstance(data, list):
                  deps = data
              elif isinstance(data, dict) and "dependencies" in data:
                  deps = data["dependencies"]
              else:
                  deps = []
              findings = [d for d in deps if d.get("vulns")]
              if total_packages == 0:
                  total_packages = len(deps)
          except (FileNotFoundError, json.JSONDecodeError):
              findings = None

          pkg_note = f" ({total_packages} packages scanned)" if total_packages > 0 else ""

          if outcome == "success" or (findings is not None and len(findings) == 0):
              body = f"✅ No known vulnerabilities found{pkg_note}."
          elif findings:
              total_vulns = sum(len(d.get("vulns", [])) for d in findings)
              lines = [
                  f"❌ **{total_vulns} vulnerabilit{'y' if total_vulns == 1 else 'ies'}** in {len(findings)} package{'s' if len(findings) != 1 else ''}{pkg_note} — review and update affected packages.\n",
                  "| Package | Version | ID | Severity | Description | Fix |",
                  "|---------|---------|-----|----------|-------------|-----|",
              ]
              for dep in findings:
                  name = dep.get("name", "?")
                  version = dep.get("version", "?")
                  for vuln in dep.get("vulns", []):
                      vid = vuln.get("id", "?")
                      desc = vuln.get("description", "")
                      aliases = vuln.get("aliases", [])
                      # Try to extract a CVE alias for display
                      cve = next((a for a in aliases if a.startswith("CVE-")), "")
                      severity = ""
                      if "fix_versions" in vuln:
                          pass  # no severity in pip-audit JSON by default
                      # Truncate long descriptions
                      if len(desc) > 120:
                          desc = desc[:117] + "..."
                      fixes = ", ".join(vuln.get("fix_versions", [])) or "no fix available"
                      id_cell = f"[{vid}](https://osv.dev/vulnerability/{vid})"
                      if cve:
                          id_cell += f" / {cve}"
                      lines.append(f"| `{name}` | `{version}` | {id_cell} | | {desc} | {fixes} |")
              body = "\n".join(lines)
          else:
              # Could not parse results — fall back to outcome-based message
              if outcome == "failure":
                  body = f"❌ Vulnerabilities found{pkg_note} — check the job log for details."
              else:
                  body = f"✅ No known vulnerabilities found{pkg_note}."

          with open("/tmp/security-section.md", "w") as f:
              f.write(body)
          PYEOF
        env:
          OUTCOME: ${{ steps.pip_audit_check.outcome }}
          TOTAL_PACKAGES: ${{ steps.pip_audit_check.outputs.total_packages }}

      - name: Post security section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "security" \
            --title "🔒 Security (pip-audit)" \
            --content-file /tmp/security-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job after posting the PR comment so the check status is correct.
      # Skipped when warn_only is true — vulnerabilities are reported but don't block the merge.
      - name: Fail job if audit found vulnerabilities
        if: ${{ steps.pip_audit_check.outcome == 'failure' && !inputs.warn_only }}
        run: |
          echo "pip-audit found vulnerabilities — see report above."
          exit 1

      - name: Warn about vulnerabilities (warn_only mode)
        if: ${{ steps.pip_audit_check.outcome == 'failure' && inputs.warn_only }}
        run: |
          echo "::warning::pip-audit found vulnerabilities (warn_only=true — job not failed). See Security tab or PR comment for details."
