name: Pip Audit
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      install_extras:
        type: string
        default: ""
        description: "pip extras to install, e.g. '[extras]'"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages beyond python3-dev"
      ignore_vulns:
        type: string
        default: "GHSA-r9hx-vwmv-q579"
        description: "Newline-separated list of vulnerability IDs to ignore"

jobs:
  pip_audit:
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11"]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Build Tools
        run: python -m pip install build wheel uv
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev ${{ inputs.system_deps }}
      - name: Install package
        run: uv pip install --system .${{ inputs.install_extras }}
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.0.0
        with:
          ignore-vulns: ${{ inputs.ignore_vulns }}
