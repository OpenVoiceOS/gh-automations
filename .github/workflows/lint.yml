name: Lint
# Reusable workflow — runs ruff and/or pre-commit and posts results to the
# shared OVOS PR Checks comment.
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      ruff:
        type: boolean
        default: true
        description: "Run ruff check"
      ruff_args:
        type: string
        default: >-
          . --exclude _gh_automations
          --select E101,E401,E402,E501,E701,E702,E703,E711,E712,E713,E714,E721,E722,E731,E741,E742,E743,E902,F401,F402,F403,F404,F405,F406,F407,F501,F502,F503,F504,F505,F506,F507,F508,F509,F521,F522,F523,F524,F525,F541,F601,F602,F621,F622,F631,F632,F633,F634,F701,F702,F704,F706,F707,F722,F811,F821,F822,F823,F841,F842,F901,I001,I002,UP001,UP003,UP004,UP005,UP006,UP007,UP008,UP009,UP010,UP011,UP012,UP013,UP014,UP015,UP017,UP018,UP019,UP020,UP021,UP022,UP023,UP024,UP025,UP026,UP028,UP029,UP030,UP031,UP032,UP033,UP034,UP035,UP036,UP037,UP039,UP040,UP041,UP042,UP043,UP044,UP045,UP046,UP047,UP049,UP050
        description: >
          Arguments passed to ruff check (e.g. '. --select E,F' to override
          the default list). Default excludes _gh_automations/, which is
          where other reusable workflows in this repo check themselves out
          as a sibling for PR comment scripts. Without this exclude,
          consumers see ruff errors from this repo's own scripts in their
          skill PRs. The --select list is explicit (OPE-721) rather than
          left to ruff's own default: ruff's default rule set depends on
          whether a caller's pyproject.toml happens to carry a [tool.ruff]
          table, even an empty one, so two repositories with the same
          Python source could otherwise get different lint results from the
          same ruff release. The list is today's 108-rule baseline;
          widening it is a reviewed change to this default, not a ruff
          upgrade.
      pre_commit:
        type: boolean
        default: false
        description: "Run pre-commit run --all-files (requires .pre-commit-config.yaml)"
      actionlint:
        type: boolean
        default: true
        description: >
          Run actionlint over .github/workflows: expression syntax, action
          inputs, runner labels, job and step shapes. External linters
          (shellcheck, pyflakes) are off, so a run block's shell style is
          not judged. A workflow GitHub refuses at parse time fails every
          push to every branch with no job created and no filter applied
          (hivemind-test-harness docs-mirror.yml, 60 runs); this catches
          it on the pull request.
      actionlint_fail:
        type: boolean
        default: true
        description: >
          A finding from actionlint fails the job. ruff and pre-commit stay
          informational; a workflow file GitHub cannot parse is a different
          class of defect. Set false to report only.
      pr_comment:
        type: boolean
        default: true
        description: "Post a section in the OVOS PR Checks comment on pull_request events"
      section_key:
        type: string
        default: ""
        description: >
          Key of the PR comment section. The comment keeps one section per
          id, so a caller that runs this workflow more than once on one pull
          request (one ruff_args per package, say) gives each call its own
          key, or the last call overwrites the section of the others. Empty
          keeps the historical id "lint"; a value gives "lint-<key>" and the
          title "Lint (<key>)".

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}
  # The exact actionlint release the fleet lints with. Unpinned, a new
  # actionlint release changed the verdict of every caller with no change in
  # any repository (gh-automations#139 review). Renovate moves this pin by
  # pull request (renovate.json, customManagers); test.yml installs the same
  # release for the workflow's own tests, and a test keeps the two equal.
  ACTIONLINT_PY: "actionlint-py==1.7.12.24"
  # The exact ruff release the fleet reports with, for the same reason
  # ACTIONLINT_PY is pinned above: an unpinned linter changes the verdict of
  # every caller with no change in any repository. The rule set itself is no
  # longer left to this pin: ruff_args carries an explicit --select (OPE-721),
  # so moving this pin changes the ruff build, not the rule set it reports
  # with. Renovate moves this pin by pull request (renovate.json,
  # customManagers).
  RUFF: "ruff==0.16.10"

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install ruff
        if: ${{ inputs.ruff }}
        run: uv pip install "$RUFF"

      - name: Run ruff
        if: ${{ inputs.ruff }}
        id: ruff
        run: ruff check ${{ inputs.ruff_args }} --output-format=github
        continue-on-error: true

      - name: Count the files ruff checked
        # ruff exits 0 for a clean tree and for a ruff_args that matched no
        # file, and the comment read "no issues" for both. The count tells
        # them apart (T-2338).
        if: ${{ inputs.ruff }}
        id: ruff_files
        run: |
          N=$(ruff check ${{ inputs.ruff_args }} --show-files 2>/dev/null | grep -c . || true)
          echo "ruff matched $N file(s)"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" = "0" ]; then
            echo "::warning title=ruff checked nothing::ruff_args '${{ inputs.ruff_args }}' matched no file; the lint result is empty, not clean"
          fi

      - name: Install pre-commit
        if: ${{ inputs.pre_commit }}
        run: uv pip install pre-commit

      - name: Run pre-commit
        if: ${{ inputs.pre_commit }}
        id: pre_commit
        run: pre-commit run --all-files
        continue-on-error: true

      - name: Run actionlint
        if: ${{ inputs.actionlint }}
        id: actionlint
        continue-on-error: true
        run: |
          uv pip install "$ACTIONLINT_PY"
          N=$(ls .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | wc -l)
          echo "files=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" = "0" ]; then
            echo "no workflow file under .github/workflows"
            echo "findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # -shellcheck= and -pyflakes= turn the external linters off: the
          # check is the workflow file, not the shell inside it.
          set +e
          actionlint -no-color -shellcheck= -pyflakes= 2>&1 | tee /tmp/actionlint-output.txt
          RC=${PIPESTATUS[0]}
          set -e
          FINDINGS=$(grep -cE '^\.github/workflows/[^:]+:[0-9]+:[0-9]+: ' /tmp/actionlint-output.txt || true)
          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "actionlint: $N workflow file(s), $FINDINGS finding(s), exit $RC"
          exit $RC

      - name: Format lint section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          {
            if [ "${{ inputs.ruff }}" == "true" ]; then
              N="${{ steps.ruff_files.outputs.count }}"
              if [ "$N" == "0" ]; then
                echo "⚠️ **ruff**: checked no file (ruff_args matched nothing) — not a clean result"
              elif [ "${{ steps.ruff.outcome }}" == "success" ]; then
                echo "✅ **ruff**: no issues in $N file(s)"
              elif [ "${{ steps.ruff.outcome }}" == "failure" ]; then
                echo "❌ **ruff**: issues found in $N file(s) — see job log"
              fi
            fi
            if [ "${{ inputs.pre_commit }}" == "true" ]; then
              if [ "${{ steps.pre_commit.outcome }}" == "success" ]; then
                echo "✅ **pre-commit**: all hooks passed"
              elif [ "${{ steps.pre_commit.outcome }}" == "failure" ]; then
                echo "❌ **pre-commit**: hooks failed — see job log"
              fi
            fi
            if [ "${{ inputs.actionlint }}" == "true" ]; then
              AF="${{ steps.actionlint.outputs.files }}"; AN="${{ steps.actionlint.outputs.findings }}"
              if [ "${{ steps.actionlint.outcome }}" == "success" ]; then
                echo "✅ **actionlint**: $AF workflow file(s), no finding"
              elif [ "${{ steps.actionlint.outcome }}" == "failure" ]; then
                echo "❌ **actionlint**: ${AN:-some} finding(s) in $AF workflow file(s) — see job log"
              fi
            fi
          } > /tmp/lint-section.md

      - name: Post lint section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_KEY: ${{ inputs.section_key }}
        run: |
          # One section per call: two lint jobs on one pull request used to
          # share the id "lint" and the second overwrote the first (T-2899).
          if [ -z "$SECTION_KEY" ]; then
            SECTION_ID="lint"; TITLE="🔍 Lint"
          else
            SECTION_ID="lint-$(printf '%s' "$SECTION_KEY" | tr -c 'A-Za-z0-9_-' '-')"
            TITLE="🔍 Lint ($SECTION_KEY)"
          fi
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "$SECTION_ID" \
            --title "$TITLE" \
            --content-file /tmp/lint-section.md

      - name: Fail the job on actionlint findings
        if: ${{ inputs.actionlint && inputs.actionlint_fail && steps.actionlint.outcome == 'failure' }}
        run: |
          echo "::error title=actionlint::a workflow file under .github/workflows has a finding GitHub may refuse at parse time; see the actionlint step"
          exit 1

      # ruff and pre-commit are informational — they never block merges.
      # actionlint does, unless actionlint_fail is false (T-2915).
      # Fix the issues at your own pace; the PR Checks comment shows what needs attention.
