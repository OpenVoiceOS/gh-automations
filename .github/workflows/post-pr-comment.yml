name: Post PR Comment
# Reusable workflow — called via workflow_run so it has base-repo secret access.
# Downloads the pr-comment-section artifact uploaded by the triggering workflow
# and posts/updates the shared OVOS PR Checks comment using the GitHub App token.
#
# Usage in consumer repo (.github/workflows/post-pr-comments.yml):
#
#   name: Post PR Comments
#   on:
#     workflow_run:
#       workflows:
#         - Build Tests
#         - Coverage
#         - Lint
#         - Repo Health
#         - License Check
#         - Pip Audit
#         - Skill Check
#         - OPM Check
#         - Ovoscope
#         - Locale Check
#         - Downstream Check
#         - Docs Check
#         - Release Preview
#       types: [completed]
#   jobs:
#     post:
#       uses: OpenVoiceOS/gh-automations/.github/workflows/post-pr-comment.yml@dev
#       secrets: inherit
on:
  workflow_call:
    secrets:
      LOCALIZE_APP_PRIVATE_KEY:
        required: false
        description: "Private key for the GitHub App used to post PR comments"

jobs:
  post_comment:
    runs-on: ubuntu-latest
    # Only run for pull_request-triggered workflow runs (not push/manual).
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout gh-automations scripts
        uses: actions/checkout@v4
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Find PR number from head branch
        id: pr
        run: |
          REPO="${{ github.event.workflow_run.repository.full_name }}"
          FORK_OWNER="${{ github.event.workflow_run.head_repository.owner.login }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR_NUMBER=$(gh api "repos/$REPO/pulls?head=${FORK_OWNER}:${HEAD_BRANCH}&state=open" \
            --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for ${FORK_OWNER}:${HEAD_BRANCH} — skipping"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "PR number: $PR_NUMBER"
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pr-comment-section artifact
        if: ${{ steps.pr.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: pr-comment-section
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/pr-section/
        continue-on-error: true

      - name: Check artifact exists
        id: check
        if: ${{ steps.pr.outputs.found == 'true' }}
        run: |
          shopt -s nullglob
          files=(/tmp/pr-section/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Found ${#files[@]} section file(s)"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No pr-comment-section artifact in run ${{ github.event.workflow_run.id }}"
          fi

      - name: Generate app token
        id: app-token
        if: ${{ steps.check.outputs.found == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LOCALIZE_APP_ID }}
          private-key: ${{ secrets.LOCALIZE_APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Post sections to PR comment
        if: ${{ steps.check.outputs.found == 'true' }}
        run: |
          python3 <<'PYEOF'
          import json, sys, pathlib, subprocess

          repo = "${{ github.event.workflow_run.repository.full_name }}"
          pr   = "${{ steps.pr.outputs.number }}"

          section_files = sorted(pathlib.Path("/tmp/pr-section/").glob("*.json"))
          exit_code = 0
          for sf in section_files:
              meta = json.loads(sf.read_text())
              content_file = f"/tmp/{sf.stem}-content.md"
              pathlib.Path(content_file).write_text(meta["content"])
              result = subprocess.run([
                  sys.executable,
                  "_gh_automations/scripts/update_pr_comment.py",
                  "--repo", repo,
                  "--pr",   pr,
                  "--section-id", meta["section_id"],
                  "--title", meta["title"],
                  "--content-file", content_file,
              ])
              if result.returncode != 0:
                  exit_code = result.returncode
          sys.exit(exit_code)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
