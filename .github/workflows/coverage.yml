name: Coverage Report
#
# gh_token secret: only pass this from a workflow triggered directly by the
# repo's own trusted events (push, pull_request from a same-repo branch,
# workflow_dispatch). NEVER pass it from a pull_request_target-triggered
# caller that checks out fork code -- that hands a live token to
# attacker-controlled build code (a "pwn request"). This workflow refuses
# to run with gh_token set on pull_request_target as a backstop.
on:
  workflow_call:
    inputs:
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.11"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages to install before testing (space-separated)"
      test_extras:
        type: string
        default: "dev"
        description: >
          Name of the pyproject.toml extras key that declares the package's test
          dependencies (e.g. 'dev' or 'test'). Tried first via 'pip install -e
          .[<test_extras>]'. Override per repo if the package uses a different
          convention.
      test_extras_fallback:
        type: string
        default: "test"
        description: >
          Extras key tried if `test_extras` is not declared. Default 'test'.
          Set to empty to skip the fallback.
      install_extras:
        type: string
        default: ""
        description: >
          Extra pip install arguments run before tests. Example: '.[dev]' or
          '-r requirements/test.txt'. If empty, the package itself is installed
          via 'pip install -e .[dev]' (falling back to bare install).
      pre_install_pip:
        type: string
        default: ""
        description: >
          Optional space-separated pip requirement specs to install BEFORE the
          package install step. Use this to override transitive deps with git
          URLs (e.g. for testing against an unreleased version of a sibling
          package).
      test_path:
        type: string
        default: "test/"
        description: "Path passed to pytest (file, directory, or glob)"
      coverage_source:
        type: string
        default: "."
        description: >
          Value of --cov= passed to pytest. Set to your package directory (e.g.
          'ovos_core') to measure only your own code rather than the full repo.
      deploy_pages:
        type: boolean
        default: false
        description: >
          Push the HTML coverage report to the gh-pages branch for GitHub Pages
          serving. Replaces the separate coverage-pages.yml workflow.
      gh_pages_branch:
        type: string
        default: "gh-pages"
        description: "Branch to push the HTML coverage report to (when deploy_pages: true)."
      min_coverage:
        type: number
        default: 0
        description: >
          Minimum total coverage percentage (0 = disabled). The job fails if
          coverage falls below this threshold.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a section in the shared 'OVOS PR Checks' comment on the PR.
          Only runs when the workflow is triggered by a pull_request event.
          Shows total coverage, threshold status, and files below 80% coverage.
      artifact_name:
        type: string
        default: "coverage-report"
        description: "Name of the uploaded coverage artifact"
      artifact_retention_days:
        type: number
        default: 14
        description: "Days to retain the coverage XML artifact"
    secrets:
      gh_token:
        required: false
        description: >
          Optional token (PAT/App installation token) used to authenticate git
          clones of PRIVATE org dependencies during pre_install_pip. No-op when
          unset. SECURITY: the rewrite it installs is scoped to the calling
          repository's own org, but any dependency fetched during
          pre_install_pip still runs its own build backend with that token
          reachable via git config for the rest of the job. Callers MUST NOT
          pass this secret from a pull_request_target-triggered workflow (or
          any workflow that checks out and builds fork-controlled code) --
          doing so hands the token to attacker-controlled build code. This
          workflow fails fast if it detects that combination.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  coverage:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      pull-requests: write
      contents: write   # needed for deploy_pages git push; harmless when deploy_pages: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install System Dependencies
        if: ${{ inputs.system_deps != '' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ${{ inputs.system_deps }}

      - name: Install Dependencies
        run: uv pip install pytest pytest-cov coverage[toml]

      - name: Refuse gh_token on pull_request_target
        if: ${{ github.event_name == 'pull_request_target' && secrets.gh_token != '' }}
        run: |
          echo "::error::gh_token must not be supplied on a pull_request_target run" \
            "-- it would expose the token to fork-controlled build code (pwn request)."
          exit 1

      - name: Authenticate git for private dependencies
        if: ${{ inputs.pre_install_pip != '' }}
        env:
          GH_DEP_TOKEN: ${{ secrets.gh_token }}
          GH_ORG: ${{ github.repository_owner }}
        run: |
          if [ -n "${GH_DEP_TOKEN}" ]; then
            git config --global \
              url."https://x-access-token:${GH_DEP_TOKEN}@github.com/${GH_ORG}/".insteadOf \
              "https://github.com/${GH_ORG}/"
            echo "Configured git auth for private dependencies under ${GH_ORG}."
          fi

      - name: Pre-install pip requirements
        if: ${{ inputs.pre_install_pip != '' }}
        run: |
          # shellcheck disable=SC2086
          uv pip install ${{ inputs.pre_install_pip }}

      # The rewrite embeds the token in ~/.gitconfig, where every later step in
      # the job can read it -- including the Pages deploy push. Drop it as soon
      # as dependency resolution is done.
      - name: Clear git auth for private dependencies
        if: ${{ always() && inputs.pre_install_pip != '' }}
        env:
          GH_DEP_TOKEN: ${{ secrets.gh_token }}
          GH_ORG: ${{ github.repository_owner }}
        run: |
          if [ -n "${GH_DEP_TOKEN}" ]; then
            git config --global --unset-all \
              url."https://x-access-token:${GH_DEP_TOKEN}@github.com/${GH_ORG}/".insteadOf || true
          fi

      - name: Install Package
        run: |
          PRIMARY="${{ inputs.test_extras }}"
          FALLBACK="${{ inputs.test_extras_fallback }}"
          if [ -n "$PRIMARY" ] && uv pip install -e ".[$PRIMARY]" 2>/dev/null; then
            echo "Installed package with [$PRIMARY] extras"
          elif [ -n "$FALLBACK" ] && uv pip install -e ".[$FALLBACK]" 2>/dev/null; then
            echo "Installed package with [$FALLBACK] extras"
          elif uv pip install -e . 2>/dev/null; then
            echo "Installed package (no test extras found)"
          else
            echo "No installable package found at repo root — continuing without install"
          fi
          if [ -n "${{ inputs.install_extras }}" ]; then
            uv pip install ${{ inputs.install_extras }}
          fi

      - name: Run Tests with Coverage
        id: run_tests
        run: |
          python -m pytest \
            ${{ inputs.test_path }} \
            --cov=${{ inputs.coverage_source }} \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=html \
            -v
        # Generate the report even if some tests fail so the PR comment is always posted.
        continue-on-error: true

      - name: Extract Coverage Percentage
        id: extract
        run: |
          if [ -f coverage.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered'],2))")
          else
            TOTAL=0
          fi
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Write Job Summary
        if: always()
        run: |
          TOTAL="${{ steps.extract.outputs.total }}"
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Coverage | **${TOTAL}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ inputs.python_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${{ inputs.coverage_source }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.min_coverage }}" != "0" ]; then
            echo "| Minimum Required | ${{ inputs.min_coverage }}% |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f coverage.xml ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Full XML report uploaded as artifact \`${{ inputs.artifact_name }}\`._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Format coverage section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          min_cov = float(os.environ.get("MIN_COVERAGE", "0"))
          tests_outcome = os.environ.get("TESTS_OUTCOME", "unknown")

          try:
              with open("coverage.json") as f:
                  data = json.load(f)
              total = round(data["totals"]["percent_covered"], 1)
              files = data.get("files", {})
          except (FileNotFoundError, KeyError, json.JSONDecodeError):
              total = None
              files = {}

          lines = []

          # Header line: total + threshold status
          if total is None:
              lines.append("⚠️ Coverage data unavailable — check the job log.")
          else:
              if min_cov > 0:
                  ok = total >= min_cov
                  icon = "✅" if ok else "❌"
                  threshold_note = f" (threshold: {min_cov}%)"
              else:
                  icon = "✅" if total >= 80 else ("⚠️" if total >= 60 else "❌")
                  threshold_note = ""
              lines.append(f"{icon} **{total}%** total coverage{threshold_note}")

          if tests_outcome == "failure":
              lines.append("")
              lines.append("⚠️ Some tests failed — coverage figures may be incomplete.")

          # Table of under-covered files (below 80%), or all files if <= 10 total
          if files:
              under = {
                  path: info for path, info in files.items()
                  if info["summary"]["percent_covered"] < 80
              }
              show = under if len(files) > 10 else files

              if show:
                  label = "Files below 80% coverage" if len(files) > 10 else "Per-file coverage"
                  lines.append("")
                  lines.append(f"<details><summary>{label} ({len(show)} file{'s' if len(show) != 1 else ''})</summary>")
                  lines.append("")
                  lines.append("| File | Coverage | Missing lines |")
                  lines.append("|------|----------|---------------|")
                  for path, info in sorted(show.items(), key=lambda kv: kv[1]["summary"]["percent_covered"]):
                      pct = round(info["summary"]["percent_covered"], 1)
                      missing = info["summary"].get("missing_lines", "?")
                      lines.append(f"| `{path}` | {pct}% | {missing} |")
                  lines.append("")
                  lines.append("</details>")

          if total is not None:
              lines.append("")
              lines.append(f"_Full report: download the `${{ inputs.artifact_name }}` artifact._")

          with open("/tmp/coverage-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          MIN_COVERAGE: ${{ inputs.min_coverage }}
          TESTS_OUTCOME: ${{ steps.run_tests.outcome }}

      - name: Post coverage section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "coverage" \
            --title "📊 Coverage" \
            --content-file /tmp/coverage-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage XML Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: coverage.xml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Deploy coverage report to GitHub Pages
        if: ${{ inputs.deploy_pages && hashFiles('htmlcov/index.html') != '' }}
        run: |
          BRANCH="${{ inputs.gh_pages_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r htmlcov /tmp/htmlcov
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf .
          fi
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/htmlcov/. .
          touch .nojekyll
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Update coverage report [skip ci]"
          git push origin "$BRANCH"

      - name: Enforce Minimum Coverage Threshold
        if: ${{ inputs.min_coverage > 0 }}
        run: |
          TOTAL="${{ steps.extract.outputs.total }}"
          python3 -c "
          total = float('${TOTAL}')
          minimum = float('${{ inputs.min_coverage }}')
          if total < minimum:
              print(f'Coverage {total}% is below the required minimum of {minimum}%')
              exit(1)
          print(f'Coverage {total}% meets the minimum of {minimum}%')
          "

      # Propagate test failures after the PR comment has been posted.
      - name: Fail job if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "Tests failed — see output above."
          exit 1
