# TEMPORARY — validation harness for the pip->uv migration (PR #60).
# Delete this file (plus the root pyproject.toml and selftest_pkg/) before
# merging to dev. It is not a reusable workflow and has no downstream consumers.
#
# It drives the REAL reusable workflows via local `uses:` against the in-repo
# dummy package (root pyproject.toml + selftest_pkg/), so the actual build /
# install / coverage / audit / type-check plumbing runs under uv on real
# runners — not just isolated uv commands.
#
# Why the fix under test matters: actions/setup-python gives a bare interpreter
# with no active virtualenv, and `uv pip install` refuses a non-venv install
# unless UV_SYSTEM_PYTHON=1 / --system is set. Every uv workflow now declares
# that env at workflow level; these jobs prove it works end to end.
#
# Triggered on push to this branch only, with pr_comment:false everywhere, so
# nothing is posted to PR #60.
name: "[selftest] uv migration"

on:
  push:
    branches: [migrate-to-uv]
  workflow_dispatch:

# Must cover the union of permissions the called reusable workflows declare,
# or GitHub rejects the call at compile time (startup failure) — even though
# the features needing them are disabled here (pr_comment/deploy_pages/sarif).
permissions:
  contents: write          # coverage.yml job declares contents: write (deploy_pages)
  pull-requests: write     # PR-comment jobs
  security-events: write   # pip-audit.yml SARIF upload

jobs:
  # Build sdist+wheel under `uv build`, install the wheel with extras under
  # `uv pip install`, run pytest — across every supported Python.
  build-tests:
    uses: ./.github/workflows/build-tests.yml
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: test
      test_path: selftest_pkg/tests
      pr_comment: false

  # BISECT step 2: add the two standard-permission calls.
  type-check:
    uses: ./.github/workflows/type-check.yml
    with:
      test_extras: dev
      mypy_args: selftest_pkg
      pr_comment: false

  license-check:
    uses: ./.github/workflows/license-check.yml
    with:
      install_extras: "[test]"
      warn_only: true
      pr_comment: false

  # Static guard: every workflow that runs `uv pip` MUST also declare
  # UV_SYSTEM_PYTHON, or it will fail at runtime on the setup-python interpreter.
  env-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert uv workflows declare UV_SYSTEM_PYTHON
        run: |
          set -euo pipefail
          missing=0
          for f in .github/workflows/*.yml; do
            [ "$(basename "$f")" = "_selftest-uv.yml" ] && continue
            if grep -qE 'uv pip (install|freeze)' "$f" && ! grep -q 'UV_SYSTEM_PYTHON' "$f"; then
              echo "::error file=$f::uses 'uv pip' but does not declare UV_SYSTEM_PYTHON"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All uv workflows declare UV_SYSTEM_PYTHON."
          exit "$missing"
