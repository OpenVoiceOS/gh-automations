# TEMPORARY — validation harness for the pip→uv migration (PR #60).
# Delete this file before merging to dev; it is not a reusable workflow and
# has no downstream consumers.
#
# Why this exists: `actions/setup-python` provides a bare interpreter with no
# active virtualenv. `uv pip install` refuses to touch a non-venv interpreter
# unless `--system` / `UV_SYSTEM_PYTHON=1` is set. The migration relies on the
# workflow-level `env: UV_SYSTEM_PYTHON: "1"` block added to every uv workflow.
# These jobs prove that (a) the uv command surface works on real runners under
# that env, and (b) no uv workflow is missing the env block.
name: "[selftest] uv migration"

on:
  push:
    branches: [migrate-to-uv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Exercise every uv verb the migration introduces (install, install -e,
  # build, freeze) against a throwaway package generated at runtime — no
  # fixture files committed, nothing downstream touched.
  uv-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Create throwaway package
        run: |
          PKG="${RUNNER_TEMP}/uv_selftest_pkg"
          mkdir -p "$PKG/src/uv_selftest"
          echo "__version__ = '0.0.0'" > "$PKG/src/uv_selftest/__init__.py"
          cat > "$PKG/pyproject.toml" <<'EOF'
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "uv-selftest"
          version = "0.0.0"
          requires-python = ">=3.10"

          [project.optional-dependencies]
          test = ["pytest"]

          [tool.setuptools.packages.find]
          where = ["src"]
          EOF
          mkdir -p "$PKG/test"
          echo "def test_ok(): assert True" > "$PKG/test/test_smoke.py"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Document the failure mode (without UV_SYSTEM_PYTHON)
        # Informational only: shows that uv refuses a non-venv install by
        # default, which is exactly what the workflow-level env block fixes.
        # Not a hard assertion, so it stays robust across uv versions.
        run: |
          if env -u UV_SYSTEM_PYTHON uv pip install --quiet pytest 2>err.log; then
            echo "::notice::uv allowed a system install without UV_SYSTEM_PYTHON (uv default may have changed)"
          else
            echo "::notice::Confirmed: uv refuses system install without UV_SYSTEM_PYTHON —"
            sed 's/^/  /' err.log || true
          fi

      - name: uv command surface (with UV_SYSTEM_PYTHON, as the workflows set it)
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          set -euxo pipefail
          uv pip install pytest build wheel
          uv build --out-dir "${PKG}/dist" "${PKG}"
          uv pip install "${PKG}"[test]
          uv pip install -e "${PKG}"[test]
          uv pip freeze | grep -i uv-selftest
          python -m pytest "${PKG}/test" -v

  # Static guard: every workflow that runs `uv pip` MUST also declare
  # UV_SYSTEM_PYTHON, or it will fail at runtime on the setup-python interpreter.
  env-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert uv workflows declare UV_SYSTEM_PYTHON
        run: |
          set -euo pipefail
          missing=0
          for f in .github/workflows/*.yml; do
            [ "$(basename "$f")" = "_selftest-uv.yml" ] && continue
            if grep -qE 'uv pip (install|freeze)' "$f" && ! grep -q 'UV_SYSTEM_PYTHON' "$f"; then
              echo "::error file=$f::uses 'uv pip' but does not declare UV_SYSTEM_PYTHON"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All uv workflows declare UV_SYSTEM_PYTHON."
          exit "$missing"
