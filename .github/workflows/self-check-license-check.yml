name: Self Check License Check
# The license-check workflow, run against this repository, to prove that the
# package breakdown counts the packages that are installed.
#
# The breakdown used to pass the combined exclude to pip-licenses as
# `--filter-strings <regex>`. That option takes no argument, so the regex
# arrived as an unexpected positional, pip-licenses exited 2, and the silent
# fallback wrote an empty list. Every job summary and PR comment said
# "0 packages" whatever was installed.
#
# No step here compares the two jobs. This workflow proves that the breakdown
# runs against a real install and reports a count; the arithmetic of the count
# is asserted in `test/test_license_breakdown.py`, which runs the step's own
# python body over a fixture:
# `test_every_installed_package_is_counted`,
# `test_the_exclude_removes_only_what_it_names` and
# `test_a_near_name_is_not_excluded`.
#
# What each job does:
#
#   - `counts_every_installed_package`: no caller exclude. The
#     `Generate full license breakdown` step prints
#     "pip-licenses read N package(s); 0 excluded; N in the breakdown".
#   - `excludes_only_what_the_caller_names`: excludes requests and six, two
#     packages the first job keeps. The step prints the same counts line and
#     the names it excluded.
#
# A step that cannot run pip-licenses now fails loudly instead of reporting an
# empty breakdown, so a red here is a real failure and never a silent zero.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/license-check.yml'
      - '.github/workflows/self-check-license-check.yml'
      - 'test/canary/license-breakdown.txt'
  workflow_dispatch:

jobs:
  # The breakdown must count what is installed.
  counts_every_installed_package:
    uses: ./.github/workflows/license-check.yml
    with:
      gh_automations_ref: ${{ github.head_ref || github.ref_name }}
      install_extras: "-r test/canary/license-breakdown.txt"
      pr_comment: false

  # The caller's exclude must remove exactly the two packages it names.
  excludes_only_what_the_caller_names:
    uses: ./.github/workflows/license-check.yml
    with:
      gh_automations_ref: ${{ github.head_ref || github.ref_name }}
      install_extras: "-r test/canary/license-breakdown.txt"
      exclude_packages: "(?i:^requests([=<>!~ @;].*)?$)|(?i:^six([=<>!~ @;].*)?$)"
      pr_comment: false
