name: Notify Matrix
# Sends a message to the OVOS Matrix channel.
# No code checkout is required — this workflow sends a message only.
on:
  workflow_call:
    inputs:
      message:
        type: string
        required: true
        description: "Message to send to the Matrix channel"
      homeserver:
        type: string
        default: "matrix.org"
        description: "Matrix homeserver URL"
      channel:
        type: string
        default: "!WjxEKjjINpyBRPFgxl:krbel.duckdns.org"
        description: "Matrix room ID"
      runner:
        type: string
        default: "ubuntu-latest"

jobs:
  notify:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Send message to Matrix
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: ${{ inputs.homeserver }}
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: ${{ inputs.channel }}
          message: ${{ inputs.message }}
