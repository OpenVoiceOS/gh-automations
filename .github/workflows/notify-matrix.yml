name: Notify Matrix
# Sends a message to the OVOS Matrix channel.
# No code checkout is required — this workflow sends a message only.
on:
  workflow_call:
    inputs:
      message:
        type: string
        required: true
        description: "Message to send to the Matrix channel"
      homeserver:
        type: string
        default: "matrix.org"
        description: "Matrix homeserver URL"
      channel:
        type: string
        default: "!WjxEKjjINpyBRPFgxl:krbel.duckdns.org"
        description: "Matrix room ID"
      runner:
        type: string
        default: "ubuntu-latest"

jobs:
  notify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Send message to Matrix
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: |
          MSG="${{ inputs.message }}"
          ROOM_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' '${{ inputs.channel }}')
          curl -sf -X PUT \
            "https://${{ inputs.homeserver }}/_matrix/client/v3/rooms/${ROOM_ENC}/send/m.room.message/$(date +%s%N)" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg body "$MSG" '{"msgtype":"m.text","body":$body}')"
