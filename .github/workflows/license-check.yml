name: License Check
# Checks all installed dependencies for licenses incompatible with the OVOS universal donor policy.
#
# OVOS packages are Apache 2.0 — a permissive "universal donor" license. To preserve this:
#   - GPL (StrongCopyleft) MUST be excluded: incompatible with Apache 2.0 distribution.
#   - AGPL (NetworkCopyleft) MUST be excluded: triggered by network use, not just distribution.
#   - LGPL / EUPL (WeakCopyleft) SHOULD be excluded (conservative): safe to use-as-library
#     but risky if LGPL code is modified. Flag for human review.
#   - EULA / non-standard (Other) MUST be excluded: unknown terms = unknown risk.
#   - Unknown packages (Error) MUST be excluded: can't audit what you can't see.
#   - MPL (Mozilla Public License) is allowed: file-level copyleft, safe for Apache 2.0
#     when used as a library without modifying MPL files. Excluded by exclude_licenses.
#
# A central whitelist of license-flagged-but-safe packages (e.g. tqdm, dual-licensed
# MPL-2.0 AND MIT) is applied by default and unioned with the caller's exclude_packages,
# so most repos can leave exclude_packages empty. The audited source of truth with a
# justification per package is docs/license-whitelist.md.
#
on:
  workflow_call:
    inputs:
      gh_automations_ref:
        type: string
        default: "dev"
        description: >
          Branch or sha of OpenVoiceOS/gh-automations to take the helper
          scripts from. A caller testing a gh-automations branch passes that
          branch here so the scripts match the workflow it calls.
      uv_prerelease:
        type: string
        default: "allow"
        description: >
          uv prerelease resolution mode (allow | if-necessary | explicit |
          disallow). Defaults to "allow": the OVOS ecosystem ships pre-1.0 alphas
          and relies on prerelease floor-pins resolving the way pip did.
      runner:
        type: string
        default: "ubuntu-latest"
      python_version:
        type: string
        default: "3.14"
      install_extras:
        type: string
        default: ""
        description: >
          Extra dependencies to install. Accepts a bare extras name ('dev'),
          a bracketed list ('[dev,linux]'), a full target ('.[dev]'), or raw
          pip arguments ('-r requirements/test.txt').
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages beyond python3-dev and libssl-dev"
      exclude_packages:
        type: string
        default: ""
        description: >
          PCRE regex of repo-specific package names to exclude, unioned with the
          central whitelist (docs/license-whitelist.md) and the package under test
          (auto-derived from pyproject.toml/setup.py). Leave empty to use the
          central whitelist plus self-exclusion only. Example: '^my-internal-pkg$'.
      exclude_licenses:
        type: string
        default: "^Mozilla Public License.*"
        description: "PCRE regex of license identifiers to exclude. Default allows MPL (file-level copyleft, safe as library)."
      fail_licenses:
        type: string
        default: "StrongCopyleft,NetworkCopyleft,WeakCopyleft,Other,Error"
        description: |
          Comma-separated license categories that cause the check to fail.
          Valid values: StrongCopyleft, NetworkCopyleft, WeakCopyleft, Copyleft (all three),
          Permissive, Other, Error.
          Default enforces the OVOS universal donor policy (Apache 2.0).
      warn_only:
        type: boolean
        default: false
        description: >
          When true, report license violations in the PR comment but do NOT fail the job.
          Useful for repos in transition or where a violation needs review before fixing.
      pr_comment:
        type: boolean
        default: true
        description: >
          Post a section in the shared 'OVOS PR Checks' comment on the PR.
          Only runs when the workflow is triggered by a pull_request event.
      deny_no_metadata:
        type: string
        default: ""
        description: >
          Comma-separated package names that ship no licence metadata but
          whose PyPI history a maintainer has read and confirmed carries a
          forbidden licence. Such a package fails the hard check instead of
          being excluded as a WARN, without editing this shared workflow.

# uv installs into the setup-python interpreter (no venv on the runner)
env:
  UV_SYSTEM_PYTHON: "1"
  UV_PRERELEASE: ${{ inputs.uv_prerelease }}

jobs:
  license_tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout gh-automations scripts
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          repository: OpenVoiceOS/gh-automations
          ref: ${{ inputs.gh_automations_ref }}
          path: _gh_automations/

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        run: pip install uv

      - name: Install Build Tools
        run: uv pip install build wheel pip-licenses

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev libssl-dev ${{ inputs.system_deps }}

      - name: Install package
        run: |
          # install_extras accepts several caller spellings ("dev", "[dev]",
          # ".[dev]", or raw pip args like "-r reqs.txt"). Callers cannot
          # tell which single form a given reusable workflow expects, and a
          # wrong guess used to abort the job before any check ever ran.
          RAW="${{ inputs.install_extras }}"
          if [ -z "$RAW" ]; then
            NORMALIZED="."
          elif [[ "$RAW" == -* || "$RAW" == */* || "$RAW" == .* ]]; then
            NORMALIZED="$RAW"
          elif [[ "$RAW" == \[* ]]; then
            NORMALIZED=".$RAW"
          else
            NORMALIZED=".[$RAW]"
          fi
          # The torch wheel PyPI serves on Linux x86_64 pins the NVIDIA CUDA
          # runtime wheels (nvidia-*, cuda-toolkit). They are proprietary and
          # carry no licence metadata, so every torch caller failed here on
          # sixteen packages it never ships: they are the GPU host's own
          # runtime, and the same requirement resolves without them on every
          # other platform. The CPU index carries the torch family only, so
          # this audits the platform-neutral closure. A package that names an
          # nvidia-* wheel itself still gets it from PyPI and still fails
          # (T-2791). The CPU index also carries old copies of common
          # packages (requests, numpy), so uv must pick the best version
          # across both indexes: the +cpu local version wins for torch, PyPI
          # wins for everything newer there.
          uv pip install $NORMALIZED \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Collect transitive dependencies
        run: |
          uv pip freeze > requirements-all.txt
          if grep -qE '^torch==.*\+cpu' requirements-all.txt; then
            echo "torch resolved from the CPU index: the NVIDIA CUDA runtime wheels are not in this audit (T-2791)"
            printf '> torch resolved from the CPU index; the NVIDIA CUDA runtime wheels are not part of this audit.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The checker reads each licence from PyPI by name and version. A
          # PEP 440 local version label (torch==2.14.0+cpu) names a build
          # PyPI does not list, and the lookup read "Error". The label never
          # changes the licence, so it is dropped for the lookup.
          sed -i -E 's/^([^=]+==[^+[:space:]]+)\+[A-Za-z0-9.]+/\1/' requirements-all.txt

      - name: Detect combined-license packages safe by component
        id: combined
        # pilosus/action-pip-license-checker classifies a dependency by matching
        # regexes against its WHOLE license string (Clojure re-find for category,
        # re-matches — a full-string match — for exclude-license), never splitting
        # a combined report like orjson's "Apache Software License, MIT License,
        # Mozilla Public License 2.0 (MPL 2.0)". That string trips the WeakCopyleft
        # category (MPL substring match wins), and a caller's exclude_licenses
        # regex anchored at the start (the documented default
        # '^Mozilla Public License.*') never matches it back out, because the
        # string starts with "Apache", not "Mozilla". A repo that only depends on
        # orjson through wholly permissive components then fails for a license mix
        # every component of which is actually fine.
        #
        # Fix: evaluate each dependency's license field ourselves, split into its
        # components, and reproduce pilosus's own category precedence per
        # component (NetworkCopyleft > StrongCopyleft > WeakCopyleft > Permissive >
        # Other, ported from pip_license_checker.license). A component-classifier
        # is not run for a license string with no separator — single-license
        # packages are left untouched, matching prior behaviour exactly. For a
        # combined string, the whole package is added to the exclude-by-name list
        # (skipping it from the pilosus check entirely, the same mechanism as the
        # central whitelist below) only if EVERY component whose category is in
        # fail_licenses is matched by exclude_licenses (re.search, not anchored
        # full-match — the caller's regex only needs to find the offending phrase
        # inside its own component, not the whole combined string).
        env:
          FAIL_LICENSES: ${{ inputs.fail_licenses }}
          EXCLUDE_LICENSES: ${{ inputs.exclude_licenses }}
        run: |
          python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess

          subprocess.run(
              ["pip-licenses", "--format=json", "--with-urls"],
              stdout=open("/tmp/pip-licenses-precheck.json", "w"),
              stderr=subprocess.DEVNULL,
              check=False,
          )
          try:
              with open("/tmp/pip-licenses-precheck.json") as f:
                  packages = json.load(f)
          except Exception:
              packages = []

          # Ported from pip_license_checker.license (pilosus/pip-license-checker),
          # trimmed to the entries relevant to Python-ecosystem licenses. Checked
          # in NetworkCopyleft > StrongCopyleft > WeakCopyleft > Permissive order,
          # same precedence as the upstream classifier; unmatched -> "Other".
          NETWORK = [r"\bAffero", r"\bAGPL", r"GNU Affero General Public License",
                     r"\bOSL", r"Open Software License", r"\bRPSL"]
          STRONG = [r"GNU General Public License(?!.*classpath|.*linking|.*exception)",
                    r"\bGPL(?!.*classpath|.*linking|.*exception)",
                    r"IBM Public License", r"\bRPL", r"Reciprocal Public License",
                    r"Sleepycat License"]
          WEAK = [r"GNU Lesser General Public License", r"\bLGPL",
                  r"GNU General Public License.*(?:classpath|linking|exception)",
                  r"\bGPL.*(?:classpath|linking|exception)",
                  r"\bMPL", r"Mozilla Public License", r"\bEPL", r"Eclipse Public License",
                  r"\bEUPL", r"European Union Public Licence", r"\bCDDL",
                  r"Common Development and Distribution License", r"\bCPL",
                  r"Common Public License", r"\bAPSL", r"Apple Public Source License",
                  r"\bODbL", r"Open Database License"]
          PERMISSIVE = [r"\bApache", r"Apache Software License", r"BSD", r"\bMIT\b",
                        r"MIT License", r"Artistic", r"CC0", r"Public Domain",
                        r"Unlicense", r"\bISC\b", r"ISC License",
                        r"Python Software Foundation License", r"\bPSF", r"\bzlib",
                        r"WTFPL", r"\bW3C\b", r"Historical Permission Notice"]

          def classify(component):
              for bucket, cats in ((NETWORK, "NetworkCopyleft"), (STRONG, "StrongCopyleft"),
                                    (WEAK, "WeakCopyleft"), (PERMISSIVE, "Permissive")):
                  if any(re.search(p, component, re.IGNORECASE) for p in bucket):
                      return cats
              return "Other"

          fail_raw = {c.strip() for c in (os.environ.get("FAIL_LICENSES", "")).split(",") if c.strip()}
          fail_categories = set(fail_raw)
          if "Copyleft" in fail_categories:
              fail_categories |= {"StrongCopyleft", "NetworkCopyleft", "WeakCopyleft"}

          exclude_licenses = os.environ.get("EXCLUDE_LICENSES", "").strip()

          safe_names = []
          for pkg in packages:
              license_field = pkg.get("License", "") or ""
              # Only combined (multi-license) strings are handled here; a single
              # license string is left for pilosus exactly as before.
              components = [c.strip() for c in re.split(r",|\bAND\b|\bOR\b", license_field, flags=re.IGNORECASE) if c.strip()]
              if len(components) < 2:
                  continue
              offending = [c for c in components if classify(c) in fail_categories]
              if not offending:
                  continue
              if exclude_licenses and all(re.search(exclude_licenses, c) for c in offending):
                  name = pkg.get("Name", "")
                  if name:
                      canonical = re.sub(r'[-_.]+', '-', name).lower()
                      name_re = re.escape(canonical).replace(r"\-", "[-_.]")
                      safe_names.append(rf"(?i:^{name_re}([=<>!~ @;].*)?$)")

          # PEP 639 packages. A distribution that declares its license only as a
          # `License-Expression` (no legacy `License` field, no license
          # classifier) reads as category "Error" in the checker, which does not
          # parse the expression. build, packaging, wheel, urllib3 and zipp all
          # do this, so every repo that pulls them in went red for a permissive
          # license. Read the expression from the installed metadata and exclude
          # the package only when EVERY license identifier in it is on the
          # permissive SPDX list below. An expression with any other identifier
          # (GPL, LGPL, MPL, an unknown id, a LicenseRef) is left to the checker,
          # so no election between licence options is made here.
          from importlib.metadata import distributions
          PERMISSIVE_SPDX = {
              "0BSD", "APACHE-2.0", "BSD-1-CLAUSE", "BSD-2-CLAUSE", "BSD-3-CLAUSE",
              "BSD-3-CLAUSE-CLEAR", "CC0-1.0", "HPND", "ISC", "MIT", "MIT-0",
              "MIT-CMU", "PSF-2.0", "PYTHON-2.0", "UNLICENSE", "ZLIB",
          }
          seen = set()
          for dist in distributions():
              name = dist.metadata.get("Name") or ""
              expression = (dist.metadata.get("License-Expression") or "").strip()
              if not name or not expression:
                  continue
              ids = re.findall(r"[A-Za-z0-9.+-]+", expression)
              ids = [i for i in ids if i.upper() not in ("AND", "OR", "WITH")]
              if not ids or not all(i.upper() in PERMISSIVE_SPDX for i in ids):
                  continue
              canonical = re.sub(r'[-_.]+', '-', name).lower()
              if canonical in seen:
                  continue
              seen.add(canonical)
              name_re = re.escape(canonical).replace(r"\-", "[-_.]")
              safe_names.append(rf"(?i:^{name_re}([=<>!~ @;].*)?$)")

          print(f"regex={'|'.join(safe_names)}")
          PYEOF

      - name: Detect packages with no licence metadata
        id: no_metadata
        # A distribution can carry no `License` field, no `License-Expression`
        # and no `License ::` classifier at all (T-2477): a resolver picking up
        # a fresh prerelease before its licence metadata lands, e.g. tokenizers
        # 1.0.0rc2 on PyPI. pilosus reads that as category "Error" and
        # FAIL_LICENSES includes "Error" by default, so a dependency drift
        # nobody in the caller repo touched turns the job red.
        #
        # "No licence metadata at all" is not "an unreadable/forbidden
        # licence": there is nothing to read, so the caller cannot judge it.
        # Exclude such a package from the hard failure (this repo's WARN
        # section below reports it by name and version) unless it is named in
        # DENY_NO_METADATA — reserved for a package a maintainer has read the
        # source of and confirmed ships a forbidden licence despite the gap in
        # its PyPI metadata. A package with any licence metadata, forbidden or
        # not, is left untouched and still fails as before.
        env:
          FAIL_LICENSES: ${{ inputs.fail_licenses }}
          DENY_NO_METADATA_INPUT: ${{ inputs.deny_no_metadata }}
        run: |
          python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from importlib.metadata import distributions

          from packaging.version import InvalidVersion, Version

          def _released_licence(name: str) -> dict | None:
              """Look up the newest release (of the ten most recent) that
              carries licence metadata on PyPI.

              Returns a dict with a "status" of "found" or "unavailable" (the
              lookup itself failed, e.g. network or parse error) or "none"
              (every inspected release truly lacks licence metadata).
              """
              try:
                  req = urllib.request.Request(
                      f"https://pypi.org/pypi/{name}/json",
                      headers={"User-Agent": "gh-automations-license-check"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      project = json.load(r)
              except Exception:
                  return {"status": "unavailable"}

              releases = project.get("releases", {}) or {}
              parsed = []
              for version_str, files in releases.items():
                  if not files:
                      continue  # yanked/empty releases publish no artifacts
                  try:
                      parsed.append((Version(version_str), version_str))
                  except InvalidVersion:
                      continue
              parsed.sort(key=lambda v: v[0], reverse=True)

              lookup_failed = False
              for _, version_str in parsed[:10]:
                  try:
                      req = urllib.request.Request(
                          f"https://pypi.org/pypi/{name}/{version_str}/json",
                          headers={"User-Agent": "gh-automations-license-check"},
                      )
                      with urllib.request.urlopen(req, timeout=10) as r:
                          data = json.load(r)
                  except Exception:
                      lookup_failed = True
                      continue
                  info = data.get("info", {}) or {}
                  lic = (info.get("license") or "").strip()
                  lic_expression = (info.get("license_expression") or "").strip()
                  lic_classifier = next(
                      (c for c in info.get("classifiers", []) if c.startswith("License ::")), "")
                  if lic or lic_expression or lic_classifier:
                      return {
                          "status": "found",
                          "version": version_str,
                          "license": lic or lic_expression or lic_classifier,
                      }

              return {"status": "unavailable" if lookup_failed else "none"}

          subprocess.run(
              ["pip-licenses", "--format=json", "--with-urls"],
              stdout=open("/tmp/pip-licenses-nometa.json", "w"),
              stderr=subprocess.DEVNULL,
              check=False,
          )
          try:
              with open("/tmp/pip-licenses-nometa.json") as f:
                  packages = json.load(f)
          except Exception:
              packages = []

          # Reserved for a package confirmed by a human to ship a forbidden
          # licence despite carrying no machine-readable licence metadata on
          # PyPI. Fed by the caller's deny_no_metadata workflow_call input so
          # denying a package does not require editing this shared workflow.
          DENY_NO_METADATA: set[str] = {
              re.sub(r'[-_.]+', '-', n.strip()).lower()
              for n in os.environ.get("DENY_NO_METADATA_INPUT", "").split(",")
              if n.strip()
          }

          # Same categoriser and fail_licenses parsing as the "Detect combined-
          # license packages safe by component" step above (kept in sync
          # rather than imported: each step is an independent inline script).
          # Used below so a package whose OWN metadata is absent but whose
          # inherited (PyPI history) licence classifies as forbidden is not
          # silently excluded.
          NETWORK = [r"\bAffero", r"\bAGPL", r"GNU Affero General Public License",
                     r"\bOSL", r"Open Software License", r"\bRPSL"]
          STRONG = [r"GNU General Public License(?!.*classpath|.*linking|.*exception)",
                    r"\bGPL(?!.*classpath|.*linking|.*exception)",
                    r"IBM Public License", r"\bRPL", r"Reciprocal Public License",
                    r"Sleepycat License"]
          WEAK = [r"GNU Lesser General Public License", r"\bLGPL",
                  r"GNU General Public License.*(?:classpath|linking|exception)",
                  r"\bGPL.*(?:classpath|linking|exception)",
                  r"\bMPL", r"Mozilla Public License", r"\bEPL", r"Eclipse Public License",
                  r"\bEUPL", r"European Union Public Licence", r"\bCDDL",
                  r"Common Development and Distribution License", r"\bCPL",
                  r"Common Public License", r"\bAPSL", r"Apple Public Source License",
                  r"\bODbL", r"Open Database License"]
          PERMISSIVE = [r"\bApache", r"Apache Software License", r"BSD", r"\bMIT\b",
                        r"MIT License", r"Artistic", r"CC0", r"Public Domain",
                        r"Unlicense", r"\bISC\b", r"ISC License",
                        r"Python Software Foundation License", r"\bPSF", r"\bzlib",
                        r"WTFPL", r"\bW3C\b", r"Historical Permission Notice"]

          def classify(component):
              for bucket, cats in ((NETWORK, "NetworkCopyleft"), (STRONG, "StrongCopyleft"),
                                    (WEAK, "WeakCopyleft"), (PERMISSIVE, "Permissive")):
                  if any(re.search(p, component, re.IGNORECASE) for p in bucket):
                      return cats
              return "Other"

          fail_raw = {c.strip() for c in (os.environ.get("FAIL_LICENSES", "")).split(",") if c.strip()}
          fail_categories = set(fail_raw)
          if "Copyleft" in fail_categories:
              fail_categories |= {"StrongCopyleft", "NetworkCopyleft", "WeakCopyleft"}

          expression_by_name = {}
          classifier_by_name = {}
          for dist in distributions():
              name = dist.metadata.get("Name") or ""
              if not name:
                  continue
              canonical = re.sub(r'[-_.]+', '-', name).lower()
              expression_by_name[canonical] = (dist.metadata.get("License-Expression") or "").strip()
              classifiers = dist.metadata.get_all("Classifier") or []
              classifier_by_name[canonical] = any(c.startswith("License ::") for c in classifiers)

          safe_names = []
          warnings = []
          for pkg in packages:
              name = pkg.get("Name", "")
              version = pkg.get("Version", "")
              if not name:
                  continue
              canonical = re.sub(r'[-_.]+', '-', name).lower()
              license_field = (pkg.get("License") or "").strip()
              has_license_field = bool(license_field) and license_field.upper() != "UNKNOWN"
              has_expression = bool(expression_by_name.get(canonical))
              has_classifier = classifier_by_name.get(canonical, False)
              if has_license_field or has_expression or has_classifier:
                  continue  # some licence metadata exists; leave to the existing checks
              if canonical in DENY_NO_METADATA:
                  continue  # explicit deny: left to fail via the checker as "Error"

              inherited = _released_licence(name)
              inherited_forbidden = (
                  inherited.get("status") == "found"
                  and classify(inherited["license"]) in fail_categories
              )

              if not inherited_forbidden:
                  name_re = re.escape(canonical).replace(r"\-", "[-_.]")
                  safe_names.append(rf"(?i:^{name_re}([=<>!~ @;].*)?$)")
              warnings.append({"name": name, "version": version, "inherited": inherited,
                                "forbidden": inherited_forbidden})

          print(f"regex={'|'.join(safe_names)}")
          print(f"warnings={json.dumps(warnings)}")
          PYEOF

      - name: Build exclude regex
        id: exclude
        # Union five sources into one anchored PCRE alternation:
        #   1. the package under test (auto-derived from pyproject.toml/setup.py) — its
        #      own Apache-2.0 metadata trips pilosus on PEP 639 `license = {text = ...}`;
        #   2. the central whitelist of license-flagged-but-safe packages;
        #   3. the caller's repo-specific exclude_packages.
        #   4. packages auto-detected as safe combined-license strings (see the
        #      "Detect combined-license packages safe by component" step above).
        #   5. packages carrying no licence metadata at all (see the "Detect
        #      packages with no licence metadata" step above): reported as a
        #      WARN row, not a hard failure, unless denied by name.
        # Each branch stays anchored, so an empty caller input produces no leading/
        # trailing '|' and no empty alternation. Source of truth: docs/license-whitelist.md.
        env:
          CALLER_EXCLUDE: ${{ inputs.exclude_packages }}
          COMBINED_EXCLUDE: ${{ steps.combined.outputs.regex }}
          NO_METADATA_EXCLUDE: ${{ steps.no_metadata.outputs.regex }}
        run: |
          python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import os
          import re
          from pathlib import Path

          # 1. Package under test (derived from pyproject.toml, falling back to setup.py).
          try:
              import tomllib
          except ImportError:
              try:
                  import tomli as tomllib
              except ImportError:
                  tomllib = None

          name = None
          if tomllib is not None and Path("pyproject.toml").exists():
              try:
                  with open("pyproject.toml", "rb") as f:
                      name = tomllib.load(f).get("project", {}).get("name")
              except Exception:
                  pass
          if not name and Path("setup.py").exists():
              try:
                  m = re.search(r'name\s*=\s*["\']([^"\']+)["\']',
                                Path("setup.py").read_text())
                  if m:
                      name = m.group(1)
              except Exception:
                  pass
          self_pattern = ""
          if name:
              # pip canonicalises dashes/underscores/dots to hyphens.
              canonical = re.sub(r'[-_.]+', '-', name).lower()
              # The resolved requirement may report the name with EITHER separator
              # (e.g. "ovos_stt_plugin_azure==1.0"), so make each separator match
              # any of -_. — otherwise a hyphen-canonical anchor misses the
              # underscore form and the self-package is not excluded.
              name_re = re.escape(canonical).replace(r"\-", "[-_.]")
              # pilosus excludes via re-matches (full-string) against the resolved
              # "name==version" requirement, so anchor the name then allow a version
              # specifier / marker / url suffix or end-of-string. A bare "^name$" or a
              # ":"-separated anchor never matches "name==1.2.3".
              self_pattern = rf"(?i:^{name_re}([=<>!~ @;].*)?$)"

          # 2. Central whitelist (one anchored alternation per package).
          #   bidict — MPL-2.0 only (verified against the package's own LICENSE
          #          file and PyPI `license_expression` metadata: no MIT/BSD
          #          dual-license option exists, unlike tqdm/orjson below).
          #          MPL-2.0 is file-level copyleft that only reaches files an
          #          importer modifies; used as an unmodified imported library
          #          (pulled transitively via python-socketio/flask-socketio).
          #          Excluded per maintainer policy pending a fuller review,
          #          not because it is dual-licensed.
          #   tqdm — dual-licensed MPL-2.0 AND MIT; permissive via the MIT option,
          #          used as an unmodified imported library (pulled by huggingface_hub).
          #   marisa-trie — MIT AND (BSD-2-Clause OR LGPL-2.1-or-later); we elect the
          #          BSD-2-Clause option, used as an unmodified imported trie library
          #          (pulled transitively via langcodes/language_data).
          #   paho-mqtt — dual-licensed EPL-2.0 OR BSD-3-Clause; we elect the
          #          BSD-3-Clause option, used as an unmodified imported MQTT client
          #          (direct dependency of the *2mqtt bridges).
          #   fsspec — BSD-3-Clause (bundled LICENSE, © 2018 Martin Durant), but
          #          declares it via PEP 639 `License-Expression` with no legacy
          #          `License`/classifier, so the checker reports category "Error"
          #          rather than reading the permissive license. Pulled transitively
          #          via huggingface_hub.
          #   skops — MIT (bundled LICENSE, © 2021 Hugging Face Inc.), but ships only
          #          a bare `License :: OSI Approved` classifier with no specific
          #          license, so the checker cannot resolve it and reports "Error".
          #          Pulled transitively via the huggingface stack.
          #   timezonefinder-data — ODbL-1.0, and the package puts the entire
          #          license text in the `license` metadata field rather than an
          #          identifier, so the checker reports the whole preamble and
          #          categorises it as copyleft. ODbL covers the timezone
          #          boundary database, not code that reads it: it is a data
          #          license with no reciprocal effect on an importing program.
          #          Used as an unmodified imported dataset, pulled transitively
          #          via timezonefinder.
          #   orjson — License-Expression `MPL-2.0 AND (Apache-2.0 OR MIT)`: the
          #          code is Apache/MIT (elect either), MPL-2.0 covers only a
          #          bundled component and is file-level copyleft, safe as an
          #          unmodified imported library — same footing as tqdm. The
          #          checker categorises the combined expression as WeakCopyleft.
          #          Pulled transitively across OVOS via ovos-bus-client/ovos-config.
          #   setuptools — MIT (bundled LICENSE file). The 79.x wheels declare
          #          no `License`, no `License-Expression` and no license
          #          classifier, only `License-File: LICENSE`, so the checker
          #          reports category "Error". 80.0 and later declare
          #          `License-Expression: MIT`, which the PEP 639 step above
          #          reads. Pulled by nearly every build.
          central = (r"(?i:^bidict([=<>!~ @;].*)?$)"
                     r"|(?i:^tqdm([=<>!~ @;].*)?$)|(?i:^marisa[-_]trie([=<>!~ @;].*)?$)"
                     r"|(?i:^paho[-_]mqtt([=<>!~ @;].*)?$)"
                     r"|(?i:^fsspec([=<>!~ @;].*)?$)|(?i:^skops([=<>!~ @;].*)?$)"
                     r"|(?i:^orjson([=<>!~ @;].*)?$)"
                     r"|(?i:^timezonefinder[-_]data([=<>!~ @;].*)?$)"
                     r"|(?i:^setuptools([=<>!~ @;].*)?$)")

          # 3. Caller-supplied repo-specific excludes.
          caller = (os.environ.get("CALLER_EXCLUDE") or "").strip()

          # 4. Packages auto-detected as safe combined-license strings.
          combined = (os.environ.get("COMBINED_EXCLUDE") or "").strip()

          # 5. Packages carrying no licence metadata at all.
          no_metadata = (os.environ.get("NO_METADATA_EXCLUDE") or "").strip()

          parts = [p for p in (self_pattern, central.strip(), caller, combined, no_metadata) if p]
          if not parts:
              merged = ""
          elif len(parts) == 1:
              merged = parts[0]
          else:
              merged = "|".join(f"({p})" for p in parts)
          print(f"regex={merged}")
          PYEOF

      - name: Check licenses
        id: license_check_report
        uses: pilosus/action-pip-license-checker@v3
        # continue-on-error so the PR comment step always runs, even when licenses fail.
        # The job still fails at the end via the outcome check below (unless warn_only).
        continue-on-error: true
        with:
          requirements: 'requirements-all.txt'
          fail: ${{ inputs.fail_licenses }}
          fails-only: true
          totals: true
          headers: true
          exclude: ${{ steps.exclude.outputs.regex }}
          exclude-license: ${{ inputs.exclude_licenses }}

      - name: Generate full license breakdown
        id: license_breakdown
        run: |
          # Run pip-licenses to get the full per-package breakdown as JSON.
          # Use the same combined exclude (self + caller-supplied) as the pilosus check.
          COMBINED="${{ steps.exclude.outputs.regex }}"
          if [ -n "$COMBINED" ]; then
            # pip-licenses uses --ignore-packages with space-separated names; the combined
            # pattern is a PCRE regex intended for pilosus.  Pass it via --filter-strings
            # which also supports regex-style matching in pip-licenses.
            EXCLUDE_ARGS="--filter-strings $COMBINED"
          fi
          pip-licenses \
            --format=json \
            --with-urls \
            --order=license \
            $EXCLUDE_ARGS \
            > /tmp/pip-licenses.json 2>/dev/null || echo "[]" > /tmp/pip-licenses.json
          # Summarize license distribution for the step output
          DIST=$(python3 -c "
          import json, collections
          try:
              data = json.load(open('/tmp/pip-licenses.json'))
              counts = collections.Counter(p['License'] for p in data)
              total = len(data)
              print(total)
          except Exception:
              print(0)
          ")
          echo "total_packages=$DIST" >> $GITHUB_OUTPUT

      - name: Print report
        if: always()
        run: echo "${{ steps.license_check_report.outputs.report }}"

      - name: Format license section for PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, collections

          outcome = os.environ["OUTCOME"]
          report = os.environ["REPORT"].strip()
          total_packages = int(os.environ.get("TOTAL_PACKAGES", "0"))
          try:
              no_metadata_warnings = json.loads(os.environ.get("NO_METADATA_WARNINGS") or "[]")
          except json.JSONDecodeError:
              no_metadata_warnings = []

          # Load full license breakdown from pip-licenses
          try:
              with open("/tmp/pip-licenses.json") as f:
                  all_pkgs = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              all_pkgs = []

          if total_packages == 0:
              total_packages = len(all_pkgs)

          pkg_note = f" ({total_packages} packages)" if total_packages > 0 else ""

          lines = []

          # Status header
          if outcome == "success":
              lines.append(f"✅ No license violations found{pkg_note}.")
          else:
              lines.append(f"❌ License violations detected{pkg_note} — review required before merging.")
              if report:
                  lines.append(f"\n```\n{report}\n```")

          # Packages with no licence metadata at all: reported as a WARN row,
          # never a hard failure, unless denied by name (see the "Detect
          # packages with no licence metadata" step).
          if no_metadata_warnings:
              lines.append("\n**⚠️ No licence metadata found (not blocking):**")
              for w in no_metadata_warnings:
                  inherited = w.get("inherited") or {}
                  status = inherited.get("status")
                  if status == "found" and w.get("forbidden"):
                      note = (f" — inherited from {w['name']} {inherited['version']}: "
                              f"{inherited['license']} (forbidden; NOT excluded, still fails)")
                  elif status == "found":
                      note = (f" — inherited from {w['name']} {inherited['version']}: "
                              f"{inherited['license']}")
                  elif status == "unavailable":
                      note = " — licence lookup unavailable"
                  else:
                      note = " — no released version carries licence metadata either"
                  lines.append(f"- `{w['name']}=={w['version']}`{note}")

          # License distribution summary (always shown)
          if all_pkgs:
              dist = collections.Counter(p.get("License", "Unknown") for p in all_pkgs)
              top = sorted(dist.items(), key=lambda x: -x[1])
              dist_parts = ", ".join(f"{count}× {lic}" for lic, count in top[:8])
              if len(top) > 8:
                  dist_parts += f", +{len(top)-8} more"
              lines.append(f"\n**License distribution:** {dist_parts}")

          # Full per-package breakdown in a collapsible section
          if all_pkgs:
              # Identify failing packages (those in the violations report) for highlighting
              failing_names = set()
              if report:
                  for line in report.splitlines():
                      parts = line.split()
                      if parts:
                          failing_names.add(parts[0].lower())

              lines.append("")
              lines.append(f"<details><summary>Full breakdown — {total_packages} packages</summary>")
              lines.append("")
              lines.append("| Package | Version | License | URL |")
              lines.append("|---------|---------|---------|-----|")
              for pkg in sorted(all_pkgs, key=lambda p: p.get("Name", "").lower()):
                  name = pkg.get("Name", "?")
                  version = pkg.get("Version", "?")
                  lic = pkg.get("License", "Unknown")
                  url = pkg.get("URL", "")
                  url_cell = f"[link]({url})" if url and url != "UNKNOWN" else ""
                  # Highlight failing packages
                  flag = " ⚠️" if name.lower() in failing_names else ""
                  lines.append(f"| `{name}`{flag} | {version} | {lic} | {url_cell} |")
              lines.append("")
              lines.append("</details>")

          lines.append(
              "\n_Policy: Apache 2.0 (universal donor). "
              "StrongCopyleft / NetworkCopyleft / WeakCopyleft / Other / Error categories fail. "
              "MPL allowed._"
          )

          with open("/tmp/license-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          OUTCOME: ${{ steps.license_check_report.outcome }}
          REPORT: ${{ steps.license_check_report.outputs.report }}
          TOTAL_PACKAGES: ${{ steps.license_breakdown.outputs.total_packages }}
          NO_METADATA_WARNINGS: ${{ steps.no_metadata.outputs.warnings }}

      - name: Post license section to PR comment
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "license" \
            --title "⚖️ License Check" \
            --content-file /tmp/license-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job after posting the PR comment so the check status is correct.
      # Skipped when warn_only is true — violations are reported but don't block the merge.
      - name: Fail job if license check failed
        if: ${{ steps.license_check_report.outcome == 'failure' && !inputs.warn_only }}
        run: |
          echo "License check failed — see report above."
          exit 1

      - name: Warn about license violations (warn_only mode)
        if: ${{ steps.license_check_report.outcome == 'failure' && inputs.warn_only }}
        run: |
          echo "::warning::License violations found (warn_only=true — job not failed). See PR comment for details."
