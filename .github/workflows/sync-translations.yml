name: Sync Translations
# Reusable workflow for synchronising gitlocalize-app[bot] translation commits.
#
# Triggers on push to the target branch (filtered to gitlocalize-app[bot] commits)
# and on workflow_dispatch for manual runs. Runs scripts/sync_translations.py,
# then auto-commits any resulting changes back to the branch.
#
# Usage in a calling repo:
#
#   jobs:
#     sync_translations:
#       uses: OpenVoiceOS/gh-automations/.github/workflows/sync-translations.yml@dev
#       secrets: inherit
#       with:
#         branch: dev                                      # optional, default: dev
#         python_version: '3.11'                           # optional
#         script_path: scripts/sync_translations.py        # optional
#
on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: "dev"
        description: "Branch to checkout, run the script on, and commit back to"
      python_version:
        type: string
        default: "3.11"
        description: "Python version to use"
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      script_path:
        type: string
        default: "scripts/sync_translations.py"
        description: "Relative path to the sync_translations.py script in the calling repo"

jobs:
  sync_translations:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run sync script (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: python ${{ inputs.script_path }}

      - name: Run sync script (gitlocalize-app[bot] push)
        if: |
          github.event_name == 'push' &&
          github.actor == 'gitlocalize-app[bot]'
        run: python ${{ inputs.script_path }}

      - name: Commit updated translations
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync translations"
          branch: ${{ inputs.branch }}
