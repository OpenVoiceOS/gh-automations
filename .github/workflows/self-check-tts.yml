name: Self Check TTS
# The TTS intelligibility workflow, run against this repository, to prove that
# pre_test_command reaches pytest in the same shell.
#
# The positive job supplies a command that writes the test file, and names that
# same file as test_path. If the command runs where the comment says it does,
# pytest finds the file and the job passes. Without the command there is no
# file, so this is a test that cannot pass by accident.
#
# The negative job is the same call with no command, and it must fail. It runs
# on workflow_dispatch only: a job that must fail leaves a failing run on the
# pull request head, where the merge gate reads it as a red head and no reader
# can tell an intended failure from a real one.
#
# install_extras is '-r /dev/null', the raw-pip-arguments spelling the input
# documents. This repository ships no package at its root, and the workflow
# installs the repository before testing.
#
# Fold this file into self-check.yml when #124 lands; both are this
# repository's own workflows run against itself.
#
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/tts-intelligibility.yml'
      - '.github/workflows/self-check-tts.yml'
  workflow_dispatch:

jobs:
  # Must pass: the command writes the file that test_path names.
  pre_test_command_reaches_pytest:
    uses: ./.github/workflows/tts-intelligibility.yml
    with:
      install_extras: "-r /dev/null"
      pre_test_command: "mkdir -p test/canary && printf 'def test_pre_test_command_ran():\\n    assert True\\n' > test/canary/test_pre_test_command.py"
      test_path: "test/canary/test_pre_test_command.py"
      pr_comment: false

  # Must fail: same call, no command, so pytest has no file to collect.
  pre_test_command_absent:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/tts-intelligibility.yml
    with:
      install_extras: "-r /dev/null"
      test_path: "test/canary/test_pre_test_command.py"
      pr_comment: false
