name: Python Support
# DEPRECATED — use build-tests.yml instead.
#
# build-tests.yml covers multi-version build + install + test and posts an
# equivalent PR comment section. The editable-install matrix this workflow
# adds rarely catches anything that build-tests.yml misses in practice.
#
# This file is kept for backwards compatibility with existing callers.
# New repos should not use it. Existing callers can migrate opportunistically.
# REMOVE AFTER: 2027-01-01 — verify no active callers in docs/repos.md before removing.
#
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: "ubuntu-latest"
        description: "Runner label"
      package_name:
        type: string
        default: ""
        description: "Package name (for OPM verification). If empty, attempt to read from setup.py/pyproject.toml."
      python_versions:
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
        description: "JSON array of Python versions to check"
      version_file:
        type: string
        default: ""
        description: "Path to version.py (relative to repo root). If empty, auto-detects."
      install_modes:
        type: string
        default: '["regular", "editable"]'
        description: "JSON array of install modes ('regular', 'editable')"
      install_extras:
        type: string
        default: ""
        description: "pip extras to install, e.g. '[dev]'"
      system_deps:
        type: string
        default: ""
        description: "Extra apt packages beyond python3-dev and libssl-dev"
      entry_point:
        type: string
        default: ""
        description: "The expected skill entry point ID to verify with OPM"
      pr_comment:
        type: boolean
        default: true
        description: "Post/update the '🐍 Python Support' section in the PR comment"
    secrets:
      LOCALIZE_APP_PRIVATE_KEY:
        required: false
        description: "Private key for the GitHub App used to post PR comments from forks"

jobs:
  check_compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
        install-mode: ${{ fromJson(inputs.install_modes) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Checkout gh-automations scripts
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-dev libssl-dev ${{ inputs.system_deps }}
      
      - name: Install package
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install ovos-plugin-manager
          
          INSTALL_CMD="pip install"
          if [ "${{ matrix.install-mode }}" == "editable" ]; then
            INSTALL_CMD="pip install -e"
          fi
          
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            "$INSTALL_CMD" ".${{ inputs.install_extras }}"
          else
             echo "No setup.py or pyproject.toml found — check your repo root."
             exit 1
          fi
      
      - name: Verify OPM Detection
        id: opm_check
        if: ${{ steps.install.outcome == 'success' && inputs.entry_point != '' }}
        continue-on-error: true
        run: |
          python3 _gh_automations/scripts/check_opm.py --entry-point "${{ inputs.entry_point }}"

      - name: Save result
        run: |
          mkdir -p results
          STATUS="success"
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            STATUS="failure"
          elif [ "${{ inputs.entry_point }}" != "" ] && [ "${{ steps.opm_check.outcome }}" != "success" ]; then
            STATUS="opm_failure"
          fi
          echo "$STATUS" > results/${{ matrix.python-version }}-${{ matrix.install-mode }}.txt
      
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: python-result-${{ matrix.python-version }}-${{ matrix.install-mode }}
          path: results/${{ matrix.python-version }}-${{ matrix.install-mode }}.txt
          if-no-files-found: ignore
          retention-days: 1

  post_report:
    needs: check_compatibility
    if: ${{ always() && inputs.pr_comment && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout gh-automations
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Checkout calling repo
        uses: actions/checkout@v6
        with:
          path: _calling_repo/

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: results_download
          pattern: python-result-*
          merge-multiple: true
      
      - name: Checkout ovos-releases
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/ovos-releases
          path: _ovos_releases/

      - name: Run channel compatibility check
        id: channel_check
        continue-on-error: true
        run: |
          PKG="${{ inputs.package_name }}"
          if [ -z "$PKG" ]; then
            if [ -f _calling_repo/pyproject.toml ]; then
              PKG=$(grep -m 1 "^name =" _calling_repo/pyproject.toml | cut -d'"' -f2)
            elif [ -f _calling_repo/setup.py ]; then
              PKG=$(grep "name=" _calling_repo/setup.py | cut -d"'" -f2 | cut -d'"' -f2)
            fi
          fi

          VERSION_FILE="${{ inputs.version_file }}"
          if [ -n "$VERSION_FILE" ]; then
            VERSION_FILE="_calling_repo/$VERSION_FILE"
          fi
          CUR_VER=$(python3 _gh_automations/scripts/get_version.py --version-file "$VERSION_FILE" 2>/dev/null || echo "")

          if [ -n "$PKG" ] && [ -n "$CUR_VER" ]; then
            python3 _gh_automations/scripts/check_release_channels.py \
              --releases-dir _ovos_releases/ \
              --package "$PKG" \
              --version "$CUR_VER" \
              --output /tmp/channel-report.md
          fi

      - name: Aggregate results
        run: |
          VERSIONS=$(echo '${{ inputs.python_versions }}' | jq -r '. | join(",")')
          MODES=$(echo '${{ inputs.install_modes }}' | jq -r '. | join(",")')

          python3 _gh_automations/scripts/aggregate_python_results.py \
            --results-dir results_download \
            --output /tmp/python-report.md \
            --versions "$VERSIONS" \
            --modes "$MODES"

          if [ -f /tmp/channel-report.md ]; then
            echo -e "\n---\n" >> /tmp/python-report.md
            cat /tmp/channel-report.md >> /tmp/python-report.md
          fi

      - name: Generate app token for PR comment
        id: app-token
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOCALIZE_APP_ID }}
          private-key: ${{ secrets.LOCALIZE_APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Write section metadata for workflow_run posting
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        run: |
          python3 -c "
import json, pathlib
content = pathlib.Path('/tmp/python-support-section.md').read_text() if pathlib.Path('/tmp/python-support-section.md').exists() else ''
meta = {'section_id': 'python_support', 'title': '🐍 Python Support', 'content': content}
pathlib.Path('/tmp/pr-section-meta.json').write_text(json.dumps(meta))
"

      - name: Upload section for workflow_run comment posting
        if: ${{ inputs.pr_comment && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-section
          path: /tmp/pr-section-meta.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Post PR comment section
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "python_support" \
            --title "🐍 Python Support" \
            --content-file /tmp/python-report.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
